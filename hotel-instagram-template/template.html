<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

  :root{
    --navy:#1F2449;
    --navy-2:#171A38;
    --blue:#2884FF;
    --white:#FFFFFF;
    --gap:{{GAP_SCALE}};
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:{{CANVAS_W}}px; height:{{CANVAS_H}}px; overflow:hidden; }
  body{
    font-family:'Tajawal', sans-serif;
    background:var(--navy-2);
    position:relative;
    direction:rtl;
  }

  /* ---------- HERO PHOTO ---------- */
  .hero{
    position:absolute; top:0; left:0; right:0;
    height:{{HERO_H}}px;
    overflow:hidden;
  }
  .hero img{
    width:100%; height:100%; object-fit:cover;
    filter:saturate(1.06) contrast(1.04) brightness(0.97);
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(23,26,56,0.05) 0%, rgba(23,26,56,0.10) 45%, rgba(23,26,56,0.55) 78%, var(--navy-2) 100%);
  }
  .hero-topgrad{
    position:absolute; top:0; left:0; right:0; height:220px;
    background:linear-gradient(180deg, rgba(15,17,38,0.65) 0%, rgba(15,17,38,0) 100%);
    z-index:2;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:absolute; top:54px; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:0 56px; z-index:5;
  }
  .agency-badge{
    background:rgba(255,255,255,0.96);
    border-radius:20px;
    padding:14px 20px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.28);
    height:70px;
  }
  .agency-badge img{ height:100%; display:block; }

  .location-pill{
    background:rgba(255,255,255,0.94);
    border-radius:999px;
    padding:12px 22px;
    display:flex; align-items:center; gap:8px;
    font-weight:700; font-size:28px; color:var(--navy);
    box-shadow:0 8px 24px rgba(0,0,0,0.28);
    white-space:nowrap;
  }
  .location-pill svg{ width:24px; height:24px; flex:none; }

  /* ---------- HOTEL LOGO MEDALLION ---------- */
  .hotel-medallion{
    position:absolute;
    top:{{MEDALLION_TOP}}px; left:50%; transform:translateX(-50%);
    width:220px; height:220px;
    background:var(--white);
    border-radius:28px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
    z-index:6;
    padding:20px;
  }
  .hotel-medallion img{ width:100%; height:100%; object-fit:contain; }

  /* ---------- PANEL ---------- */
  .panel{
    position:absolute;
    top:{{PANEL_TOP}}px; left:0; right:0; bottom:0;
    background:
      radial-gradient(120% 160% at 15% -10%, rgba(40,132,255,0.16) 0%, rgba(40,132,255,0) 55%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    border-radius:56px 56px 0 0;
    z-index:3;
    overflow:hidden;
  }
  .panel-pattern{
    position:absolute; inset:0;
    opacity:0.05;
    background-image:
      repeating-linear-gradient(45deg, var(--white) 0 2px, transparent 2px 42px),
      repeating-linear-gradient(-45deg, var(--white) 0 2px, transparent 2px 42px);
    pointer-events:none;
  }

  .panel-content{
    position:relative; z-index:2;
    padding:{{PANEL_PAD_TOP}}px 56px {{PANEL_PAD_BOTTOM}}px 56px;
    display:flex; flex-direction:column; align-items:center;
    justify-content:{{PANEL_JUSTIFY}};
    text-align:center;
    height:{{PANEL_CONTENT_HEIGHT}};
    box-sizing:border-box;
  }

  .hotel-name{
    color:var(--white);
    font-weight:800;
    font-size:{{HOTEL_NAME_SIZE}}px;
    line-height:1.28;
    max-width:920px;
    text-shadow:0 2px 12px rgba(0,0,0,0.25);
  }

  .room-chip{
    margin-top:calc(22px * var(--gap));
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.18);
    color:var(--white);
    font-weight:500;
    font-size:32px;
    padding:10px 30px;
    border-radius:999px;
  }

  .price-row{
    margin-top:calc(38px * var(--gap));
    display:flex; align-items:stretch; gap:0;
    border-radius:26px;
    overflow:hidden;
    box-shadow:0 16px 40px rgba(0,0,0,0.35);
  }
  .price-tag{
    background:var(--blue);
    color:var(--white);
    display:flex; align-items:baseline; gap:12px;
    padding:26px 44px;
    font-weight:900;
  }
  .price-num{ font-size:88px; line-height:1; letter-spacing:-1px; }
  .price-cur{ font-size:34px; font-weight:700; }
  .price-label{
    background:rgba(255,255,255,0.08);
    color:var(--white);
    display:flex; align-items:center;
    padding:0 40px;
    font-size:36px;
    font-weight:700;
    border-right:1px solid rgba(255,255,255,0.14);
  }

  .meta-row{
    margin-top:calc(34px * var(--gap));
    display:flex; align-items:center; gap:22px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .meta-item{
    display:flex; align-items:center; gap:12px;
    color:var(--white);
    font-size:30px;
    font-weight:500;
    opacity:0.94;
  }
  .meta-item svg{ width:32px; height:32px; flex:none; color:var(--blue); }
  .meta-dot{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.35); }

  .divider{
    width:120px; height:4px; border-radius:4px;
    background:linear-gradient(90deg, transparent, var(--blue), transparent);
    margin-top:calc(40px * var(--gap));
  }

  .cta{
    margin-top:calc(34px * var(--gap));
    width:100%; max-width:820px;
    background:#25D366;
    color:var(--white);
    border-radius:24px;
    padding:26px 36px;
    display:flex; align-items:center; justify-content:center; gap:18px;
    font-weight:800; font-size:36px;
    box-shadow:0 18px 34px rgba(37,211,102,0.35);
  }
  .cta svg{ width:44px; height:44px; flex:none; }
  .cta .num{ unicode-bidi:isolate; direction:ltr; font-weight:700; }

  .footnote{
    margin-top:calc(26px * var(--gap));
    color:rgba(255,255,255,0.55);
    font-size:24px;
    font-weight:500;
    padding-bottom:{{FOOT_PAD}}px;
  }
</style>
</head>
<body>

  <div class="hero">
    <img src="{{HOTEL_PHOTO}}">
  </div>
  <div class="hero-topgrad"></div>

  <div class="topbar">
    <div class="agency-badge">
      <img src="{{AGENCY_LOGO_ICON}}">
    </div>
    <div class="location-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1F2449" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
      <span>{{LOCATION}}</span>
    </div>
  </div>

  <div class="hotel-medallion">
    <img src="{{HOTEL_LOGO}}">
  </div>

  <div class="panel">
    <div class="panel-pattern"></div>
    <div class="panel-content">
      <div class="hotel-name">{{HOTEL_NAME}}</div>
      <div class="room-chip">{{ROOM_TYPE}}</div>

      <div class="price-row">
        <div class="price-tag">
          <span class="price-num">{{PRICE}}</span>
          <span class="price-cur">{{CURRENCY}}</span>
        </div>
        <div class="price-label">لليلة الواحدة</div>
      </div>

      <div class="meta-row">
        {{MEALS_BLOCK}}
        {{DATE_BLOCK}}
        {{DISTANCE_BLOCK}}
      </div>

      <div class="divider"></div>

      <a class="cta" href="#">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.81L2 22l5.44-1.42a9.87 9.87 0 0 0 4.6 1.13h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2Zm5.8 14.13c-.24.68-1.4 1.32-1.93 1.4-.5.08-1.12.11-1.8-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.8-4.16-4.94-4.36-.14-.2-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.27-.29.58-.36.78-.36.2 0 .39 0 .56.01.18.01.42-.07.66.5.24.58.82 2 .9 2.14.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.17-.29.37-.42.5-.14.14-.28.29-.12.57.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.22 1.37.28.14.44.12.6-.07.16-.19.68-.79.86-1.06.18-.27.36-.22.6-.13.24.09 1.53.72 1.79.85.26.13.43.19.5.3.07.11.07.63-.17 1.3Z"/></svg>
        <span>احجز الآن — <span class="num">{{WHATSAPP}}</span></span>
      </a>

      <div class="footnote">العرض حتى نفاد الكمية</div>
    </div>
  </div>

</body>
</html>
