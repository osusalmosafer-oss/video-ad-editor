<title>تحدي التزم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: mobile-first single column, sticky bottom tab bar, navy hero with progress ring, orange accent for action. */
:root{
  --bg:#EDF1F8; --surface:#FFFFFF; --surface2:#E3E9F4; --ink:#0E1A2B; --muted:#56667E; --line:#D3DCEA;
  --brand:#D9400B; --on-brand:#FFFFFF; --blue:#1F5FE0;
  --good:#0A8F62; --warn:#B7791F; --bad:#C93434;
  --hero:#0E1A2B; --hero-ink:#FFFFFF; --hero-muted:#A9B8D0; --hero-brand:#FF6A3A;
  --font-display:'Lalezar','Tajawal',system-ui,sans-serif;
  --font-body:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1322; --surface:#121F36; --surface2:#1B2C4A; --ink:#EAF0FA; --muted:#93A4BF; --line:#243553;
  --brand:#FF6A3A; --on-brand:#1A0A02; --blue:#6C9BFF;
  --good:#34D399; --warn:#FBBF24; --bad:#FF7A7A;
  --hero:#16294A; --hero-ink:#FFFFFF; --hero-muted:#A9B8D0; --hero-brand:#FF6A3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1322; --surface:#121F36; --surface2:#1B2C4A; --ink:#EAF0FA; --muted:#93A4BF; --line:#243553;
  --brand:#FF6A3A; --on-brand:#1A0A02; --blue:#6C9BFF;
  --good:#34D399; --warn:#FBBF24; --bad:#FF7A7A;
  --hero:#16294A; --hero-ink:#FFFFFF; --hero-muted:#A9B8D0; --hero-brand:#FF6A3A; color-scheme:dark}

*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65;direction:rtl;
  padding-block:12px 112px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:1.45rem}h3{font-size:1.15rem}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
small,.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.flat{background:var(--surface2);border-color:transparent}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.eyebrow{font-size:.78rem;letter-spacing:.04em;color:var(--muted);font-weight:700}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .date{display:flex;flex-direction:column}
.top .date b{font-family:var(--font-display);font-weight:400;font-size:1.5rem;line-height:1.2}
.dnav{display:flex;gap:6px}
.icon-btn{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.icon-btn:disabled{opacity:.35;cursor:default}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px;display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center;
  background-image:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.045) 22px 44px)}
.ring{width:132px;height:132px;display:block}
.ring .rt{fill:none;stroke:rgba(255,255,255,.16);stroke-width:10}
.ring .rp{fill:none;stroke:var(--hero-brand);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring .rn{fill:#fff;font-family:var(--font-display);font-size:36px}
.ring .rs{fill:var(--hero-muted);font-size:11px;font-family:var(--font-body)}
.hero-info{display:flex;flex-direction:column;gap:8px;min-width:0}
.hero-info .state{font-family:var(--font-display);font-size:1.45rem;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:700;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 11px}
.chip svg.ic{width:16px;height:16px}
.lvl{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--hero-muted)}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--hero-brand);border-radius:999px}
.bar.on-card{background:var(--surface2)}
.bar.on-card>i{background:var(--brand)}
.bar.done>i{background:var(--good)}

/* trackers */
.tracker{display:flex;flex-direction:column;gap:10px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tlab{display:flex;align-items:center;gap:10px;min-width:0}
.tlab .ico{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;color:var(--brand);flex:none}
.tlab b{display:block;line-height:1.3}
.tlab small{display:block;line-height:1.3}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:12px;background:var(--surface2);font-size:1.4rem;font-weight:800;line-height:1}
.step button.plus{background:var(--brand);color:var(--on-brand)}
.step output{min-width:44px;text-align:center;font-family:var(--font-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:6px}
.quick button{flex:1;min-height:40px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);font-weight:700;font-size:.9rem}

.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:right;
  min-height:56px;padding:8px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.toggle .box{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.toggle.on{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.toggle.on .box{background:var(--good);border-color:var(--good);color:#fff}
.toggle .box svg{width:18px;height:18px;stroke-width:3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meal{flex-direction:column;justify-content:center;text-align:center;gap:6px;min-height:84px;padding:10px 6px}
.meal b{font-size:.95rem}

.msg{display:flex;gap:12px;align-items:flex-start}
.msg .quote{font-family:var(--font-display);font-size:1.25rem;line-height:1.45}
.stripe{width:5px;align-self:stretch;border-radius:3px;background:var(--brand);flex:none}
.tag{display:inline-block;font-size:.76rem;font-weight:800;border-radius:999px;padding:1px 10px;background:var(--surface2);color:var(--muted)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.tag.good{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:700;font-size:.92rem}
input[type=text],select,textarea{width:100%;font-family:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px}
textarea{min-height:110px;font-size:.85rem;direction:ltr;text-align:left}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:800;background:var(--brand);color:var(--on-brand);text-decoration:none;text-align:center}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.block{width:100%}
.btn.danger{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}

/* tab bar */
.nav{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
.nav-in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center;font-size:.76rem;font-weight:700;color:var(--muted);border-radius:12px}
.tab[aria-current=page]{color:var(--brand)}
.tab.sos{background:var(--brand);color:var(--on-brand);border-radius:16px;min-height:60px;margin-top:-14px;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 40%,transparent)}

/* progress */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:40px;border-radius:10px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column}
.stat b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;line-height:1.15;font-variant-numeric:tabular-nums}
.stat small{font-size:.78rem;line-height:1.3}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .thr{stroke:var(--brand);stroke-width:1;stroke-dasharray:3 3}
.chart .goal{stroke:var(--good);stroke-width:1.2;stroke-dasharray:4 3}
.chart .ln{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--blue);stroke:var(--surface);stroke-width:2}
.chart .b0{fill:var(--surface2)}.chart .b1{fill:var(--bad)}.chart .b2{fill:var(--warn)}.chart .b3{fill:var(--good)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:.74rem;text-align:center;color:var(--muted);font-weight:700}
.cal button,.cal i{aspect-ratio:1;border-radius:9px;font-size:.82rem;font-weight:700;display:grid;place-items:center;font-style:normal}
.cal button{background:var(--surface2);color:var(--muted);font-variant-numeric:tabular-nums}
.cal .c1{background:color-mix(in srgb,var(--bad) 30%,var(--surface));color:var(--ink)}
.cal .c2{background:color-mix(in srgb,var(--warn) 35%,var(--surface));color:var(--ink)}
.cal .c3{background:var(--good);color:#fff}
.cal .today{outline:2.5px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:5px;vertical-align:-1px;background:var(--surface2)}
.legend .l1::before{background:color-mix(in srgb,var(--bad) 30%,var(--surface))}
.legend .l2::before{background:color-mix(in srgb,var(--warn) 35%,var(--surface))}
.legend .l3::before{background:var(--good)}
.ladder{display:flex;flex-direction:column;gap:6px}
.ladder div{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:12px;background:var(--surface2);font-weight:700}
.ladder div.ok{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{border-radius:14px;padding:10px 12px;background:var(--surface2);display:flex;flex-direction:column;gap:2px;opacity:.6}
.badge b{line-height:1.3}.badge small{line-height:1.3}
.badge.got{opacity:1;background:color-mix(in srgb,var(--brand) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--brand) 40%,var(--surface))}
.ml{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.ml:last-child{border:0}

/* plan */
details.pl{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0}
details.pl summary{list-style:none;cursor:pointer;padding:14px 16px;font-family:var(--font-display);font-size:1.15rem;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px}
details.pl summary::-webkit-details-marker{display:none}
details.pl summary::after{content:"+";font-family:var(--font-body);font-weight:800;font-size:1.4rem;color:var(--brand)}
details.pl[open] summary::after{content:"−"}
.pl-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.pl-body ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.callout{background:var(--surface2);border-radius:12px;padding:10px 12px;font-weight:500}

/* sos overlay */
.sos-wrap{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sos-in{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.timer{background:var(--hero);color:#fff;border-radius:20px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:4px;
  background-image:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.045) 22px 44px)}
.timer output{font-family:var(--font-display);font-size:4rem;line-height:1.1;font-variant-numeric:tabular-nums;direction:ltr}
.timer small{color:var(--hero-muted)}
.why{display:flex;flex-wrap:wrap;gap:8px}
.why button{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.why button[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.chips{justify-content:center}.stats{grid-template-columns:repeat(2,1fr)}}
</style>

<div class="app" id="view"></div>
<nav class="nav" aria-label="التنقل"><div class="nav-in" id="nav"></div></nav>
<div id="sos" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','ar');

/* ---------- helpers ---------- */
var DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var DS=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var KEY='itazim_v1', mem=null;
function p2(n){return n<10?'0'+n:''+n}
function ds(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function parse(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ds(d)}
function num(v){var t=String(v).replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c)}).replace('٫','.').replace(',','.');var n=parseFloat(t);return isNaN(n)?null:n}
function r1(n){return Math.round(n*10)/10}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var $=function(s){return document.querySelector(s)};
var TODAY=ds(new Date());

var ICONS={
 drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
 bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
 cookie:'<circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1"/><circle cx="14.5" cy="9" r="1"/><circle cx="14" cy="15" r="1"/><circle cx="9" cy="15" r="1"/>',
 moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
 car:'<path d="M3 15l2-6h14l2 6v4h-3v-2H6v2H3z"/><circle cx="7.5" cy="14" r="1"/><circle cx="16.5" cy="14" r="1"/>',
 scale:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 10a4 4 0 0 1 8 0"/><path d="M12 10l2-2"/>',
 flame:'<path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
 sleep:'<path d="M4 18V7M4 14h16v4M20 14v-2a3 3 0 0 0-3-3h-6v5"/><circle cx="7.5" cy="11" r="1.5"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 home:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',
 alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
 list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.5M4 12h.5M4 18h.5"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
 prev:'<path d="M9 5l7 7-7 7"/>', next:'<path d="M15 5l-7 7 7 7"/>',
 share:'<path d="M12 15V3M7 8l5-5 5 5M5 14v6h14v-6"/>'
};
function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>'}

/* ---------- state ---------- */
function fresh(){return {profile:{name:'',height:null,startWeight:87,goal:65,startDate:TODAY,freeDow:3},days:{},urges:[]}}
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem?JSON.parse(mem):null}
var S=load()||fresh();
S.profile=Object.assign(fresh().profile,S.profile||{});S.days=S.days||{};S.urges=S.urges||[];
function save(){var s=JSON.stringify(S);mem=s;try{localStorage.setItem(KEY,s)}catch(e){}}
var ui={tab:'today',date:TODAY,range:'week',moff:0,sos:null,exp:false};

function blank(){return {water:0,walk:0,sweets:0,night:false,car:false,sleep:0,weight:null,meals:{b:false,l:false,d:false},touched:false}}
function getDay(s){return S.days[s]||blank()}
function setDay(s,fn){if(!S.days[s])S.days[s]=blank();fn(S.days[s]);S.days[s].touched=true;save()}
function isFree(s){return parse(s).getDay()===+S.profile.freeDow}
function mealsN(d){return (d.meals.b?1:0)+(d.meals.l?1:0)+(d.meals.d?1:0)}
function score(s){
  var d=S.days[s];if(!d)return 0;var sc=0;
  sc+=Math.min(d.water/8,1)*15;
  sc+=Math.min(d.walk/30,1)*15;
  if(isFree(s))sc+=d.sweets<=2?20:(d.sweets==3?8:0);else sc+=[20,12,5][d.sweets]||0;
  if(d.night)sc+=15;
  if(d.car)sc+=5;
  sc+=mealsN(d)*20/3;
  sc+=d.sleep>=6.5?10:(d.sleep>=5.5?5:0);
  return Math.round(sc);
}
function committed(s){return !!S.days[s]&&score(s)>=70}

var LEVELS=[[0,'بداية'],[300,'منطلق'],[800,'ملتزم'],[1600,'حديدي'],[3000,'بطل']];
function stats(){
  var keys=Object.keys(S.days).filter(function(k){return S.days[k].touched}).sort();
  var st={days:keys.length,best:0,cur:0,committed:0,resisted:0,points:0,night:0,water:0,sweetFree:0,walk:0,bestSweet:0,latest:+S.profile.startWeight,lost:0,hasW:false};
  var i,k,d;
  for(i=0;i<keys.length;i++){k=keys[i];d=S.days[k];var sc=score(k);st.points+=sc;
    if(sc>=70)st.committed++;if(d.night)st.night++;if(d.water>=8)st.water++;if(d.touched&&d.sweets===0)st.sweetFree++;st.walk+=d.walk;
    if(d.weight!=null){st.latest=d.weight;st.hasW=true}}

    '<div><div class="ml"><span>وزن البداية</span><b class="num">'+S.profile.startWeight+' كجم</b></div><div class="ml"><span>نزل حتى الآن</span><b class="num">'+(st.lost>0?st.lost:0)+' كجم</b></div><div class="ml"><span>باقي للهدف '+S.profile.goal+'</span><b class="num">'+(rem>0?rem:0)+' كجم</b></div>'+
    (rem>0?'<div class="ml"><span>الوصول بوتيرة صحية 0.6 كجم أسبوعياً</span><b class="num">'+wks+' أسبوعاً · '+MONTHS[fd.getMonth()]+' '+fd.getFullYear()+'</b></div>':'')+bmi+'</div></section>';
  out+='<section class="card"><h3>محطات الوزن</h3><div class="ladder">'+milestones(st.latest)+'</div><small>ثبّت أسبوعين عند كل محطة قبل ما تكمل. هذا اللي يمنع الرجوع للـ90.</small></section>';
  out+='<section class="card"><div class="sec-title"><h3>أوسمتك</h3><small>'+BADGES.filter(function(b){return b[2](st)}).length+' من '+BADGES.length+'</small></div><div class="badges">'+BADGES.map(function(b){var got=b[2](st);return '<div class="badge'+(got?' got':'')+'"><b>'+(got?'✓ ':'')+b[0]+'</b><small>'+b[1]+'</small></div>'}).join('')+'</div></section>';
  return out;
}

function pl(title,body,open){return '<details class="pl"'+(open?' open':'')+'><summary>'+title+'</summary><div class="pl-body">'+body+'</div></details>'}
function vPlan(){
  var o='<div class="top"><div class="date"><span class="eyebrow">خطتك</span><b>تناسب حياتك في مكة</b></div></div>';
  o+=pl('قواعد الأسبوع الأول (ثلاث فقط)','<ul><li><b>المطبخ مقفل بعد 9:30م.</b> أغسل أسناني، أنهي اليوم.</li><li><b>ما آكل وأنا أسوق.</b> السيارة ليست مطعماً.</li><li><b>8 أكواب ماء.</b> كوب مع كل وجبة، وكوب قبل كل سناك.</li></ul><div class="callout">الأسبوع الثاني نضيف: صحن الغداء. الأسبوع الثالث: الحلا المخطط. لا نغيّر كل شي مرة وحدة، لأن هذا اللي كان يرجعك للبداية.</div>',true);
  o+=pl('الفطور في الطريق','<ul><li>جهّزه الليلة اللي قبل أو خذه جاهز، وكُله <b>في المكتب أو وأنت واقف في مكان</b>، مو وأنت تسوق.</li><li>بروتين الصبح يهدّي الشهية ساعات: بيضتان مع خبز بر أو صامولي حبوب وخيار، أو فول بنص رغيف، أو زبادي مع شوفان وتمرة.</li><li>الفطور وجبة كاملة. ما يُضاف له كيك أو عصير أو بسكويت.</li></ul>');
  o+=pl('الغداء: طريقة الصحن في البوفيه','<ul><li><b>صحن واحد فقط وبدون إعادة.</b></li><li>ابدأ بالسلطة وتملأ نص الصحن.</li><li>ربع الصحن دجاج أو لحم مشوي أو مسلوق، وربع رز بقدر قبضة يدك، أبيض أو ملون.</li><li>اترك العصير والحلا. ماء أو شاي.</li><li>كُل جالس وببطء، وضع الملعقة بين اللقمات. الشبع يحتاج 20 دقيقة تقريباً.</li><li>بعد الغداء امش 10 دقائق.</li></ul><div class="callout">البوفيه المفتوح فخ الكمية، لكنه فرصتك: سلطة ودجاج ولحم ورز، كلها مناسبة إذا التزمت بالصحن.</div>');
  o+=pl('السناكات الثلاثة (مخططة)','<ul><li>ثلاث سناكات بأوقات محددة: 10 ص، 4 ع، 7 م.</li><li>اختر من: ثمرة فاكهة، حفنة مكسرات صغيرة (20 جم)، زبادي أو لبن، خيار وجزر، بيضة مسلوقة.</li><li>جهّزها في علبة من البيت. ما تشتري سناك من البقالة أو محطة البنزين.</li><li>قبل كل سناك: كوب ماء وانتظر خمس دقائق.</li></ul>');
  o+=pl('العشاء وإغلاق المطبخ','<ul><li>قدّم العشاء قبل 9م بدل ما بعد 10، وخلّه خفيفاً: شوربة، تونة أو دجاج مع خضار، بيض، زبادي.</li><li>بعد العشاء اغسل أسنانك. هذه إشارة للدماغ أن المطبخ قفل.</li><li>جوعان بعد 9:30؟ كوب ماء، شاي أخضر أو بابونج، أو خيارة. وإذا ما راحت الرغبة فاضغط زر الطوارئ.</li><li>الأكل الليلي يزيد مع قلة النوم. نومك متقطع، فحاول تثبّت موعد نوم وتبعد الجوال ساعة قبله.</li></ul>');
  o+=pl('القهوة والحلا (اللي يجرّك)','<ul><li>الحلا عندك مرتبط بالقهوة السوداء. اكسر الارتباط: قهوتك بهيل أو زعفران أو قرفة، بدون شي بجنبها.</li><li>الحلا المخطط مرة واحدة في اليوم، في وقت محدد، <b>جالس وفي صحن</b>: تمرة، أو مربعين شوكولاتة داكنة 85%.</li><li>ما تخزّن شوكولاتة ولا بف ولا بسكويت في البيت أو السيارة أو المكتب. اللي ما تشتريه ما تأكله.</li><li>إذا أهلك يشترونها، اطلب منهم يحطونها بعيد عن نظرك.</li><li>الشيبس والعصير البارد: استبدلهم بفشار بدون زبدة، وماء بارد بنعناع وليمون.</li></ul>');
  o+=pl('جلسة الأربعاء (الاستراحة)','<ul><li>قبل ما تروح: وجبة فيها بروتين وكوبين ماء، ولا تروح جوعان.</li><li>خذ صحناً صغيراً <b>واحداً</b>، واجلس بعيد عن السفرة.</li><li>اختر الأكلة اللي تحبها فعلاً، مو من كل شي شوية.</li><li>حلا: قطعة وحدة تأكلها ببطء.</li><li>هذه وجبتك الحرة، تتمتع فيها بلا ذنب. لو زادت، الوجبة اللي بعدها على الخطة والأسبوع ما ينهار.</li></ul>');
  o+=pl('المشي في مكة','<ul><li>الحر يعطّل المشي، فانتقل لأوقات أخف: بعد الفجر، أو بعد المغرب، أو داخل مجمع مكيّف.</li><li>مو لازم 30 دقيقة دفعة وحدة: ثلاث مرات 10 دقائق بعد كل وجبة تكفي وتفيد السكر.</li><li>في الدوام: أوقف سيارتك أبعد، وقم كل ساعة دقيقتين من المكتب.</li></ul>');
  o+=pl('كيف ما ترجع للـ90','<ul><li>أنت نزلت إلى 70 ثلاث مرات. أي أنك تقدر. الخلل في الحرمان الشديد، ثم الانفجار.</li><li>الوتيرة الصحية 0.5 إلى 0.8 كجم أسبوعياً. 22 كجم تأخذ حوالي 7 إلى 9 أشهر، وهدف 65 نراجعه مع طولك.</li><li>الكيتو أراحك في الشهية لكنه أتعبك وأتعب اللي حولك. نبقى على أكل طبيعي من مائدتك، وحلا مخطط، وبروتين كافي.</li><li>عند كل محطة (80، 75، 70...) ثبّت أسبوعين، لا ترفع الحمية.</li><li>حتى لو يوم سيء: سجّله. اللي يختفي من التسجيل هو اللي يرجع.</li></ul>');
  o+=pl('صحتك والسكري','<ul><li>الحلا لوحده ما يسبّب السكري مباشرة، لكن زيادة الوزن ودهون البطن عامل رئيسي. تخوفك في محله، وهذا يخليك تتحرك مبكراً.</li><li>اعمل تحليل سكر صائم وسكر تراكمي (HbA1c) في مركز صحي أو مختبر. ممكن تضيف الدهون والغدة الدرقية. النتيجة تعطيك رقم تبني عليه، وغالباً تريّحك.</li><li>هذا التطبيق أداة متابعة وتحفيز وليس بديلاً عن الطبيب أو أخصائي التغذية.</li></ul>');
  return o;
}
function vSettings(){
  var P=S.profile,o='<div class="top"><div class="date"><span class="eyebrow">الإعدادات</span><b>بياناتك وإعداداتك</b></div></div>';
  o+='<section class="card"><h3>بياناتك</h3>'+
   '<div class="field"><label for="f_name">الاسم</label><input type="text" id="f_name" data-set="name" value="'+esc(P.name)+'"></div>'+
   '<div class="grid2"><div class="field"><label for="f_h">الطول (سم)</label><input type="text" id="f_h" inputmode="decimal" data-set="height" value="'+(P.height||'')+'" placeholder="مثال 172"></div>'+
   '<div class="field"><label for="f_sw">وزن البداية (كجم)</label><input type="text" id="f_sw" inputmode="decimal" data-set="startWeight" value="'+P.startWeight+'"></div></div>'+
   '<div class="grid2"><div class="field"><label for="f_g">الهدف النهائي (كجم)</label><input type="text" id="f_g" inputmode="decimal" data-set="goal" value="'+P.goal+'"></div>'+
   '<div class="field"><label for="f_fd">يوم الوجبة الحرة</label><select id="f_fd" data-set="freeDow">'+DAYS.map(function(n,i){return '<option value="'+i+'"'+(+P.freeDow===i?' selected':'')+'>'+n+'</option>'}).join('')+'</select></div></div>'+
   '<small>لما تجيب وزنك وطولك من المتر والميزان، عدّلهم هنا وستحسب لك المحطات والمؤشرات.</small></section>';
  o+='<section class="card"><h3>نسخة احتياطية</h3><p>بياناتك محفوظة في متصفح جوالك فقط. انسخها أسبوعياً وأرسلها لمجموعة الواتساب الخاصة.</p>'+
   '<div class="row-btns"><button class="btn" data-act="copybk">انسخ بياناتي</button><a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent('نسخة التزم الاحتياطية '+TODAY+'\n'+JSON.stringify(S))+'">أرسلها للواتساب</a></div>'+
   '<div class="field"><label for="imp">استرجاع من نسخة</label><textarea id="imp" placeholder="الصق النسخة هنا"></textarea></div><button class="btn ghost" data-act="import">استرجع</button></section>';
  o+='<section class="card"><h3>مسح كل شي</h3>'+(ui.exp?'<p>متأكد؟ كل سجلك سيُحذف ولا يمكن التراجع.</p><div class="row-btns"><button class="btn danger" data-act="reset2">نعم، امسح</button><button class="btn ghost" data-act="reset0">لا</button></div>':'<button class="btn danger" data-act="reset1">امسح البيانات</button>')+'</section>';
  return o;
}
var TABS=[['today','اليوم','home'],['progress','التقدم','chart'],['sos','طوارئ','alert'],['plan','الخطة','list'],['settings','إعدادات','gear']];
function renderNav(){
  $('#nav').innerHTML=TABS.map(function(t){return '<button class="tab'+(t[0]==='sos'?' sos':'')+'" data-act="tab" data-t="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+ic(t[2])+'<span>'+t[1]+'</span></button>'}).join('');
}
function render(){
  var f={today:vToday,progress:vProgress,plan:vPlan,settings:vSettings}[ui.tab]||vToday;
  $('#view').innerHTML=f();renderNav();
}

/* ---------- SOS ---------- */
var DUR=15*60, tick=null;
var TIPS={
 real:'جوع حقيقي: كُل وجبة صغيرة فيها بروتين، مثل بيضة مسلوقة أو زبادي أو تونة، جالساً وبالملعقة وببطء.',
 bored:'ملل: غيّر النشاط الآن. مكالمة صديق، دش، 10 دقائق مشي، أو رتّب شي في البيت. الملل يمر.',
 stress:'توتر: تنفس شهيق 4 ثوانٍ، احبس 4، زفير 6. كرره خمس مرات ثم اسأل نفسك: هل ما زلت أريد الأكل؟',
 tired:'تعب أو سهر: الجسم يطلب طاقة سريعة. اشرب ماء، نم مبكراً، والصباح قهوتك مع بيضة تعوّضك.',
 habit:'عادة: العادة تضعف كل مرة تقاومها. ابعد عن الثلاجة، ولا تفتحها بدون سبب.'
};
function renderSos(){
  var s=ui.sos,el=$('#sos');
  if(!s){el.hidden=true;el.innerHTML='';clearInterval(tick);return}
  var left=Math.max(0,DUR-Math.floor((Date.now()-s.t0)/1000));
  var steps=['اشرب كوب ماء كبير. العطش يتنكر أحياناً في شكل جوع.','قم من مكانك وغيّر المكان: امش ثلاث دقائق أو اطلع خارج المطبخ.','اغسل أسنانك أو امضغ علكة نعناع بدون سكر.','اعمل قهوتك السودا بهيل أو قرفة، بدون حلا بجنبها.'];
  var h='<div class="sos-wrap" role="dialog" aria-modal="true" aria-label="وضع الطوارئ"><div class="sos-in">'+
   '<div class="top"><div class="date"><span class="eyebrow">وضع الطوارئ</span><b>الرغبة موجة، لا تغرق فيها</b></div><button class="icon-btn" data-act="sosclose" aria-label="إغلاق">✕</button></div>'+
   '<div class="timer"><small>انتظر قبل ما تقرر</small><output id="sosT">'+mmss(left)+'</output><small>معظم الرغبات تضعف خلال 15 دقيقة</small></div>'+
   '<section class="card"><h3>افعل بالترتيب</h3>'+steps.map(function(t,i){var on=s.steps[i];return '<button class="toggle'+(on?' on':'')+'" data-act="sosstep" data-i="'+i+'" aria-pressed="'+!!on+'"><span>'+t+'</span><span class="box">'+ic('check')+'</span></button>'}).join('')+'</section>'+
   '<section class="card"><h3>إيش وراء الرغبة؟</h3><div class="why">'+[['real','جوع حقيقي'],['bored','ملل'],['stress','توتر'],['tired','تعب أو سهر'],['habit','عادة']].map(function(w){return '<button data-act="why" data-w="'+w[0]+'" aria-pressed="'+(s.why===w[0])+'">'+w[1]+'</button>'}).join('')+'</div>'+(s.why?'<div class="callout">'+TIPS[s.why]+'</div>':'')+'</section>'+
   '<div class="grid2"><button class="btn" data-act="sosyes">غلبتها</button><button class="btn ghost" data-act="sosate">أكلت</button></div></div></div>';
  el.innerHTML=h;el.hidden=false;
}
function mmss(n){return p2(Math.floor(n/60))+':'+p2(n%60)}
function openSos(){
  ui.sos={t0:Date.now(),steps:[],why:null};renderSos();
  clearInterval(tick);tick=setInterval(function(){
    var o=$('#sosT');if(!o||!ui.sos){clearInterval(tick);return}
    var left=Math.max(0,DUR-Math.floor((Date.now()-ui.sos.t0)/1000));o.textContent=mmss(left);
  },1000);
}
function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){e.hidden=true},2600)}

/* ---------- events ---------- */
var LIM={water:[0,20],walk:[0,300],sweets:[0,9],sleep:[0,14]};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,D=b.dataset;
  if(a==='tab'){if(D.t==='sos'){openSos();return}ui.tab=D.t;ui.exp=false;render();window.scrollTo(0,0)}
  else if(a==='dnav'){var n=addDays(ui.date,+D.n);if(n<=TODAY){ui.date=n;render()}}
  else if(a==='goto'){ui.date=D.date;ui.tab='today';render();window.scrollTo(0,0)}
  else if(a==='adj'){var k=D.k,dl=+D.d;setDay(ui.date,function(d){var v=Math.round((d[k]+dl)*10)/10;d[k]=Math.min(LIM[k][1],Math.max(LIM[k][0],v))});render()}
  else if(a==='tog'){setDay(ui.date,function(d){d[D.k]=!d[D.k]});render()}
  else if(a==='meal'){setDay(ui.date,function(d){d.meals[D.k]=!d.meals[D.k]});render()}
  else if(a==='range'){ui.range=D.r;render()}
  else if(a==='mnav'){ui.moff=Math.min(0,ui.moff+(+D.n));render()}
  else if(a==='sosclose'){ui.sos=null;renderSos()}
  else if(a==='sosstep'){ui.sos.steps[+D.i]=!ui.sos.steps[+D.i];renderSos()}
  else if(a==='why'){ui.sos.why=D.w;renderSos()}
  else if(a==='sosyes'){S.urges.push({t:Date.now(),res:true,why:ui.sos.why});save();ui.sos=null;renderSos();render();toast('غلبتها. +10 نقاط')}
  else if(a==='sosate'){S.urges.push({t:Date.now(),res:false,why:ui.sos.why});save();ui.sos=null;renderSos();render();toast('عادي. الوجبة الجاية على الخطة وسجّلها بصدق')}
  else if(a==='copybk'){var txt=JSON.stringify(S);
    var ok=function(){toast('تم النسخ. الصقها في مجموعتك')};
    var fb=function(){var t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(x){toast('حدد النص يدوياً من خانة الاسترجاع')}t.remove()};
    try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(x){fb()}}
  else if(a==='import'){try{var j=JSON.parse($('#imp').value.replace(/^[^{]*/,''));if(!j||!j.days)throw 0;S=j;S.profile=Object.assign(fresh().profile,S.profile||{});S.urges=S.urges||[];save();render();toast('تم الاسترجاع')}catch(x){toast('النسخة غير صالحة')}}
  else if(a==='reset1'){ui.exp=true;render()}
  else if(a==='reset0'){ui.exp=false;render()}
  else if(a==='reset2'){S=fresh();save();ui.exp=false;ui.date=TODAY;render();toast('تم المسح')}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.w){var v=num(t.value);setDay(ui.date,function(d){d.weight=(v!=null&&v>20&&v<400)?v:null});render()}
  else if(t.dataset.set){var k=t.dataset.set,val=t.value;
    if(k==='name')S.profile.name=val.trim();
    else if(k==='freeDow')S.profile.freeDow=+val;
    else{var n=num(val);if(k==='height')S.profile.height=(n&&n>100&&n<250)?n:null;else if(n&&n>20&&n<400)S.profile[k]=n}
    save();toast('تم الحفظ')}
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&ui.sos)renderSos()});
render();
})();
</script>
