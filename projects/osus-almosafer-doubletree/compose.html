<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Tajawal;src:url(fonts/Tajawal-400.ttf);font-weight:400}
@font-face{font-family:Tajawal;src:url(fonts/Tajawal-500.ttf);font-weight:500}
@font-face{font-family:Tajawal;src:url(fonts/Tajawal-700.ttf);font-weight:700}
@font-face{font-family:Tajawal;src:url(fonts/Tajawal-800.ttf);font-weight:800}
@font-face{font-family:Tajawal;src:url(fonts/Tajawal-900.ttf);font-weight:900}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="plan.js"></script>
<script src="caps.js"></script>
<script>
const W=1080,H=1920,FPS=30;
const WA_PATH='M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z';
const C=document.getElementById('c'), X=C.getContext('2d',{alpha:false});
let T={}, IMG={}, FRAME=null;

/* ── أدوات ───────────────────────────────────────────── */
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut =k=>1-Math.pow(1-cl(k,0,1),3);
const eIn  =k=>Math.pow(cl(k,0,1),3);
const eBack=k=>{k=cl(k,0,1);const c=1.70158,c3=c+1;return 1+c3*Math.pow(k-1,3)+c*Math.pow(k-1,2);};
const eExpo=k=>k>=1?1:1-Math.pow(2,-9*cl(k,0,1));
function hx(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function shadow(c,col,blur,dy){c.shadowColor=col;c.shadowBlur=blur;c.shadowOffsetY=dy;}
function noShadow(c){c.shadowColor='transparent';c.shadowBlur=0;c.shadowOffsetY=0;}
function ar(txt,size,weight,color,x,y,align){X.font=`${weight} ${size}px Tajawal, sans-serif`;
  X.direction='rtl';X.textAlign=align||'right';X.textBaseline='alphabetic';X.fillStyle=color;X.fillText(txt,x,y);}
function ltr(txt,size,weight,color,x,y,align){X.font=`${weight} ${size}px Tajawal, sans-serif`;
  X.direction='ltr';X.textAlign=align||'center';X.textBaseline='alphabetic';X.fillStyle=color;X.fillText(txt,x,y);}

/* نافذة ظهور/اختفاء: ترجع 0..1 للدخول و0..1 للخروج */
function win(t,s,e,ein,eout){
  if(t<s-0.001||t>e) return null;
  const a=cl((t-s)/ein,0,1), b=cl((e-t)/eout,0,1);
  return {in:a,out:b,k:Math.min(eOut(a),eOut(b)),life:(t-s)};
}

/* ── نبضة الإيقاع ────────────────────────────────────── */
function punch(t){           // زوم سريع يرجع — يعطي إحساس القطع
  let s=1;
  for(const b of BEATS){
    const d=t-b.t;
    if(d>=-0.06 && d<0.42){
      const k=cl((d+0.06)/0.48,0,1);
      s*=1+0.085*(1-eExpo(k))*Math.cos(k*2.6);
    }
  }
  return s;
}
function sweepAt(t){         // كشيدة زرقاء تمرّ بلحظة النبضة
  for(const b of BEATS){
    if(!b.sweep) continue;
    const d=t-b.t;
    if(d>=-0.16 && d<=0.20) return {k:(d+0.16)/0.36, dir:b.dir};
  }
  return null;
}

/* ── طبقة الفيديو ────────────────────────────────────── */
function videoLayer(t){
  X.fillStyle=T.deep; X.fillRect(0,0,W,H);
  if(!FRAME) return;
  // انجراف بطيء داخل كل مقطع + نبضة
  let seg=0; for(const b of BEATS){ if(t>=b.t) seg=b.t; }
  const drift=1.004+0.030*cl((t-seg)/6.5,0,1);
  const s=drift*punch(t);
  const w=W*s, h=H*s;
  X.save(); X.drawImage(FRAME,(W-w)/2,(H-h)/2,w,h); X.restore();
}

/* ── الكشيدة الزرقاء ─────────────────────────────────── */
function sweep(t){
  const sw=sweepAt(t); if(!sw) return;
  const k=cl(sw.k,0,1), band=760;
  const span=W+H*0.55+band;
  const p=(-band)+span*eExpo(k);
  X.save();
  X.translate(sw.dir>0?0:W,0); X.scale(sw.dir>0?1:-1,1);
  const g=X.createLinearGradient(p,0,p+band,0);
  const a=Math.sin(Math.PI*k);
  g.addColorStop(0,   hx(T.acc,0));
  g.addColorStop(0.34,hx(T.acc,0.92*a));
  g.addColorStop(0.50,`rgba(255,255,255,${0.80*a})`);
  g.addColorStop(0.66,hx(T.acc,0.92*a));
  g.addColorStop(1,   hx(T.acc,0));
  X.fillStyle=g;
  X.beginPath(); X.moveTo(p,-10); X.lineTo(p+band,-10);
  X.lineTo(p+band-H*0.55,H+10); X.lineTo(p-H*0.55,H+10); X.closePath(); X.fill();
  X.restore();
}

/* ── شعار صغير ثابت + شريط التقدّم ───────────────────── */
function chrome(t){
  const L=IMG.logo;
  if(L){
    const w=286, h=w*L.height/L.width, x=48, y=186;
    const a=cl(t/0.6,0,1)*(t>SRC_END?cl((SRC_END+0.4-t)/0.4,0,1):1);
    if(a>0.01){
      X.save(); X.globalAlpha=0.94*a;
      shadow(X,'rgba(0,0,0,.38)',26,7);
      X.fillStyle='rgba(255,255,255,.96)'; rr(X,x-18,y-16,w+36,h+32,22); X.fill(); noShadow(X);
      X.globalAlpha=a; X.drawImage(L,x,y,w,h); X.restore();
    }
  }
  const p=cl(t/TOTAL,0,1);            // شريط تقدّم من اليمين لليسار
  X.fillStyle='rgba(255,255,255,.13)'; rr(X,60,1601,W-120,6,3); X.fill();
  X.fillStyle=hx(T.acc,.92); rr(X,60+(W-120)*(1-p),1601,(W-120)*p,6,3); X.fill();
}

/* ── الكابشن المتزامن ────────────────────────────────── */
function captions(t){
  let cap=null;
  for(const c of CAPS){ if(t>=c.s-0.06 && t<c.e+0.06){ cap=c; break; } }
  if(!cap) return;
  const life=t-cap.s, dur=cap.e-cap.s;
  const a=Math.min(cl(life/0.13+0.35,0,1), cl((cap.e+0.06-t)/0.12,0,1));
  const SZ=58, GAP=18, PAD=34;
  X.font=`800 ${SZ}px Tajawal, sans-serif`; X.direction='rtl';
  const ws=cap.w.map(o=>({...o, w:X.measureText(o.t).width}));
  const tw=ws.reduce((s,o)=>s+o.w,0)+GAP*(ws.length-1);
  const bw=Math.min(tw+PAD*2, CAPBOX.x1-CAPBOX.x0);
  let cx=W/2;                                        // الوسط، إلا إذا خرج عن الحدّ الآمن
  if(cx+bw/2 > CAPBOX.x1) cx=CAPBOX.x1-bw/2;
  if(cx-bw/2 < CAPBOX.x0) cx=CAPBOX.x0+bw/2;
  const bh=SZ+46, by=CAPBOX.y, bx=cx-bw/2;
  const pop=1+0.035*(1-eOut(cl(life/0.16,0,1)));
  X.save(); X.globalAlpha=a;
  X.translate(cx,by+bh/2); X.scale(pop,pop); X.translate(-cx,-(by+bh/2));
  shadow(X,'rgba(0,0,0,.50)',30,10);
  X.fillStyle=hx(T.deep,0.86); rr(X,bx,by,bw,bh,bh/2); X.fill(); noShadow(X);
  X.strokeStyle='rgba(255,255,255,.10)'; X.lineWidth=2; rr(X,bx+1,by+1,bw-2,bh-2,bh/2); X.stroke();
  let x=cx+tw/2;                                   // RTL: نبدأ من اليمين
  X.textAlign='right'; X.textBaseline='alphabetic';
  for(const o of ws){
    X.font=`800 ${SZ}px Tajawal, sans-serif`;
    X.fillStyle=o.h?T.acc:T.ink;
    X.fillText(o.t, x, by+bh-32);
    x-=o.w+GAP;
  }
  X.restore();
}

/* ── «انتبه» ─────────────────────────────────────────── */
function alertCard(t){
  const S=SCENES.alert, w=win(t,S.s,S.e,0.42,0.40); if(!w) return;
  const a=w.k, sh=w.life<0.5?Math.sin(w.life*54)*7*(1-w.life/0.5):0;
  const sc=lerp(0.86,1,eBack(w.in));
  const pulse=0.5+0.5*Math.sin(w.life*7.2);
  X.save();
  X.translate(S.x+S.w/2+sh, S.y+S.h/2); X.scale(sc,sc); X.translate(-S.w/2,-S.h/2);
  X.globalAlpha=a;
  // هالة نابضة
  X.save(); X.globalAlpha=a*0.30*pulse; X.fillStyle=T.warn;
  rr(X,-16,-16,S.w+32,S.h+32,42); X.fill(); X.restore();
  shadow(X,'rgba(0,0,0,.5)',44,16);
  X.fillStyle=hx(T.bg,0.95); rr(X,0,0,S.w,S.h,34); X.fill(); noShadow(X);
  X.strokeStyle=hx(T.warn,0.85); X.lineWidth=4; rr(X,2,2,S.w-4,S.h-4,32); X.stroke();
  // مثلث تحذير
  const cx=118, cy=S.h/2, r=62;
  X.save(); X.translate(cx,cy);
  X.fillStyle=T.warn; X.beginPath();
  X.moveTo(0,-r); X.lineTo(r*0.92,r*0.70); X.lineTo(-r*0.92,r*0.70); X.closePath();
  X.lineJoin='round'; X.lineWidth=16; X.strokeStyle=T.warn; X.stroke(); X.fill();
  X.fillStyle=T.bg; X.fillRect(-7,-30,14,44); X.beginPath(); X.arc(0,32,9,0,7); X.fill();
  X.restore();
  ar(TEXTS.alert,106,900,T.ink,S.w-44,S.h/2+37);
  X.restore();
}

/* ── كرت الخريطة عند مكان الإشارة ────────────────────── */
function mapCard(t,S){
  const w=win(t,S.s,S.e,0.52,0.42); if(!w) return;
  const img=IMG[S.img]; if(!img) return;
  const a=w.k, sc=lerp(0.88,1,eBack(w.in)), dx=(1-eOut(w.out))*54;
  const cx=S.x+S.w/2, cy=S.y+S.h/2;
  // خط موصّل من مكان إشارته إلى الكرت
  const lk=cl((w.life-0.10)/0.42,0,1)*w.out;
  if(lk>0.02){
    X.save(); X.globalAlpha=0.85*lk;
    X.strokeStyle=T.acc; X.lineWidth=5; X.setLineDash([16,12]);
    X.beginPath(); X.moveTo(S.from[0],S.from[1]);
    X.lineTo(lerp(S.from[0],S.x+16,eOut(lk)), lerp(S.from[1],S.y+S.h-70,eOut(lk)));
    X.stroke(); X.setLineDash([]);
    X.fillStyle=T.acc; X.beginPath(); X.arc(S.from[0],S.from[1],11,0,7); X.fill();
    X.globalAlpha=0.30*lk; X.beginPath(); X.arc(S.from[0],S.from[1],11+16*(0.5+0.5*Math.sin(w.life*7)),0,7); X.fill();
    X.restore();
  }
  X.save(); X.globalAlpha=a;
  X.translate(cx+dx,cy); X.scale(sc,sc); X.translate(-S.w/2,-S.h/2);
  shadow(X,'rgba(0,0,0,.55)',52,18);
  X.fillStyle=T.bg; rr(X,0,0,S.w,S.h,30); X.fill(); noShadow(X);
  X.save(); rr(X,0,0,S.w,S.h,30); X.clip();
  X.drawImage(img,0,0,S.w,S.h);                      // نسبة أصلية 9:16 — بلا قصّ ولا ضغط
  X.restore();
  X.strokeStyle=hx(T.acc,0.95); X.lineWidth=5; rr(X,2.5,2.5,S.w-5,S.h-5,29); X.stroke();
  X.restore();
}

/* ── كرتا الحجز (مربّعتان) ───────────────────────────── */
function bookCard(t,S,delay){
  const w=win(t,S.s,S.e,0.46,0.34); if(!w) return;
  const img=IMG[S.img]; if(!img) return;
  const a=w.k, sc=lerp(0.80,1,eBack(w.in));
  X.save(); X.globalAlpha=a;
  X.translate(S.x+S.w/2,S.y+S.h/2); X.scale(sc,sc); X.translate(-S.w/2,-S.h/2);
  shadow(X,'rgba(0,0,0,.55)',46,16);
  X.fillStyle=T.bg; rr(X,-7,-7,S.w+14,S.h+14+86,28); X.fill(); noShadow(X);
  X.save(); rr(X,0,0,S.w,S.h,22); X.clip(); X.drawImage(img,0,0,S.w,S.h); X.restore();
  X.strokeStyle=hx(T.acc,0.9); X.lineWidth=4; rr(X,2,2,S.w-4,S.h-4,21); X.stroke();
  ar(S.label,34,700,T.ink,S.w-10,S.h+58,'right');
  X.restore();
}

/* ── كرت النهاية ─────────────────────────────────────── */
function outro(t){
  const u=t-SRC_END; if(u<-0.001) return;
  const a=cl(u/0.30,0,1);
  X.save(); X.globalAlpha=a;
  X.fillStyle=T.bg; X.fillRect(0,0,W,H);
  // نقشة الشعار بالخلفية (من دليل الهوية)
  const L=IMG.logomark||IMG.logo;
  if(L){ X.save(); X.globalAlpha=a*0.055;
    for(let r=0;r<9;r++)for(let c=0;c<5;c++){
      const w2=240,h2=w2*L.height/L.width;
      X.drawImage(L,-60+c*250+(r%2?125:0), 40+r*230, w2,h2);
    } X.restore(); }
  X.fillStyle=hx(T.deep,0.55); X.fillRect(0,0,W,H);

  // الشعار على كرت أبيض
  if(IMG.logo){
    const k=eBack(cl((u-0.18)/0.62,0,1));
    const lw=640, lh=lw*IMG.logo.height/IMG.logo.width;
    X.save(); X.globalAlpha=a*cl((u-0.18)/0.4,0,1);
    X.translate(W/2,442); X.scale(lerp(0.82,1,k),lerp(0.82,1,k));
    shadow(X,'rgba(0,0,0,.45)',44,16);
    X.fillStyle='#fff'; rr(X,-lw/2-52,-lh/2-46,lw+104,lh+92,40); X.fill(); noShadow(X);
    X.drawImage(IMG.logo,-lw/2,-lh/2,lw,lh);
    X.restore();
  }
  // خط فاصل
  const l1=cl((u-0.55)/0.5,0,1);
  X.fillStyle=T.acc; rr(X,W/2-112*eOut(l1),668,224*eOut(l1),7,4); X.fill();

  // للحجز والاستفسار
  const t1=cl((u-0.62)/0.46,0,1);
  X.save(); X.globalAlpha=a*t1;
  ar(TEXTS.ctaTop,58,700,'#C9D3EC',W/2+(1-eOut(t1))*28, 784,'center');
  X.restore();

  // زرّ الواتساب
  const t2=cl((u-0.86)/0.55,0,1);
  if(t2>0.01){
    const k=eBack(t2), pw=830, ph=158;
    X.save(); X.globalAlpha=a*cl(t2*1.6,0,1);
    X.translate(W/2,936); X.scale(lerp(0.84,1,k),lerp(0.84,1,k));
    const gl=0.5+0.5*Math.sin(u*4.0);
    shadow(X,hx(T.acc,0.30+0.28*gl),52,0);
    X.fillStyle=T.acc; rr(X,-pw/2,-ph/2,pw,ph,ph/2); X.fill(); noShadow(X);
    // أيقونة واتساب (المسار الرسمي)
    X.save(); X.translate(pw/2-102,0);
    X.fillStyle='#fff'; X.beginPath(); X.arc(0,0,52,0,7); X.fill();
    X.fillStyle=T.acc;
    const sc2=68/24; X.translate(-12*sc2,-12*sc2); X.scale(sc2,sc2);
    X.fill(new Path2D(WA_PATH));
    X.restore();
    ltr(TEXTS.phone,62,800,'#fff',-52,21,'center');
    X.restore();
  }

  // الفندقان
  const t3=cl((u-1.15)/0.6,0,1);
  if(t3>0.01){
    const items=[[IMG['assets/hotel_aziziyah.jpg'],'دبل تري العزيزية', 190],
                 [IMG['assets/hotel_jabalomar.jpg'],'دبل تري جبل عمر', 560]];
    items.forEach((it,i)=>{
      const kk=cl((t3-i*0.10)/0.75,0,1); if(kk<=0.01||!it[0]) return;
      const s=330, x=it[2], y=1090+22*(1-eOut(kk));
      X.save(); X.globalAlpha=a*kk;
      shadow(X,'rgba(0,0,0,.45)',34,12);
      X.fillStyle=hx(T.deep,0.92); rr(X,x-7,y-7,s+14,s+14+80,26); X.fill(); noShadow(X);
      X.save(); rr(X,x,y,s,s,20); X.clip(); X.drawImage(it[0],x,y,s,s); X.restore();
      X.strokeStyle=hx(T.acc,0.85); X.lineWidth=4; rr(X,x+2,y+2,s-4,s-4,19); X.stroke();
      ar(it[1],33,700,T.ink,x+s-4,y+s+52,'right');
      X.restore();
    });
  }
  // اسم الشركة
  const t4=cl((u-1.6)/0.6,0,1);
  X.save(); X.globalAlpha=a*t4;
  ar(T.brand,38,700,hx(T.acc,1),W/2,1556,'center');
  X.restore();
  X.restore();
}

/* ── رسم فريم كامل ───────────────────────────────────── */
function draw(t){
  X.clearRect(0,0,W,H);
  if(t<SRC_END){
    videoLayer(t);
    captions(t);
    alertCard(t);
    mapCard(t,SCENES.map1);
    mapCard(t,SCENES.map2);
    bookCard(t,SCENES.book1);
    bookCard(t,SCENES.book2);
    chrome(t);
  } else {
    videoLayer(SRC_END-0.02);
    outro(t);
    const p=cl(t/TOTAL,0,1);
    X.fillStyle='rgba(255,255,255,.13)'; rr(X,60,1601,W-120,6,3); X.fill();
    X.fillStyle=hx(T.acc,.92); rr(X,60+(W-120)*(1-p),1601,(W-120)*p,6,3); X.fill();
  }
  sweep(t);
}

/* ── تحميل ───────────────────────────────────────────── */
function load(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
window.__boot=async function(theme){
  T=theme;
  IMG.logo=await load('assets/logo.png');
  for(const k of ['assets/map_jabalomar.png','assets/map_aziziyah.png',
                  'assets/hotel_jabalomar.jpg','assets/hotel_aziziyah.jpg']) IMG[k]=await load(k);
  await document.fonts.load('900 100px Tajawal');
  await document.fonts.load('800 100px Tajawal');
  await document.fonts.load('700 100px Tajawal');
  await document.fonts.load('500 100px Tajawal');
  await document.fonts.ready;
  return true;
};
window.__frame=async function(t,path){
  FRAME = path ? await load(path) : null;
  draw(t); return true;
};
</script></body></html>
