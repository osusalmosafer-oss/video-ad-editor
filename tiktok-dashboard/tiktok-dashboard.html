</script>
<style>
:root{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2c2c2a;
  --text:#ffffff; --text-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#0ca30c;
  --accent:#3987e5;
  --radius:12px;
  --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6}
body{overflow-x:hidden}
a{color:var(--s1)}
button,select,input{font-family:inherit;font-size:14px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:20;background:rgba(13,13,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top-inner{max-width:1280px;margin:0 auto;padding:12px 16px 0}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title-row h1{font-size:18px;margin:0;font-weight:700}
.title-row .sub{color:var(--muted);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0}
.filters label{color:var(--text-2);font-size:12px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:2px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--text-2);padding:6px 10px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--surface-3);color:var(--text);font-weight:600}
input[type=date],select,input[type=search]{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px;min-height:34px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:0}
nav.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--text-2);padding:10px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
section.tab{display:none;padding-top:20px}
section.tab.on{display:block}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:16px;margin:0 0 8px}
.lead{color:var(--text-2);margin:0 0 16px;font-size:14px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-width:0}
.kpi .label{color:var(--text-2);font-size:13px}
.kpi .val{font-size:26px;font-weight:700;margin:4px 0 2px;letter-spacing:-.3px}
.kpi .delta{font-size:12px;font-weight:600}
.delta.up{color:var(--good-text)} .delta.down{color:var(--critical)} .delta.na{color:var(--muted);font-weight:400}
.src{display:block;color:var(--muted);font-size:11px;margin-top:6px;line-height:1.4;word-break:break-word}
.na-text{color:var(--muted);font-style:normal}
.chart-box{position:relative;height:260px}
.chart-box.tall{height:320px}
.chart-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.crit{display:inline-flex;align-items:center;gap:2px;background:rgba(57,135,229,.14);color:#9ec5f4;border:1px solid rgba(57,135,229,.35);border-radius:6px;padding:0 6px;font-size:12px;font-weight:600;cursor:pointer;line-height:20px;margin:0 2px;font-family:inherit}
.crit.ads{background:rgba(250,178,25,.10);color:#fad27a;border-color:rgba(250,178,25,.35)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.pill-row .tag{white-space:normal;max-width:100%}
.tag.good{background:rgba(12,163,12,.15);color:#6fd46f}
.tag.bad{background:rgba(208,59,59,.15);color:#f09a9a}
.tag.warn{background:rgba(250,178,25,.13);color:#fad27a}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
td.cap{white-space:normal;min-width:220px;max-width:340px}
th{color:var(--text-2);font-weight:600;background:var(--surface-2);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th .arrow{color:var(--accent);margin-inline-start:4px}
tbody tr:hover{background:var(--surface-2)}
tbody tr.click{cursor:pointer}
td.num,th.num{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.vcard .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.vcard .cap{font-weight:600;cursor:pointer}
.vcard .cap:hover{color:#9ec5f4}
.mets{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
.met{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.met b{display:block;font-size:16px}
.met span{color:var(--muted);font-size:11px}
ul.reasons{margin:8px 0 0;padding-inline-start:18px}
ul.reasons li{margin:4px 0;color:var(--text-2)}
ul.reasons li strong{color:var(--text)}
.note{border-inline-start:3px solid var(--warning);background:rgba(250,178,25,.06);padding:10px 12px;border-radius:8px;color:var(--text-2);font-size:13px;margin:12px 0}
.note.info{border-color:var(--s1);background:rgba(57,135,229,.06)}
.note.bad{border-color:var(--critical);background:rgba(208,59,59,.06)}
.findings li{margin:6px 0}
.heat{overflow-x:auto}
.heat table{font-size:11px;border-collapse:separate;border-spacing:2px}
.heat td,.heat th{padding:0;border:0;text-align:center;background:none;position:static}
.heat td.cell{width:30px;min-width:30px;height:30px;border-radius:4px;cursor:default;color:#fff;font-size:10px}
.heat td.empty{background:var(--surface-2)}
.heat th{color:var(--muted);font-weight:500;padding:2px 4px}
.scale{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:8px}
.scale .bar{height:8px;width:140px;border-radius:4px;background:linear-gradient(to left,#104281,#3987e5,#cde2fb)}
.rec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.rec .rh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.rec h3{margin:0}
.rec dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:12px 0 0;font-size:14px}
.rec dt{color:var(--muted)}
.rec dd{margin:0;color:var(--text-2)}
.prio-h{background:rgba(208,59,59,.15);color:#f09a9a}
.prio-m{background:rgba(250,178,25,.13);color:#fad27a}
.prio-l{background:rgba(57,135,229,.14);color:#9ec5f4}
.vlink{color:#9ec5f4;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(158,197,244,.4)}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cal .day{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.cal .day.off{opacity:.55}
.cal .day h4{margin:0 0 6px;font-size:15px}

const CRIT = {
 C1:{t:'إكمال الفيديو إشارة قوية',scope:'org',q:'"A strong indicator of interest, such as whether a user finishes watching a longer video from beginning to end, would receive greater weight than a weak indicator, such as whether the video\'s viewer and creator are both in the same country."',m:'إكمال مشاهدة الفيديو (خصوصاً الطويل) وزنه أكبر من الإشارات الضعيفة.',src:'TikTok Newsroom — How TikTok recommends videos #ForYou',url:'https://newsroom.tiktok.com/en-us/how-tiktok-recommends-videos-for-you'},
 C2:{t:'التفاعلات التي يتوقعها النظام',scope:'org',q:'The system predicts a variety of interactions, including the likelihood to like, share, comment on, or mark a video as \'Not Interested,\' as well as finish, skip, or favorite a video, and spend a certain amount of time viewing a video. … Videos with the highest score are selected to be served to your For You feed.',m:'الإعجاب والمشاركة والتعليق والحفظ والإكمال ووقت المشاهدة كلها تدخل في درجة التوقع.',src:'TikTok Support — How TikTok recommends content',url:'https://support.tiktok.com/en/using-tiktok/exploring-videos/how-tiktok-recommends-content'},
 C3:{t:'عدد المتابعين ليس عاملاً مباشراً',scope:'org',q:'Neither follower count nor whether the account has had previous high-performing videos are direct factors in the recommendation system. However, a video is likely to receive more views if posted by an account that has more followers.',m:'الفيديو يُقيَّم بتفاعل المشاهدين معه لا بحجم الحساب، والمتابعون يرفعون المشاهدات بشكل غير مباشر.',src:'TikTok Newsroom — How TikTok recommends videos #ForYou',url:'https://newsroom.tiktok.com/en-us/how-tiktok-recommends-videos-for-you'},
 C4:{t:'التنويع',scope:'org',q:'The system also measures content similarity to ensure that if consecutive videos are too similar to each other (for example, they use the same sound), they are replaced with others to provide greater variety.',m:'الفيديوهات المتشابهة جداً والمتتالية تُستبدل بغيرها للتنويع.',src:'TikTok Support — How TikTok recommends content',url:'https://support.tiktok.com/en/using-tiktok/exploring-videos/how-tiktok-recommends-content'},
 C5:{t:'وقت المشاهدة أثقل وزناً والتفاعل ثانياً',scope:'org',q:'Retention rate is highly important to understand what your audience resonates with. The second most important metric is engagement (likes, comments, and shares). While watch time is more heavily weighted, the success of your videos is dependent upon all of these metrics.',m:'وقت المشاهدة هو الأثقل وزناً، ثم التفاعل.',src:'Creator Academy — Video performance analytics',url:'https://www.tiktok.com/creator-academy/en/article/analytics-tool-video-performance'},
 C6:{t:'نقطة السقوط في الاحتفاظ',scope:'org',q:'Discover the exact moment in your video when most viewers lost interest … if the retention rate shows that most of your viewers stopped watching at 00:02, rewatch your video to see what could be going on in that moment.',m:'حدد الثانية التي يخسر فيها الفيديو أغلب المشاهدين وراجع ما يحدث فيها.',src:'Creator Academy — Video performance analytics',url:'https://www.tiktok.com/creator-academy/en/article/analytics-tool-video-performance'},
 C7:{t:'معنى مصادر الزيارات',scope:'org',q:'For You page traffic usually means strong viewer behavior signals like watch time and retention helped expand distribution. Search traffic often means your topic or keywords matched something people were actively looking for.',m:'زيارات For You تعني إشارات مشاهدة قوية، وزيارات البحث تعني تطابق الموضوع مع ما يبحث عنه الناس.',src:'Creator Academy — Video performance analytics',url:'https://www.tiktok.com/creator-academy/en/article/analytics-tool-video-performance'},
 C8:{t:'اجذب المشاهد خلال أول 5 ثوانٍ',scope:'org',q:'Consider having an attractive element early on in your video that sparks interest, ideally within the first 5 seconds … No matter how long or short your video is, hooking the viewer within the first 5 seconds is incredibly important to rack up those views and increase watch time. … retain your audience\'s attention while making your video more accessible by adding text.',m:'عنصر جذب خلال أول 5 ثوانٍ مهم لرفع المشاهدات ووقت المشاهدة، والنص على الشاشة يساعد.',src:'Creator Academy — Elements of a TikTok video',url:'https://www.tiktok.com/creator-academy/en/article/elements-of-tiktok-video'},
 C9:{t:'أول 3 ثوانٍ و6 ثوانٍ (إعلانات)',scope:'ads',q:'Introduce your content proposition in the first 3 seconds … 90% of ad recall impact is captured within the first six seconds.',m:'قدّم فكرة المحتوى خلال أول 3 ثوانٍ (إرشاد إعلاني).',src:'TikTok Ads — Creative best practices',url:'https://ads.tiktok.com/help/article/creative-best-practices'},
 C10:{t:'بنية Hook ← Body ← Close (إعلانات)',scope:'ads',q:'The best TikTok videos follow a reliable structure: hook, body, close. The hook grabs attention with a technique like suspense, surprise or emotion. The body conveys your brand message. The close anchors the ad with a strong CTA.',m:'بداية تجذب، وسط يوصل الرسالة، خاتمة بدعوة لإجراء (إرشاد إعلاني).',src:'TikTok Creative Codes',url:'https://ads.tiktok.com/business/en/creative-codes'},
 C11:{t:'مدة 21–34 ثانية (إعلانات، للتحويل)',scope:'ads',q:'Video ads on TikTok that fell between 21 and 34 seconds in length received a 280% lift in conversion compared to videos that fell short or long of that duration window. … videos should be at least 10 seconds long.',m:'هذا معيار لتحويل الإعلانات وليس لانتشار الفيديو العضوي.',src:'TikTok Ads — Creative best practices',url:'https://ads.tiktok.com/help/article/creative-best-practices'},
 C12:{t:'الفيديوهات الأطول من دقيقة',scope:'org',q:'Great TikTok videos usually have a clear beginning, middle, and end. … Enhance engagement by posing a question that gets answered as viewers watch your video in full. … Tutorials are a great way to share knowledge by leveraging longer videos.',m:'الفيديو الطويل يحتاج بداية ووسط ونهاية واضحة، وسؤالاً يُجاب عنه في آخره.',src:'Creator Academy — Longer video content strategy',url:'https://www.tiktok.com/creator-academy/en/article/longer-video-content-strategy'},
 C13:{t:'انشر قبل ذروة نشاط متابعيك بساعتين كحد أقصى',scope:'org',q:'Use follower activity as your programming calendar guide … Post on the most active days of the week and, at most, two hours before the activity peaks on those days.',m:'استخدم نشاط متابعيك وانشر قبل الذروة بساعتين كحد أقصى.',src:'Creator Academy — Video performance analytics',url:'https://www.tiktok.com/creator-academy/en/article/analytics-tool-video-performance'},
 C14:{t:'الاستمرارية في النشر',scope:'org',q:'Publishers who post multiple times a day experience higher video views and exposure on the For You feed. … set a daily post target you can consistently hit.',m:'حدد هدف نشر تقدر تلتزم به (المقال موجّه للناشرين الإعلاميين).',src:'Creator Academy — Posting cadence best practices',url:'https://www.tiktok.com/creator-academy/en/article/posting-cadence-best-practices-publishers'},
 C15:{t:'كلمات ذات صلة بدون حشو',scope:'org',q:'Use relevant keywords in your video, subtitles, and captions … Avoid including irrelevant or misleading keywords based solely on popularity — irrelevant text stacking will negatively affect your video traffic.',m:'استخدم كلمات مرتبطة بالموضوع في النص والوصف، والحشو يضر الزيارات.',src:'Creator Academy — Driving video traffic: Search',url:'https://www.tiktok.com/creator-academy/article/driving-video-traffic-search'},
 C16:{t:'أساسيات الفيديو (إعلانات)',scope:'ads',q:'Use sound/music, orient vertically at 9:16, shoot at least 720P, and keep content within the UI safe zone.',m:'صوت، عمودي 9:16، دقة 720p على الأقل، والنص داخل المنطقة الآمنة.',src:'TikTok Ads — Creative best practices',url:'https://ads.tiktok.com/help/article/creative-best-practices'},
 C17:{t:'الواقعية والترندات (إعلانات)',scope:'ads',q:'Focus on realness, not perfection. … 77% of users say they like it when brands use trends, memes, or challenges.',m:'الواقعية أهم من الكمال.',src:'TikTok Creative Codes',url:'https://ads.tiktok.com/business/en/creative-codes'},
};
const c = (...ids) => ids.map(id => `<button class="crit${CRIT[id].scope==='ads'?' ads':''}" data-c="${id}" title="${CRIT[id].t}">${id}</button>`).join('');

/* ---------- أدوات ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const nf = (x, d=0) => x==null||isNaN(x) ? '—' : Number(x).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});
const pct = (x, d=1) => x==null||isNaN(x) ? '—' : (x*100).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d})+'%';
const sec = x => x==null ? '—' : nf(x,1)+' ث';
const median = a => { const s=a.filter(x=>x!=null&&!isNaN(x)).sort((x,y)=>x-y); if(!s.length) return null; const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const mean = a => { const s=a.filter(x=>x!=null&&!isNaN(x)); return s.length? s.reduce((p,q)=>p+q,0)/s.length : null; };
const sum = a => a.reduce((p,q)=>p+(q||0),0);
function spearman(xs, ys){
  const pr = xs.map((x,i)=>[x,ys[i]]).filter(p=>p[0]!=null&&p[1]!=null);
  if(pr.length<5) return {r:null,n:pr.length};
  const rank = arr => { const idx=arr.map((v,i)=>i).sort((a,b)=>arr[a]-arr[b]); const r=new Array(arr.length); let i=0; while(i<idx.length){ let j=i; while(j+1<idx.length && arr[idx[j+1]]===arr[idx[i]]) j++; const avg=(i+j)/2; for(let k=i;k<=j;k++) r[idx[k]]=avg; i=j+1;} return r; };
  const a=rank(pr.map(p=>p[0])), b=rank(pr.map(p=>p[1])); const ma=mean(a), mb=mean(b);
  let num=0,da=0,db=0; for(let i=0;i<a.length;i++){num+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)**2;db+=(b[i]-mb)**2;}
  return {r:num/Math.sqrt(da*db), n:pr.length};
}
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

/* ---------- تصنيف المحتوى (قواعد كلمات مفتاحية في الوصف + تعديل يدوي) ---------- */
const TYPES = ['تجربة المسافة (فندق ← الحرم)','عروض وأسعار','قوائم فنادق','إرشادات ومعلومات حول الحرم','تعريف/جولة فندق','مشاهد مكة وعام'];
const TYPE_RULES = [
  [TYPES[0], /كم يبعد|كم تحتاج|كم يستغرق|مشياً|دقائق و/],
  [TYPES[1], /ريال|عرض/],
  [TYPES[2], /(أقرب|أفخم|ترتيب|دليل)[^|]{0,12}(فنادق|الفنادق)|فنادق منطقة|[0-9٠-٩] فنادق/],
  [TYPES[3], /طريقة|كيف توص|مكان|أماكن|الأبواب|باركود|خريطة|مواقف|دليل|وين |مصلى|كافيه|مقهى|مطعم|سوبر/],
  [TYPES[4], /فندق|فنادق|أجنحة|جناح|إقامة|Voco/i],
];
function autoType(cap){ for(const [t,re] of TYPE_RULES) if(re.test(cap)) return t; return TYPES[5]; }
let typeOverrides = store.get('tt_type_over',{});
let personTags = store.get('tt_person',{});
const typeOf = v => typeOverrides[v.id] || v.autoType;

/* ---------- تجهيز البيانات ---------- */
const V = DATA.videos.map(v => {
  const r = v.retention || [];
  return Object.assign({}, v, {
    shareRate: v.shares/v.views, saveRate: v.saves/v.views,
    engRate: (v.likes+v.comments+v.shares+v.saves)/v.views,
    conv: v.newFollowers/v.views,
    r2: r.length>2? r[2]:null, r3: r.length>3? r[3]:null, r5: r.length>5? r[5]:null,
    dropSec: r.length ? (r.findIndex(x=>x<0.5)) : null,
    watchPct: v.dur ? v.avgWatch/v.dur : null,
    fy: v.sources.foryou, search: v.sources.search,
    autoType: autoType(v.caption),
    short: v.caption.length>60 ? v.caption.slice(0,58)+'…' : v.caption,
  });
});
const FOLLOWERS = Object.fromEntries(DATA.daily.map(d=>[d.date,d.totalFollowers]));
V.forEach(v => { const f = FOLLOWERS[v.dt.slice(0,10)]; v.followersAtPost = f ?? null; v.viewsPerFollower = f ? v.views/f : null; });
const PULL = DATA.pulledAt;
const DAILY_MIN = DATA.daily[0].date, DAILY_MAX = DATA.daily[DATA.daily.length-1].date;

// وسيط الحساب (كل الفيديوهات) — مرجع داخلي وليس معياراً من تيك توك
const BASE = {};
['views','avgWatch','fullRate','shareRate','saveRate','engRate','conv','r2','r3','r5','fy','search','newFollowers','watchPct','viewsPerFollower'].forEach(k => BASE[k]=median(V.map(v=>v[k])));

let tz = +store.get('tt_tz',3);
function localize(){
  V.forEach(v => { const d=new Date(v.dt+'Z'); const l=new Date(d.getTime()+tz*3600e3);
    v.date=l.toISOString().slice(0,10); v.day=l.getUTCDay(); v.hour=l.getUTCHours(); v.time=l.toISOString().slice(11,16); });
}
localize();

/* ---------- الفلتر الزمني ---------- */
const ALL_FROM = DATA.range.from, ALL_TO = DATA.range.to;
let range = {preset:'all', from:ALL_FROM, to:ALL_TO};
const addDays = (s,n) => { const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5)+1;
function setPreset(p){
  range.preset=p;
  if(p==='all'){ range.from=ALL_FROM; range.to=ALL_TO; }
  else if(p!=='custom'){ range.to=ALL_TO; range.from=addDays(ALL_TO,-(+p-1)); }
  document.querySelectorAll('#presetSeg button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  $('#customBox').style.display = p==='custom' ? 'inline-flex' : 'none';
  $('#dFrom').value=range.from; $('#dTo').value=range.to;
  renderAll();
}
const inRange = (d,f=range.from,t=range.to) => d>=f && d<=t;
const FV = () => V.filter(v => inRange(v.date));
function prevRange(){ const n=daysBetween(range.from,range.to); return {from:addDays(range.from,-n), to:addDays(range.from,-1), n}; }

/* ---------- الرسوم ---------- */

/* ---------- عناصر مشتركة ---------- */
function kpi(label, val, src, delta){ return `<div class="card kpi"><div class="label">${label}</div><div class="val">${val}</div>${delta||''}<span class="src">المصدر: ${src}</span></div>`; }
function deltaHtml(cur, prev, label){
  if(prev==null || cur==null) return `<div class="delta na">مقارنة ${label}: غير متوفر في البيانات</div>`;
  if(prev===0) return `<div class="delta na">الفترة السابقة = 0</div>`;
  const d=(cur-prev)/prev; const cls=d>=0?'up':'down';
  return `<div class="delta ${cls}">${d>=0?'▲':'▼'} ${pct(Math.abs(d))} مقارنة ${label} (${nf(prev)})</div>`;
}
function vlink(v, text){ return `<span class="vlink" data-v="${v.id}">${esc(text||v.short)}</span>`; }
const rel = (x, b) => (x==null||b==null||!b) ? null : (x-b)/b;
function relTag(x,b){ const r=rel(x,b); if(r==null) return '<span class="tag">—</span>'; return `<span class="tag ${r>=0?'good':'bad'}">${r>=0?'+':''}${pct(r,0)}</span>`; }
function tableHtml(cols, rows, opts={}){
  return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}${c.sort?' sortable':''}" ${c.sort?`data-sort="${c.sort}"`:''}>${c.h}${opts.sortKey&&opts.sortKey===c.sort?`<span class="arrow">${opts.sortDir>0?'▲':'▼'}</span>`:''}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${cols.length}" class="muted">لا توجد فيديوهات في هذه الفترة</td></tr>`}</tbody></table></div>`;
}

function findings(vs,dCur){
  const out=[]; if(!vs.length) return ['<li class="muted">لا توجد فيديوهات في هذه الفترة.</li>'];
  const tot=sum(vs.map(v=>v.views)); const top=[...vs].sort((a,b)=>b.views-a.views)[0];
  out.push(`<li>أعلى فيديو: ${vlink(top)} بـ <b>${nf(top.views)}</b> مشاهدة، أي ${pct(top.views/tot)} من مشاهدات فيديوهات الفترة. الأداء مركّز في عدد قليل من الفيديوهات.</li>`);
  const s1=spearman(vs.map(v=>v.views),vs.map(v=>v.avgWatch)), s2=spearman(vs.map(v=>v.views),vs.map(v=>v.fullRate)), s3=spearman(vs.map(v=>v.views),vs.map(v=>v.r5));
  if(s1.r!=null) out.push(`<li>ارتباط المشاهدات بمتوسط مدة المشاهدة <b>${nf(s1.r,2)}</b>، وبالاحتفاظ عند الثانية 5 <b>${nf(s3.r,2)}</b>، وبنسبة المشاهدة الكاملة <b>${nf(s2.r,2)}</b> (معامل سبيرمان، ${s1.n} فيديو). يتوافق مع ${c('C5','C8')}، ونسبة الإكمال أضعف ارتباطاً مما يوحي به ${c('C1')}.</li>`);
  const nv=sum(vs.map(v=>v.views)); const dv=sum(dCur.map(d=>d.views));
  if(dCur.length && range.from>=DAILY_MIN && dv>0) out.push(`<li>مشاهدات الحساب اليومية في الفترة <b>${nf(dv)}</b>، وإجمالي مشاهدات الفيديوهات المنشورة داخل الفترة <b>${nf(nv)}</b> (مدى الحياة). ${nv<dv?`الفرق يعني أن جزءاً كبيراً من المشاهدات يأتي من فيديوهات أقدم.`:''}</li>`);
  const s=spearman(vs.map(v=>v.views),vs.map(v=>v.shareRate)), sv=spearman(vs.map(v=>v.views),vs.map(v=>v.saveRate)), se=spearman(vs.map(v=>v.views),vs.map(v=>v.engRate));
  if(s.r!=null) out.push(`<li>معدل المشاركة (${nf(s.r,2)}) ومعدل الحفظ (${nf(sv.r,2)}) يرتبطان بالمشاهدات أكثر بكثير من معدل التفاعل الإجمالي (${nf(se.r,2)}) الذي تغلب عليه الإعجابات ${c('C2')}.</li>`);
  return out;
}

function successReasons(v){
  const R=[];
  if(v.avgWatch>BASE.avgWatch) R.push(`<li><strong>وقت مشاهدة أعلى:</strong> متوسط ${sec(v.avgWatch)} مقابل وسيط الحساب ${sec(BASE.avgWatch)} (${relTag(v.avgWatch,BASE.avgWatch)}). وقت المشاهدة هو الأثقل وزناً ${c('C5')}.</li>`);
  if(v.r5!=null && v.r5>BASE.r5) R.push(`<li><strong>بداية أقوى:</strong> ${pct(v.r5,0)} باقين عند الثانية 5 مقابل وسيط ${pct(BASE.r5,0)} ${c('C8')}.</li>`);
  if(v.shareRate>BASE.shareRate) R.push(`<li><strong>مشاركة أعلى:</strong> ${pct(v.shareRate,2)} من المشاهدين شاركوه مقابل وسيط ${pct(BASE.shareRate,2)}. المشاركة من التفاعلات التي يتوقعها النظام ${c('C2')}.</li>`);
  if(v.saveRate>BASE.saveRate) R.push(`<li><strong>حفظ أعلى:</strong> ${pct(v.saveRate,2)} حفظوه مقابل وسيط ${pct(BASE.saveRate,2)} ${c('C2')}.</li>`);
  if(v.fullRate>BASE.fullRate) R.push(`<li><strong>إكمال أعلى:</strong> ${pct(v.fullRate)} شاهدوه كاملاً مقابل وسيط ${pct(BASE.fullRate)} ${c('C1')}.</li>`);
  if(v.search>BASE.search) R.push(`<li><strong>زيارات من البحث:</strong> ${pct(v.search,0)} من المشاهدات من البحث مقابل وسيط ${pct(BASE.search,0)}. الموضوع يطابق ما يبحث عنه الناس ${c('C7','C15')}.</li>`);
  if(v.fy>0.8) R.push(`<li><strong>توزيع For You:</strong> ${pct(v.fy,0)} من المشاهدات من صفحة For You. تيك توك يربط ذلك بإشارات مشاهدة قوية ${c('C7')}.</li>`);
  if(v.dur && v.dur>=60 && v.avgWatch>BASE.avgWatch) R.push(`<li><strong>فيديو طويل (${nf(v.dur,0)}ث) حافظ على وقت المشاهدة</strong>، وهذا ما يصفه تيك توك للفيديوهات الأطول ${c('C12')}.</li>`);
  if(!R.length) R.push('<li>لا يوجد مقياس متاح أعلى من وسيط الحساب يفسر الأداء. السبب غير متوفر في البيانات.</li>');
  return R;
}
function flopDiagnosis(v){
  const R=[]; const b=durBucket(v.dur); const bm=median(V.filter(x=>durBucket(x.dur)===b).map(x=>x.views));
  R.push(`<li><strong>هل المشاهدات منخفضة؟</strong> ${v.views<BASE.views?'نعم':'لا'}: ${nf(v.views)} مقابل وسيط الحساب ${nf(BASE.views)} (${relTag(v.views,BASE.views)}).</li>`);
  if(v.r5==null) R.push(`<li><strong>هل المشكلة في الاحتفاظ أو البداية؟</strong> ${NA}. لا يوجد منحنى احتفاظ لهذا المنشور.</li>`);
  else R.push(`<li><strong>هل المشكلة في البداية؟</strong> ${v.r5<BASE.r5?'نعم على الأرجح':'لا'}: ${pct(v.r5,0)} باقين عند الثانية 5 (وسيط الحساب ${pct(BASE.r5,0)})${v.dropSec>0?`، ونصف المشاهدين غادروا عند الثانية <b>${v.dropSec}</b>`:''} ${c('C8','C6')}.</li>`);
  R.push(`<li><strong>هل المشكلة في الاحتفاظ؟</strong> متوسط المشاهدة ${sec(v.avgWatch)} (وسيط ${sec(BASE.avgWatch)})، والمشاهدة الكاملة ${pct(v.fullRate)} (وسيط ${pct(BASE.fullRate)}) ${c('C5','C1')}.</li>`);
  R.push(`<li><strong>هل المشاركة ضعيفة؟</strong> ${v.shareRate<BASE.shareRate?'نعم':'لا'}: ${pct(v.shareRate,2)} مقابل وسيط ${pct(BASE.shareRate,2)}. والحفظ ${pct(v.saveRate,2)} مقابل ${pct(BASE.saveRate,2)} ${c('C2')}.</li>`);
  R.push(`<li><strong>هل يجلب مشاهدات بدون متابعين؟</strong> ${v.conv<BASE.conv?'نعم':'لا'}: ${nf(v.conv*1000,1)} متابع لكل 1000 مشاهدة مقابل وسيط ${nf(BASE.conv*1000,1)}.</li>`);
  R.push(`<li><strong>هل للمدة علاقة؟</strong> المدة ${v.dur?nf(v.dur,0)+'ث':'غير متوفرة'} ضمن فئة "${b}" التي وسيط مشاهداتها ${nf(bm)}. ${v.dur&&v.dur>34?`الفيديوهات الأطول عندك إكمالها أقل (راجع صفحة المدة) ${c('C1')}.`:''}</li>`);

  return R;
}

function renderHits(){
  const vs=FV(); const sorted=[...vs].sort((a,b)=>b.views-a.views);
  const top=sorted.slice(0,5);
  const cutoff=addDays(PULL,-3);
  const flopPool=vs.filter(v=>v.date<=cutoff && !top.includes(v));
  const flops=[...flopPool].sort((a,b)=>a.views-b.views).slice(0,5);
  const recent=vs.filter(v=>v.date>cutoff);

}

/* ================= 4) الـ Hook ================= */

const VIRAL_METRICS = [
  {k:'viewsPerFollower',l:'المشاهدات ÷ المتابعين وقت النشر',f:x=>nf(x,1)+'×',src:'video_views_count ÷ total_followers_count يوم النشر'},
  {k:'shareRate',l:'نسبة المشاركة',f:x=>pct(x,2),src:'video_shares ÷ video_views_count'},
  {k:'saveRate',l:'نسبة الحفظ',f:x=>pct(x,2),src:'video_favorites ÷ video_views_count'},
  {k:'fullRate',l:'نسبة المشاهدة الكاملة',f:x=>pct(x,1),src:'video_full_watched_rate'},
  {k:'avgWatch',l:'متوسط وقت المشاهدة',f:x=>sec(x),src:'video_average_time_watched'},
  {k:'newFollowers',l:'المتابعون المكتسبون',f:x=>nf(x),src:'video_new_followers'},
];
let viralMetric='viewsPerFollower';

   ${kpi('سرعة نمو المشاهدات', NA, 'Windsor يعطي إجمالي مشاهدات كل فيديو فقط، بدون تطورها اليومي')}
   ${kpi('فيديوهات ≥ 3× وسيط الحساب', nf(outliers.length), `وسيط المشاهدات ${nf(BASE.views)} · قاعدة داخلية للفرز وليست معياراً من تيك توك`)}
   ${kpi('أعلى مشاهدات ÷ متابعين', (()=>{const t=[...V.filter(v=>inRange(v.date)&&v.viewsPerFollower!=null)].sort((a,b)=>b.viewsPerFollower-a.viewsPerFollower)[0]; return t? nf(t.viewsPerFollower,0)+'×':'—';})(), 'video_views_count ÷ total_followers_count يوم النشر. يتوافق مع C3')}
  </div>
  ${outliers.length?`<div class="card" style="margin-top:12px"><h3>الفيديوهات الشاذة إيجابياً (≥ 3× وسيط الحساب)</h3><div class="pill-row">${outliers.map(v=>`<span class="tag">${vlink(v)} · ${nf(v.views)}</span>`).join('')}</div></div>`:''}
  <div class="toolbar" style="margin-top:16px"><label class="small">المقياس</label><select id="viralSel">${VIRAL_METRICS.map(x=>`<option value="${x.k}" ${x.k===viralMetric?'selected':''}>${x.l}</option>`).join('')}</select><span class="small">المصدر: ${m.src}</span></div>

/* ================= 6) أنواع المحتوى ================= */
function typeStats(vs){
  return TYPES.map(t=>{ const g=vs.filter(v=>typeOf(v)===t); return {t,g,n:g.length,views:mean(g.map(v=>v.views)),mviews:median(g.map(v=>v.views)),full:mean(g.map(v=>v.fullRate)),aw:mean(g.map(v=>v.avgWatch)),sh:mean(g.map(v=>v.shares)),sv:mean(g.map(v=>v.saves)),nfw:mean(g.map(v=>v.newFollowers)),conv:g.length?sum(g.map(v=>v.newFollowers))/sum(g.map(v=>v.views)):null}; }).filter(x=>x.n);
}
function renderTypes(){
  const vs=FV(); const st=typeStats(vs).sort((a,b)=>b.mviews-a.mviews);

  <div class="card" style="margin-top:12px"><h3>وسيط المشاهدات حسب النوع</h3><div class="chart-box"><canvas id="typeBar"></canvas></div></div>
  <div class="card" style="margin-top:12px"><h3>يظهر شخص أمام الكاميرا؟</h3>${personBlock}</div>
  <h3 style="margin-top:20px">تعديل التصنيف يدوياً</h3>${tableHtml([{h:'الفيديو'},{h:'مشاهدات',num:1},{h:'النوع'},{h:'يظهر شخص؟'}],edit)}`;

/* ================= 7) أفضل مدة ================= */
const BUCKETS=['≤ 20 ث','21–34 ث','35–59 ث','60 ث فأكثر','غير متوفرة'];
function durBucket(d){ if(!d) return BUCKETS[4]; return d<=20?BUCKETS[0]:d<=34?BUCKETS[1]:d<60?BUCKETS[2]:BUCKETS[3]; }
function renderDuration(){
  const vs=FV(); const st=BUCKETS.map(b=>{ const g=vs.filter(v=>durBucket(v.dur)===b); return {b,g,n:g.length,mv:median(g.map(v=>v.views)),av:mean(g.map(v=>v.views)),full:mean(g.map(v=>v.fullRate)),aw:mean(g.map(v=>v.avgWatch)),sh:mean(g.map(v=>v.shares)),nfw:mean(g.map(v=>v.newFollowers)),conv:g.length?sum(g.map(v=>v.newFollowers))/sum(g.map(v=>v.views)):null,wp:median(g.map(v=>v.watchPct))}; }).filter(x=>x.n);
  const sd=spearman(vs.map(v=>v.dur),vs.map(v=>v.fullRate)), sa=spearman(vs.map(v=>v.dur),vs.map(v=>v.avgWatch)), sv=spearman(vs.map(v=>v.dur),vs.map(v=>v.views));
  const rows=st.map(s=>`<tr><td>${s.b}${s.b===BUCKETS[1]?' '+c('C11'):''}${s.b===BUCKETS[3]?' '+c('C12'):''}</td><td class="num">${s.n}</td><td class="num">${nf(s.mv)}</td><td class="num">${nf(s.av)}</td><td class="num">${pct(s.full)}</td><td class="num">${sec(s.aw)}</td><td class="num">${pct(s.wp,0)}</td><td class="num">${nf(s.sh,1)}</td><td class="num">${nf(s.nfw,1)}</td><td class="num">${nf(s.conv*1000,1)}</td></tr>`);
  const best=[...st].filter(s=>s.b!==BUCKETS[4]).sort((a,b)=>b.mv-a.mv)[0];
  const c11=st.find(s=>s.b===BUCKETS[1]);

function renderCalendar(){
  const perWeek=V.length/(daysBetween(ALL_FROM,ALL_TO)/7); const posts=Math.max(1,Math.min(7,Math.round(perWeek)));
  const byDay=DAYS.map((n,d)=>{ const g=V.filter(v=>v.day===d); return {d,n,c:g.length,mv:median(g.map(v=>v.views))}; });
  const ranked=[...byDay].filter(x=>x.c).sort((a,b)=>b.mv-a.mv);
  const chosen=new Set(ranked.slice(0,posts).map(x=>x.d));
  const ts=typeStats(V).filter(s=>s.n>=3).sort((a,b)=>b.mviews-a.mviews);
  const pool=ts.slice(0,3).map(s=>s.t); const conv=typeStats(V).filter(s=>s.n>=3).sort((a,b)=>b.conv-a.conv)[0];
  const pk=peakInfo(); const slot=`${hh(pk.from)}–${hh(pk.peak)}`;
  let k=0, prev=null;
  const days=[0,1,2,3,4,5,6].map(d=>{ const info=byDay[d];
    if(!chosen.has(d)) return `<div class="day off"><h4>${info.n}</h4><div class="small">بدون نشر مقترح</div><div class="small">وسيط المشاهدات: ${info.c?nf(info.mv):'لا يوجد نشر سابق'} (${info.c} فيديو)</div></div>`;
    let t=pool[k%pool.length]; if(t===prev && pool.length>1){ k++; t=pool[k%pool.length]; } k++; prev=t;
    const ts1=ts.find(s=>s.t===t);
    return `<div class="day"><h4>${info.n}</h4><div class="time">${slot}</div><div style="margin:6px 0"><span class="tag good">${t}</span></div>
     <div class="small">لماذا: وسيط مشاهدات ${info.n} في حسابك ${nf(info.mv)} (${info.c} فيديو). النوع وسيطه ${nf(ts1.mviews)} (${ts1.n} فيديو). الوقت قبل ذروة متابعيك ${hh(pk.peak)} ${c('C13')}. لا يتكرر نفس النوع في يومين متتاليين ${c('C4')}.</div></div>`; }).join('');
  $('#t-calendar').innerHTML=`<h2>تقويم المحتوى المقترح (أسبوعي)</h2>
  <p class="lead">مبني على: معدل نشرك التاريخي (${nf(perWeek,1)} أسبوعياً → ${posts} فيديوهات)، وأفضل أيامك حسب وسيط المشاهدات، ونشاط متابعيك بالساعة ${c('C13')}، والأنواع الأعلى أداءً (3 فيديوهات فأكثر)، والتنويع ${c('C4')}. الأوقات ${tz?'بتوقيت السعودية':'UTC'}.</p>
  <div class="note">أداء الأيام مبني على 1–9 فيديوهات لكل يوم، فترتيب الأيام مؤشر ضعيف. اعتبر التقويم خطة اختبار وحدّثه بعد 4 أسابيع من النشر.</div>
  <div class="cal">${days}</div>
  ${conv?`<div class="note info">لجلب متابعين تحديداً: أعلى نوع في التحويل هو "${conv.t}" (${nf(conv.conv*1000,1)} متابع لكل 1000 مشاهدة، ${conv.n} فيديو). بدّله مع أحد الأيام إذا كان هدفك نمو المتابعين.</div>`:''}`;
}

   `<b>${c('C11')} مقابل البيانات:</b> نافذة 21–34ث ليست الأعلى في المشاهدات عندك. المعيار إعلاني ويقيس تحويل المبيعات، فلا يُعتمد عليه لانتشار المحتوى العضوي.`,
   `<b>${c('C9')} مقابل ${c('C8')}:</b> المصدر الإعلاني يذكر 3 ثوانٍ وCreator Academy يذكر 5 ثوانٍ. بياناتك تدعم الثانية 5 (ارتباط ${nf(spearman(V.map(v=>v.r5),V.map(v=>v.views)).r,2)} مقابل ${nf(spearman(V.map(v=>v.r3),V.map(v=>v.views)).r,2)} للثانية 3).`,
   `<b>${c('C2')} وأنواع التفاعل:</b> المعيار يذكر الإعجاب والمشاركة والحفظ دون ترتيب لأوزانها. في حسابك المشاركة والحفظ مرتبطان بالمشاهدات، والإعجاب ضعيف الارتباط. هذي ملاحظة من البيانات وليست تعارضاً صريحاً.`,
   `<b>${c('C3')}:</b> لا تعارض. ${(()=>{const t=[...V].sort((a,b)=>b.views-a.views)[0]; const late=V.filter(v=>(v.followersAtPost||0)>=1800); return `أعلى فيديو (${nf(t.views)} مشاهدة) نُشر والحساب فيه ${nf(t.followersAtPost)} متابعاً، بينما ${late.length} فيديو نُشرت والحساب فيه 1,800 متابع فأكثر ووسيط مشاهداتها ${nf(median(late.map(v=>v.views)))}.`;})()}`,
   `<b>بيانات Windsor نفسها:</b> حقل "Daily count of gained followers" يظهر قيماً مجمّعة مرة في الأسبوع وأصفاراً بقية الأيام، فاستُخدم total_followers_count لحساب النمو بدلاً منه.`,
  ];
  $('#t-sources').innerHTML=`<h2>المصادر وتوفر البيانات</h2>
  <div class="grid two">
   <div class="card"><h3>المصدر الأول: معايير تيك توك</h3><p class="small">ملف tiktok-criteria.md، جُمع من مواقع تيك توك الرسمية فقط. 🟦 = عضوي، 🟨 = إعلاني. اضغط على أي رمز لقراءة النص الأصلي.</p><div class="pill-row">${Object.keys(CRIT).map(k=>c(k)+`<span class="small">${CRIT[k].t}</span>`).join('<br>')}</div>
    <div class="note">حد تقني: مواقع تيك توك محجوبة عن بيئة العمل، فالنصوص مأخوذة من نتائج البحث عن الصفحات الرسمية مع روابطها. الملف المرفق أولاً (Real Talk Creative Playbook) دليل Meta لإعلانات Reels ولم يُستخدم.</div></div>
   <div class="card"><h3>المصدر الثاني: بيانات Windsor</h3><p class="small">الكونكتور: tiktok_organic · الحساب: ${esc(DATA.account.name)} (حساب أعمال) · السحب: ${DATA.pulledAt} · ${V.length} فيديو (كل فيديوهات الحساب) · بيانات يومية ${DAILY_MIN} ← ${DAILY_MAX}.</p>
    <div class="note">الفترة المطلوبة 90 يوماً غير ممكنة: TikTok Organic يعطي آخر 60 يوماً لبيانات الحساب، وأول فيديو في الحساب نُشر في 22 يوليو 2026.</div></div>
  </div>
  <h3 style="margin-top:20px">توفر كل مقياس</h3>${tableHtml([{h:'المقياس'},{h:'حقل Windsor'},{h:'الحالة'}],avail.map(a=>`<tr><td>${a[0]}</td><td style="direction:ltr;text-align:right">${a[1]}</td><td class="cap">${a[2]}</td></tr>`))}
  <h3 style="margin-top:20px">التعارضات بين البيانات والمعايير</h3><div class="card"><ul class="findings">${conflicts.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <h3 style="margin-top:20px">طريقة الحساب</h3><div class="card small"><ul class="findings">
   <li>"وسيط الحساب" = الوسيط لكل ${V.length} فيديو. يُستخدم كمرجع داخلي عند غياب حد رسمي من تيك توك، ولا يُقدَّم كمعيار من تيك توك.</li>
   <li>الارتباط = معامل سبيرمان للرتب، ويقيس العلاقة وليس السببية.</li>
   <li>معدل المشاركة = shares ÷ views · معدل الحفظ = favorites ÷ views · التحويل = new_followers ÷ views.</li>
   <li>تصنيف الأنواع آلي بكلمات مفتاحية في الوصف، ويمكن تعديله يدوياً.</li></ul></div>`;
}

/* ---------- نافذة تفاصيل الفيديو ---------- */
function openVideo(id){
  const v=V.find(x=>x.id===id); if(!v) return;
  const S=v.sources; const src=[['For You',S.foryou],['البحث',S.search],['البروفايل',S.profile],['المتابَعون',S.follow],['أخرى',S.others],['الرسائل',S.dm]].filter(x=>x[1]!=null);
  $('#modalBody').innerHTML=`<h2 style="margin-inline-end:40px">${esc(v.caption)}</h2><div class="small">ID ${v.id} · ${v.date} ${v.time} · ${typeOf(v)}</div>
   ${metGrid(v)}
   <div class="mets">
    <div class="met"><b>${nf(v.likes)}</b><span>إعجابات</span></div><div class="met"><b>${nf(v.comments)}</b><span>تعليقات</span></div>
    <div class="met"><b>${nf(v.shares)}</b><span>مشاركات</span></div><div class="met"><b>${nf(v.saves)}</b><span>حفظ</span></div>
    <div class="met"><b>${v.reach==null?'غير متوفر':nf(v.reach)}</b><span>الوصول (مشاهدون فريدون)</span></div>
    <div class="met"><b>${nf(v.totalWatch/3600,1)} س</b><span>إجمالي وقت المشاهدة</span></div>
    <div class="met"><b>${nf(v.profileViews)}</b><span>زيارات البروفايل</span></div>
    <div class="met"><b>${nf(v.conv*1000,1)}</b><span>متابع/1000 مشاهدة</span></div>
    <div class="met"><b>${v.followersAtPost==null?'غير متوفر':nf(v.followersAtPost)}</b><span>متابعون يوم النشر</span></div>
    <div class="met"><b>${v.audience?pct(v.audience.newV,0):'غير متوفر'}</b><span>مشاهدون جدد</span></div>
    <div class="met"><b>${pct(v.followerShare,0)}</b><span>من المشاهدين متابعون</span></div>
    <div class="met"><b>${v.watchPct==null?'—':pct(v.watchPct,0)}</b><span>من المدة شوهد</span></div>
   </div>
   <h3>منحنى الاحتفاظ ${c('C6','C8')}</h3>${v.retention?`<div class="chart-box"><canvas id="mdCurve"></canvas></div>`:`<p>${NA}. منشور صور على الأرجح.</p>`}
   <h3 style="margin-top:12px">مصادر المشاهدات ${c('C7')}</h3>${src.map(([n,x])=>`<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><span style="width:90px" class="small">${n}</span><div class="bar-inline" style="flex:1"><i style="width:${x*100}%"></i></div><span class="small" style="width:44px;text-align:left">${pct(x,1)}</span></div>`).join('')}
   ${v.shareUrl?`<p style="margin-top:12px"><a href="${esc(v.shareUrl)}" target="_blank" rel="noopener">▶ شاهد الفيديو على تيك توك</a></p>`:''}<p class="small" style="margin-top:12px">المصدر: Windsor · tiktok_organic · جدول Video.</p>`;
  $('#modalBg').classList.add('on'); document.body.style.overflow='hidden';
  if(v.retention){ const labels=v.retention.map((_,i)=>i), med=avgCurve(V.filter(x=>x.retention), v.retention.length);
    chart('mdCurve',{type:'line',data:{labels,datasets:[{label:'هذا الفيديو',data:v.retention,borderColor:S1},{label:'وسيط الحساب',data:med,borderColor:'#898781',borderWidth:1.5}]},options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:true,rtl:true,labels:{color:'#c3c2b7',boxWidth:10,boxHeight:10}},tooltip:{callbacks:{title:x=>`الثانية ${x[0].label}`,label:x=>` ${x.dataset.label}: ${pct(x.raw,0)}`}}},scales:{x:{grid:{display:false},ticks:{...axisTicks,maxTicksLimit:10}},y:{min:0,max:1,grid:gridOpts,ticks:{...axisTicks,callback:x=>pct(x,0)}}}}}); }
}
function openCrit(id){ const k=CRIT[id];
  $('#modalBody').innerHTML=`<h2 style="margin-inline-end:40px">${id} · ${k.t}</h2><div class="pill-row" style="margin:6px 0"><span class="tag ${k.scope==='ads'?'warn':'good'}">${k.scope==='ads'?'إرشاد إعلاني':'محتوى عضوي'}</span></div><blockquote>${esc(k.q)}</blockquote><p><b>المعنى:</b> ${k.m}</p><p class="small">المصدر: <a href="${k.url}" target="_blank" rel="noopener">${esc(k.src)}</a></p>`;
  $('#modalBg').classList.add('on'); document.body.style.overflow='hidden'; }
function closeModal(){ $('#modalBg').classList.remove('on'); document.body.style.overflow=''; if(charts.mdCurve){ charts.mdCurve.destroy(); delete charts.mdCurve; } }
$('#modalX').onclick=closeModal; $('#modalBg').onclick=e=>{ if(e.target.id==='modalBg') closeModal(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
document.addEventListener('click',e=>{ const cr=e.target.closest('.crit'); if(cr){ e.stopPropagation(); openCrit(cr.dataset.c); return; } const vl=e.target.closest('[data-v]'); if(vl && !e.target.closest('select')){ openVideo(vl.dataset.v); } });

/* ---------- التبويبات والتشغيل ---------- */
const RENDER={overview:renderOverview,videos:renderVideos,hits:renderHits,hook:renderHook,viral:renderViral,types:renderTypes,duration:renderDuration,timing:renderTiming,conversion:renderConversion,action:renderAction,tests:renderTests,calendar:renderCalendar,sources:renderSources};
let current=store.get('tt_tab','overview'); if(!RENDER[current]) current='overview';
function showTab(t){ current=t; store.set('tt_tab',t);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('on',s.id==='t-'+t));
  RENDER[t](); }
function renderAll(){ $('#rangeLabel').textContent=`${range.from} ← ${range.to} · ${FV().length} فيديو`; RENDER[current](); }
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ showTab(b.dataset.t); window.scrollTo({top:0}); });
document.querySelectorAll('#presetSeg button').forEach(b=>b.onclick=()=>setPreset(b.dataset.p));
$('#dFrom').onchange=e=>{ range.from=e.target.value||ALL_FROM; renderAll(); };
$('#dTo').onchange=e=>{ range.to=e.target.value||ALL_TO; renderAll(); };
$('#dFrom').min=$('#dTo').min=ALL_FROM; $('#dFrom').max=$('#dTo').max=ALL_TO;
$('#tzSel').value=String(tz); $('#tzSel').onchange=e=>{ tz=+e.target.value; store.set('tt_tz',tz); localize(); renderAll(); };
$('#accName').textContent=DATA.account.name;
$('#pulledLine').textContent=`بيانات Windsor · TikTok Organic · سُحبت ${DATA.pulledAt} · ${V.length} فيديو`;
setPreset('all'); showTab(current);
</script>
</body>
