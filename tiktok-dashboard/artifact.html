<title>تيك توك أسس المسافر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>document.documentElement.setAttribute("dir","rtl");document.documentElement.setAttribute("lang","ar");</script>
<style>
:root{
  color-scheme:dark;
  --page:#141833; --surface:#1f2449; --surface-2:#272d57; --surface-3:#313866;
  --text:#ffffff; --text-2:#c8cce6; --muted:#8d93bb;
  --grid:#2e3563; --axis:#3a4275; --border:rgba(255,255,255,.10);
  --s1:#2884ff; --s2:#d95926; --s3:#199e70;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#0ca30c;
  --accent:#2884ff;
  --radius:12px;
  --font:"Tajawal","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{direction:rtl;margin:0;background:var(--page);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6}
body{overflow-x:hidden}
a{color:var(--s1)}
button,select,input{font-family:inherit;font-size:14px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(20,24,51,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top-inner{max-width:1280px;margin:0 auto;padding:12px 16px 0}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title-row h1{font-size:17px;margin:0;font-weight:700}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand .logo{height:34px;width:auto;display:block}
.live{font-size:12px}
.live.on{color:var(--good-text)} .live.snap{color:var(--warning)} .live.load{color:var(--s1)} .live.err{color:var(--critical)}
.linkbtn{background:none;border:0;color:#8fbcff;cursor:pointer;padding:0 4px;font-size:12px;text-decoration:underline}
textarea{font-family:inherit;font-size:15px;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;min-height:90px;resize:vertical}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--surface-3);color:var(--text)}
.btn.danger{background:rgba(208,59,59,.2);color:#f09a9a}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip:hover{color:var(--text);border-color:var(--accent)}
.answer{white-space:pre-wrap;line-height:1.8;margin-top:14px;min-height:40px}
.answer.muted{color:var(--muted)}
.form-grid{display:grid;gap:10px}
.form-grid label{font-size:13px;color:var(--text-2)}
.vpick{max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:6px 10px;background:var(--surface-2)}
.vpick label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;color:var(--text)}
.test{border-top:1px solid var(--grid);padding:12px 0}
.test:first-child{border-top:0}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.title-row .sub{color:var(--muted);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0}
.filters label{color:var(--text-2);font-size:12px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:2px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--text-2);padding:6px 10px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--surface-3);color:var(--text);font-weight:600}
input[type=date],select,input[type=search]{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px;min-height:34px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:0}
nav.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--text-2);padding:10px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
section.tab{display:none;padding-top:20px}
section.tab.on{display:block}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:16px;margin:0 0 8px}
.lead{color:var(--text-2);margin:0 0 16px;font-size:14px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-width:0}
.kpi .label{color:var(--text-2);font-size:13px}
.kpi .val{font-size:26px;font-weight:700;margin:4px 0 2px;letter-spacing:-.3px}
.kpi .delta{font-size:12px;font-weight:600}
.delta.up{color:var(--good-text)} .delta.down{color:var(--critical)} .delta.na{color:var(--muted);font-weight:400}
.src{display:block;color:var(--muted);font-size:11px;margin-top:6px;line-height:1.4;word-break:break-word}
.na-text{color:var(--muted);font-style:normal}
.chart-box{position:relative;height:260px}
.chart-box.tall{height:320px}
.chart-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.crit{display:inline-flex;align-items:center;gap:2px;background:rgba(40,132,255,.14);color:#9ec5f4;border:1px solid rgba(40,132,255,.35);border-radius:6px;padding:0 6px;font-size:12px;font-weight:600;cursor:pointer;line-height:20px;margin:0 2px;font-family:inherit}
.crit.ads{background:rgba(250,178,25,.10);color:#fad27a;border-color:rgba(250,178,25,.35)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.pill-row .tag{white-space:normal;max-width:100%}
.tag.good{background:rgba(12,163,12,.15);color:#6fd46f}
.tag.bad{background:rgba(208,59,59,.15);color:#f09a9a}
.tag.warn{background:rgba(250,178,25,.13);color:#fad27a}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
td.cap{white-space:normal;min-width:220px;max-width:340px}
th{color:var(--text-2);font-weight:600;background:var(--surface-2);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th .arrow{color:var(--accent);margin-inline-start:4px}
tbody tr:hover{background:var(--surface-2)}
tbody tr.click{cursor:pointer}
td.num,th.num{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.vcard .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.vcard .cap{font-weight:600;cursor:pointer}
.vcard .cap:hover{color:#9ec5f4}
.mets{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
.met{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.met b{display:block;font-size:16px}
.met span{color:var(--muted);font-size:11px}
ul.reasons{margin:8px 0 0;padding-inline-start:18px}
ul.reasons li{margin:4px 0;color:var(--text-2)}
ul.reasons li strong{color:var(--text)}
.note{border-inline-start:3px solid var(--warning);background:rgba(250,178,25,.06);padding:10px 12px;border-radius:8px;color:var(--text-2);font-size:13px;margin:12px 0}
.note.info{border-color:var(--s1);background:rgba(40,132,255,.06)}
.note.bad{border-color:var(--critical);background:rgba(208,59,59,.06)}
.findings li{margin:6px 0}
.heat{overflow-x:auto}
.heat table{font-size:11px;border-collapse:separate;border-spacing:2px}
.heat td,.heat th{padding:0;border:0;text-align:center;background:none;position:static}
.heat td.cell{width:30px;min-width:30px;height:30px;border-radius:4px;cursor:default;color:#fff;font-size:10px}
.heat td.empty{background:var(--surface-2)}
.heat th{color:var(--muted);font-weight:500;padding:2px 4px}
.scale{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:8px}
.scale .bar{height:8px;width:140px;border-radius:4px;background:linear-gradient(to left,#104281,#3987e5,#cde2fb)}
.rec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.rec .rh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.rec h3{margin:0}
.rec dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:12px 0 0;font-size:14px}
.rec dt{color:var(--muted)}
.rec dd{margin:0;color:var(--text-2)}
.prio-h{background:rgba(208,59,59,.15);color:#f09a9a}
.prio-m{background:rgba(250,178,25,.13);color:#fad27a}
.prio-l{background:rgba(40,132,255,.14);color:#9ec5f4}
.vlink{color:#9ec5f4;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(158,197,244,.4)}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cal .day{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.cal .day.off{opacity:.55}
.cal .day h4{margin:0 0 6px;font-size:15px}
.cal .time{font-size:20px;font-weight:700;direction:ltr;text-align:right}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.modal-bg.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:860px;width:100%;padding:20px;position:relative}
.modal .x{position:absolute;left:12px;top:12px;background:var(--surface-3);border:0;color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px}
blockquote{margin:8px 0;padding:10px 12px;background:var(--surface-2);border-radius:8px;direction:ltr;text-align:left;color:var(--text-2);font-size:13px}
.small{font-size:12px;color:var(--muted)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.muted{color:var(--muted)}
.bar-inline{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;min-width:60px}
.bar-inline i{display:block;height:100%;background:var(--s1);border-radius:3px}
@media (max-width:640px){
  .kpi .val{font-size:22px}
  .rec dl{grid-template-columns:1fr}
  .rec dt{margin-top:6px}
  h2{font-size:18px}
  .chart-box{height:230px}
  header.top{position:static}
}
.toolbar>*{max-width:100%;min-width:0}
.toolbar .small{overflow-wrap:anywhere}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const nf = (x, d=0) => x==null||isNaN(x) ? '—' : Number(x).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});
const pct = (x, d=1) => x==null||isNaN(x) ? '—' : (x*100).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d})+'%';
const sec = x => x==null ? '—' : nf(x,1)+' ث';
const median = a => { const s=a.filter(x=>x!=null&&!isNaN(x)).sort((x,y)=>x-y); if(!s.length) return null; const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const mean = a => { const s=a.filter(x=>x!=null&&!isNaN(x)); return s.length? s.reduce((p,q)=>p+q,0)/s.length : null; };
const sum = a => a.reduce((p,q)=>p+(q||0),0);
function spearman(xs, ys){
  const pr = xs.map((x,i)=>[x,ys[i]]).filter(p=>p[0]!=null&&p[1]!=null);
  if(pr.length<5) return {r:null,n:pr.length};
  const rank = arr => { const idx=arr.map((v,i)=>i).sort((a,b)=>arr[a]-arr[b]); const r=new Array(arr.length); let i=0; while(i<idx.length){ let j=i; while(j+1<idx.length && arr[idx[j+1]]===arr[idx[i]]) j++; const avg=(i+j)/2; for(let k=i;k<=j;k++) r[idx[k]]=avg; i=j+1;} return r; };
  const a=rank(pr.map(p=>p[0])), b=rank(pr.map(p=>p[1])); const ma=mean(a), mb=mean(b);
  let num=0,da=0,db=0; for(let i=0;i<a.length;i++){num+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)**2;db+=(b[i]-mb)**2;}
  return {r:num/Math.sqrt(da*db), n:pr.length};
}

const TYPE_RULES = [
  [TYPES[0], /كم يبعد|كم تحتاج|كم يستغرق|مشياً|دقائق و/],
  [TYPES[1], /ريال|عرض/],

  [TYPES[4], /فندق|فنادق|أجنحة|جناح|إقامة|Voco/i],
];
function autoType(cap){ for(const [t,re] of TYPE_RULES) if(re.test(cap)) return t; return TYPES[5]; }

let V=[], FOLLOWERS={}, PULL, DAILY_MIN, DAILY_MAX, BASE={}, ALL_FROM, ALL_TO;
let tz = +store.get('tt_tz',3);
function localize(){
  V.forEach(v => { const d=new Date(v.dt+'Z'); const l=new Date(d.getTime()+tz*3600e3);
    v.date=l.toISOString().slice(0,10); v.day=l.getUTCDay(); v.hour=l.getUTCHours(); v.time=l.toISOString().slice(11,16); });
}
function ingest(data){
  DATA = data;
  V = DATA.videos.map(v => {
    const r = v.retention || [];
    return Object.assign({}, v, {
      shareRate: v.shares/v.views, saveRate: v.saves/v.views,
      engRate: (v.likes+v.comments+v.shares+v.saves)/v.views,
      conv: v.newFollowers/v.views,
      r2: r.length>2? r[2]:null, r3: r.length>3? r[3]:null, r5: r.length>5? r[5]:null,
      dropSec: r.length ? (r.findIndex(x=>x<0.5)) : null,
      watchPct: v.dur ? v.avgWatch/v.dur : null,
      fy: v.sources.foryou, search: v.sources.search,
      autoType: autoType(v.caption),
      short: v.caption.length>60 ? v.caption.slice(0,58)+'…' : v.caption,
    });
  });
  FOLLOWERS = Object.fromEntries(DATA.daily.map(d=>[d.date,d.totalFollowers]));
  V.forEach(v => { const f = FOLLOWERS[v.dt.slice(0,10)]; v.followersAtPost = f ?? null; v.viewsPerFollower = f ? v.views/f : null; });
  PULL = DATA.pulledAt;
  DAILY_MIN = DATA.daily[0].date; DAILY_MAX = DATA.daily[DATA.daily.length-1].date;
  // وسيط الحساب (كل الفيديوهات) — مرجع داخلي وليس معياراً من تيك توك
  BASE = {};
  ['views','avgWatch','fullRate','shareRate','saveRate','engRate','conv','r2','r3','r5','fy','search','newFollowers','watchPct','viewsPerFollower'].forEach(k => BASE[k]=median(V.map(v=>v[k])));
  ALL_FROM = DATA.range.from; ALL_TO = DATA.range.to;
  localize();
}
ingest(DATA);

/* ---------- عناصر مشتركة ---------- */
function kpi(label, val, src, delta){ return `<div class="card kpi"><div class="label">${label}</div><div class="val">${val}</div>${delta||''}<span class="src">المصدر: ${src}</span></div>`; }
function deltaHtml(cur, prev, label){
  if(prev==null || cur==null) return `<div class="delta na">مقارنة ${label}: غير متوفر في البيانات</div>`;
  if(prev===0) return `<div class="delta na">الفترة السابقة = 0</div>`;
  const d=(cur-prev)/prev; const cls=d>=0?'up':'down';
  return `<div class="delta ${cls}">${d>=0?'▲':'▼'} ${pct(Math.abs(d))} مقارنة ${label} (${nf(prev)})</div>`;
}
function vlink(v, text){ return `<span class="vlink" data-v="${v.id}">${esc(text||v.short)}</span>`; }
const rel = (x, b) => (x==null||b==null||!b) ? null : (x-b)/b;
function relTag(x,b){ const r=rel(x,b); if(r==null) return '<span class="tag">—</span>'; return `<span class="tag ${r>=0?'good':'bad'}">${r>=0?'+':''}${pct(r,0)}</span>`; }
function tableHtml(cols, rows, opts={}){
  return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}${c.sort?' sortable':''}" ${c.sort?`data-sort="${c.sort}"`:''}>${c.h}${opts.sortKey&&opts.sortKey===c.sort?`<span class="arrow">${opts.sortDir>0?'▲':'▼'}</span>`:''}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${cols.length}" class="muted">لا توجد فيديوهات في هذه الفترة</td></tr>`}</tbody></table></div>`;
}

function findings(vs,dCur){
  const out=[]; if(!vs.length) return ['<li class="muted">لا توجد فيديوهات في هذه الفترة.</li>'];

  out.push(`<li>أعلى فيديو: ${vlink(top)} بـ <b>${nf(top.views)}</b> مشاهدة، أي ${pct(top.views/tot)} من مشاهدات فيديوهات الفترة. الأداء مركّز في عدد قليل من الفيديوهات.</li>`);
  const s1=spearman(vs.map(v=>v.views),vs.map(v=>v.avgWatch)), s2=spearman(vs.map(v=>v.views),vs.map(v=>v.fullRate)), s3=spearman(vs.map(v=>v.views),vs.map(v=>v.r5));
  if(s1.r!=null) out.push(`<li>ارتباط المشاهدات بمتوسط مدة المشاهدة <b>${nf(s1.r,2)}</b>، وبالاحتفاظ عند الثانية 5 <b>${nf(s3.r,2)}</b>، وبنسبة المشاهدة الكاملة <b>${nf(s2.r,2)}</b> (معامل سبيرمان، ${s1.n} فيديو). يتوافق مع ${c('C5','C8')}، ونسبة الإكمال أضعف ارتباطاً مما يوحي به ${c('C1')}.</li>`);
  const nv=sum(vs.map(v=>v.views)); const dv=sum(dCur.map(d=>d.views));
  if(dCur.length && range.from>=DAILY_MIN && dv>0) out.push(`<li>مشاهدات الحساب اليومية في الفترة <b>${nf(dv)}</b>، وإجمالي مشاهدات الفيديوهات المنشورة داخل الفترة <b>${nf(nv)}</b> (مدى الحياة). ${nv<dv?`الفرق يعني أن جزءاً كبيراً من المشاهدات يأتي من فيديوهات أقدم.`:''}</li>`);
  const s=spearman(vs.map(v=>v.views),vs.map(v=>v.shareRate)), sv=spearman(vs.map(v=>v.views),vs.map(v=>v.saveRate)), se=spearman(vs.map(v=>v.views),vs.map(v=>v.engRate));
  if(s.r!=null) out.push(`<li>معدل المشاركة (${nf(s.r,2)}) ومعدل الحفظ (${nf(sv.r,2)}) يرتبطان بالمشاهدات أكثر بكثير من معدل التفاعل الإجمالي (${nf(se.r,2)}) الذي تغلب عليه الإعجابات ${c('C2')}.</li>`);
  return out;
}

function successReasons(v){
  const R=[];
  if(v.avgWatch>BASE.avgWatch) R.push(`<li><strong>وقت مشاهدة أعلى:</strong> متوسط ${sec(v.avgWatch)} مقابل وسيط الحساب ${sec(BASE.avgWatch)} (${relTag(v.avgWatch,BASE.avgWatch)}). وقت المشاهدة هو الأثقل وزناً ${c('C5')}.</li>`);
  if(v.r5!=null && v.r5>BASE.r5) R.push(`<li><strong>بداية أقوى:</strong> ${pct(v.r5,0)} باقين عند الثانية 5 مقابل وسيط ${pct(BASE.r5,0)} ${c('C8')}.</li>`);
  if(v.shareRate>BASE.shareRate) R.push(`<li><strong>مشاركة أعلى:</strong> ${pct(v.shareRate,2)} من المشاهدين شاركوه مقابل وسيط ${pct(BASE.shareRate,2)}. المشاركة من التفاعلات التي يتوقعها النظام ${c('C2')}.</li>`);
  if(v.saveRate>BASE.saveRate) R.push(`<li><strong>حفظ أعلى:</strong> ${pct(v.saveRate,2)} حفظوه مقابل وسيط ${pct(BASE.saveRate,2)} ${c('C2')}.</li>`);
  if(v.fullRate>BASE.fullRate) R.push(`<li><strong>إكمال أعلى:</strong> ${pct(v.fullRate)} شاهدوه كاملاً مقابل وسيط ${pct(BASE.fullRate)} ${c('C1')}.</li>`);
  if(v.search>BASE.search) R.push(`<li><strong>زيارات من البحث:</strong> ${pct(v.search,0)} من المشاهدات من البحث مقابل وسيط ${pct(BASE.search,0)}. الموضوع يطابق ما يبحث عنه الناس ${c('C7','C15')}.</li>`);
  if(v.fy>0.8) R.push(`<li><strong>توزيع For You:</strong> ${pct(v.fy,0)} من المشاهدات من صفحة For You. تيك توك يربط ذلك بإشارات مشاهدة قوية ${c('C7')}.</li>`);
  if(v.dur && v.dur>=60 && v.avgWatch>BASE.avgWatch) R.push(`<li><strong>فيديو طويل (${nf(v.dur,0)}ث) حافظ على وقت المشاهدة</strong>، وهذا ما يصفه تيك توك للفيديوهات الأطول ${c('C12')}.</li>`);
  if(!R.length) R.push('<li>لا يوجد مقياس متاح أعلى من وسيط الحساب يفسر الأداء. السبب غير متوفر في البيانات.</li>');
  return R;
}
function flopDiagnosis(v){

/* ================= 8) أوقات النشر ================= */
let heatMetric='views';
function activityLocal(){ const a=DATA.activityByHour; return [...Array(24).keys()].map(h=>a[((h - tz)%24+24)%24]); }
function peakInfo(){ const a=activityLocal(); let p=0; a.forEach((x,i)=>{ if(x>a[p]) p=i; }); return {peak:p, val:a[p], from:(p-2+24)%24, arr:a}; }
const hh = h => String(h).padStart(2,'0')+':00';
function renderTiming(){
  const vs=FV(); const HM={views:{l:'وسيط المشاهدات',f:g=>median(g.map(v=>v.views)),fmt:x=>nf(x)},eng:{l:'وسيط معدل التفاعل',f:g=>median(g.map(v=>v.engRate)),fmt:x=>pct(x,1)},full:{l:'وسيط المشاهدة الكاملة',f:g=>median(g.map(v=>v.fullRate)),fmt:x=>pct(x,1)}}[heatMetric];
  const cells={}; vs.forEach(v=>{ (cells[v.day+'-'+v.hour]=cells[v.day+'-'+v.hour]||[]).push(v); });
  const vals=Object.values(cells).map(g=>HM.f(g)); const mx=Math.max(...vals), mn=Math.min(...vals);
  const ramp=['#104281','#184f95','#256abf','#3987e5','#6da7ec','#9ec5f4','#cde2fb'];
  const col=x=>{ if(mx===mn) return ramp[3]; const t=(x-mn)/(mx-mn); return ramp[Math.min(ramp.length-1,Math.floor(t*ramp.length))]; };
  const hours=[...Array(24).keys()];
  let heat='<table><thead><tr><th></th>'+hours.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>';
  for(let d=0;d<7;d++){ heat+=`<tr><th style="text-align:right;white-space:nowrap">${DAYS[d]}</th>`+hours.map(h=>{ const g=cells[d+'-'+h]; if(!g) return '<td class="cell empty"></td>'; const x=HM.f(g); return `<td class="cell" style="background:${col(x)};color:${(x-mn)/(mx-mn||1)>.55?'#141833':'#fff'}" title="${DAYS[d]} ${hh(h)} · ${HM.l}: ${HM.fmt(x)} · ${g.length} فيديو">${g.length}</td>`; }).join('')+'</tr>'; }
  heat+='</tbody></table>';
  const byDay=DAYS.map((n,d)=>{ const g=vs.filter(v=>v.day===d); return {n,g,c:g.length,mv:median(g.map(v=>v.views)),eng:median(g.map(v=>v.engRate)),full:median(g.map(v=>v.fullRate))}; });
  const periods=[['الفجر والصباح (5–11)',h=>h>=5&&h<12],['الظهر والعصر (12–16)',h=>h>=12&&h<17],['المساء (17–20)',h=>h>=17&&h<21],['الليل (21–4)',h=>h>=21||h<5]].map(([n,f])=>{ const g=vs.filter(v=>f(v.hour)); return {n,c:g.length,mv:median(g.map(v=>v.views)),eng:median(g.map(v=>v.engRate)),full:median(g.map(v=>v.fullRate))}; });
  const pk=peakInfo(); const hourCounts={}; vs.forEach(v=>hourCounts[v.hour]=(hourCounts[v.hour]||0)+1);
  const topHour=Object.entries(hourCounts).sort((a,b)=>b[1]-a[1])[0];

  let daily=day.filter(d=>d.date && d.total_followers_count>0).map(d=>({date:d.date,views:d.video_views,likes:d.likes,shares:d.shares,comments:d.comments,lost:d.daily_lost_followers,totalFollowers:d.total_followers_count,profileViews:d.profile_views})).sort((a,b)=>a.date<b.date?-1:1);
  while(daily.length && daily[daily.length-1].views===0) daily.pop();
  const AC={}; act.forEach(r=>{ if(r.audience_activity_hour==null) return; (AC[r.date]=AC[r.date]||{})[+r.audience_activity_hour]=r.audience_activity_count; });
  const days=Object.keys(AC).sort().filter(d=>Object.keys(AC[d]).length===24).slice(-7);
  if(!videos.length || !daily.length || !days.length) throw {code:'bad_shape'};
  const hours=[...Array(24).keys()].map(h=>Math.round(days.reduce((s,d)=>s+AC[d][h],0)/days.length));
  const to=[videos[videos.length-1].dt.slice(0,10), daily[daily.length-1].date].sort()[1];
  return {account:SNAPSHOT.account, pulledAt:new Date().toISOString().slice(0,10), range:{from:videos[0].dt.slice(0,10), to}, videos, daily, activityByHour:hours, activityDates:days};
}

$('#modalX').onclick=closeModal; $('#modalBg').onclick=e=>{ if(e.target.id==='modalBg') closeModal(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
document.addEventListener('click',e=>{ const cr=e.target.closest('.crit'); if(cr){ e.stopPropagation(); openCrit(cr.dataset.c); return; } const vl=e.target.closest('[data-v]'); if(vl && !e.target.closest('select')){ openVideo(vl.dataset.v); } });

/* ---------- التبويبات والتشغيل ---------- */
const RENDER={overview:renderOverview,ask:renderAsk,videos:renderVideos,hits:renderHits,hook:renderHook,viral:renderViral,types:renderTypes,duration:renderDuration,timing:renderTiming,conversion:renderConversion,action:renderAction,tests:renderTests,calendar:renderCalendar,sources:renderSources};
let current=store.get('tt_tab','overview'); if(!RENDER[current]) current='overview';
function showTab(t){ current=t; store.set('tt_tab',t);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('on',s.id==='t-'+t));
  RENDER[t](); }
function renderAll(){ $('#rangeLabel').textContent=`${range.from} ← ${range.to} · ${FV().length} فيديو`; RENDER[current](); }
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ showTab(b.dataset.t); window.scrollTo({top:0}); });
document.querySelectorAll('#presetSeg button').forEach(b=>b.onclick=()=>setPreset(b.dataset.p));
$('#dFrom').onchange=e=>{ range.from=e.target.value||ALL_FROM; renderAll(); };
$('#dTo').onchange=e=>{ range.to=e.target.value||ALL_TO; renderAll(); };
$('#dFrom').min=$('#dTo').min=ALL_FROM; $('#dFrom').max=$('#dTo').max=ALL_TO;
$('#tzSel').value=String(tz); $('#tzSel').onchange=e=>{ tz=+e.target.value; store.set('tt_tz',tz); localize(); renderAll(); };
updateMeta();
setPreset('all'); showTab(current);
initDb().then(()=>rerenderIfIdle(['tests']));
loadLive(false);
</script>
