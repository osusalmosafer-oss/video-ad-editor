<!doctype html><html><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#1F2449;overflow:hidden}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,#2a3270 0%,#1F2449 55%,#161a38 100%)}
.c{position:absolute;left:540px;top:900px;transform:translate(-50%,-50%)}
#dot{width:36px;height:36px;border-radius:50%;background:#2884FF}
#ring{width:420px;height:420px;border-radius:50%;border:12px solid #2884FF}
#icon{width:300px}
#logo{width:620px;height:auto}
#shine{width:620px;height:693px;-webkit-mask:url(logo-vertical-on-dark.png) center/contain no-repeat;mask:url(logo-vertical-on-dark.png) center/contain no-repeat;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%);background-size:300% 100%;background-repeat:no-repeat}
</style><body><div id="bg"></div>
<div id="dot" class="c"></div><div id="ring" class="c"></div><img id="icon" class="c" src="icon-on-dark.png">
<img id="logo" class="c" src="logo-vertical-on-dark.png"><div id="shine" class="c"></div>
<script>
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=t=>1-Math.pow(1-t,3), eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eb=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const seg=(t,a,b)=>cl((t-a)/(b-a));
window.setT=function(t){
 const d=document.getElementById('dot'),r=document.getElementById('ring'),i=document.getElementById('icon'),l=document.getElementById('logo'),s=document.getElementById('shine'),bg=document.getElementById('bg');
 // dot: 0-0.6 appear (pop), 0.6-1.2 grows into ring
 const dp=eb(seg(t,0.1,0.6)); const rp=eo(seg(t,0.6,1.3));
 let dscale=dp*(1-rp); d.style.opacity=t<1.3?1:0; d.style.transform=`translate(-50%,-50%) scale(${dscale})`;
 d.style.boxShadow=`0 0 ${40*dp}px ${14*dp}px rgba(40,132,255,.55)`;
 // ring: scale from 0.1 to 1, then expands & fades 1.9-2.6
 const rexp=eio(seg(t,1.9,2.7));
 r.style.opacity=(t<0.6?0:1)*(1-rexp);
 r.style.transform=`translate(-50%,-50%) scale(${0.1+0.9*rp+rexp*1.4})`;
 r.style.borderWidth=(12*(1-0.6*rexp))+'px';
 // icon: appears inside ring 1.1-1.7 (scale pop), crossfades to full logo 1.9-2.5
 const ip=eb(seg(t,1.1,1.7)); const cf=eio(seg(t,1.95,2.2));
 i.style.opacity=ip>0?(1-cf):0; i.style.transform=`translate(-50%,-50%) scale(${ip*(1-0.0*cf)})`;
 const lp=cf;
 l.style.opacity=lp; l.style.transform=`translate(-50%,-50%) scale(${0.92+0.08*eo(lp)})`;
 // shine sweep 2.7-3.5
 const sp=seg(t,2.7,3.6); s.style.opacity=(sp>0&&sp<1)?1:0; s.style.transform=`translate(-50%,-50%) scale(${0.92+0.08*eo(lp)})`;
 s.style.backgroundPosition=`${100-sp*100}% 0`;
 // fade out end
 const fo=seg(t,4.2,4.6); document.body.style.opacity=1-fo;
};
setT(0);
</script></body></html>
