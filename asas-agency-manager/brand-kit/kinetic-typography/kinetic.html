<!doctype html><html lang="ar" dir="ltr"><meta charset="utf-8"><style>
@font-face{font-family:C;src:url(file:///home/user/video-ad-editor/asas-agency-manager/brand-kit/fonts/Cairo-900.ttf);font-weight:900}
@font-face{font-family:C;src:url(file:///home/user/video-ad-editor/asas-agency-manager/brand-kit/fonts/Cairo-700.ttf);font-weight:700}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#1F2449;overflow:hidden;font-family:C}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,#2c3574 0%,#1F2449 55%,#151934 100%)}
.w{position:absolute;left:0;top:900px;width:1080px;text-align:center;white-space:nowrap;font-weight:900;line-height:1.1;transform:translateY(-50%);opacity:0;text-shadow:0 8px 40px rgba(0,0,0,.35)}
#logo{position:absolute;left:280px;top:1210px;width:520px;transform:translateY(-50%);opacity:0}
.w span{display:inline-block;direction:rtl;unicode-bidi:isolate}
</style><body><div id="bg"></div>
<div id="w1" class="w" style="font-size:250px;color:#2884FF">أقرب</div>
<div id="w2" class="w" style="font-size:360px;color:#FFC233">باب</div>
<div id="w3" class="w" style="font-size:215px;color:#fff">لفندقك؟</div>
<div id="s1" class="w" style="font-size:125px;color:#fff">اكتب اسم فندقك</div>
<div id="s2" class="w" style="font-size:165px;color:#FFC233">في التعليقات</div>
<div id="s3" class="w" style="font-size:185px;color:#FFC233">احفظ المنشور</div>
<div id="s4" class="w" style="font-size:66px;color:#fff;font-weight:700">الرابط في البايو</div>
<img id="logo" src="logo-horizontal-on-dark.png">
<script>
const cl=(x)=>Math.min(1,Math.max(0,x));
const eo=t=>1-Math.pow(1-t,3), eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, ei=t=>t*t*t;
const eb=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const tw=(t,a,b,f,to,e=eio)=>f+(to-f)*e(cl((t-a)/(b-a)));
const set=(id,o)=>{const el=document.getElementById(id);el.style.opacity=o.o;el.style.transform='translateY(-50%) translate('+o.x+'px,'+o.y+'px) scale('+o.s+') rotate('+(o.r||0)+'deg)'};
window.setT=function(t){
 // W1: enter 0.2-0.8 from top; shrink 1.2-1.9 to right-top; exit with scene change at 4.8
 let o1=tw(t,0.2,0.5,0,1,eo)*(1-tw(t,4.8,5.15,0,1,ei));
 let y1=tw(t,0.2,0.8,-700,0,eb)+tw(t,1.2,1.9,0,-330);
 let s1=1-0.55*eio(cl((t-1.2)/0.7));
 let x1=tw(t,1.2,1.9,0,125);
 set('w1',{o:o1,x:x1,y:y1,s:s1});
 // W2: pop 1.3-1.9, shrink 2.4-3.0 to left
 let o2=tw(t,1.3,1.5,0,1,eo)*(1-tw(t,4.8,5.15,0,1,ei));
 let s2=0.001+Math.max(0,eb(cl((t-1.3)/0.6)))*1; s2=s2*(1-0.55*eio(cl((t-2.4)/0.6)));
 let y2=tw(t,2.4,3.0,40,-330); let x2=tw(t,2.4,3.0,0,-125);
 set('w2',{o:o2,x:x2,y:y2,s:s2});
 // W3: 2.6-3.3 in (scale 1.5->1), wobble, exit
 let o3=tw(t,2.6,2.85,0,1,eo)*(1-tw(t,4.8,5.15,0,1,ei));
 let s3=tw(t,2.6,3.3,1.6,1,eb)*(1+0.02*Math.sin(t*14)*cl((t-3.3)/0.2)*(1-cl((t-4.4)/0.4)));
 let r3=tw(t,2.6,3.3,-6,0,eb);
 set('w3',{o:o3,x:0,y:tw(t,2.6,3.3,60,150,eo),s:s3,r:r3});
 // Scene 2
 let a=cl((t-5.2)/0.1), b=1-tw(t,6.6,6.95,0,1,ei);
 set('s1',{o:tw(t,5.2,5.45,0,1,eo)*b,x:tw(t,5.2,5.8,-900,0,eo),y:-120,s:1});
 set('s2',{o:tw(t,5.5,5.75,0,1,eo)*b,x:tw(t,5.5,6.1,900,0,eo),y:80,s:1});
 // Scene 3
 let b3=1-tw(t,9.0,9.4,0,1,ei);
 set('s3',{o:tw(t,7.0,7.2,0,1,eo)*b3,x:0,y:-170,s:Math.max(0.001,tw(t,7.0,7.6,0.2,1,eb))});
 set('s4',{o:tw(t,7.6,8.0,0,1,eo)*b3,x:0,y:tw(t,7.6,8.0,40,0,eo)+10,s:1});
 const lg=document.getElementById('logo');lg.style.transform='translateY(-50%)';lg.style.opacity=tw(t,8.1,8.5,0,1,eo)*b3;
 document.getElementById('bg').style.filter='brightness('+(1+0.06*Math.sin(t*3))+')';
};
document.querySelectorAll('.w').forEach(e=>{e.innerHTML='<span>'+e.textContent+'</span>'});
document.fonts.ready.then(()=>{document.querySelectorAll('.w').forEach(e=>{const w=e.firstChild.getBoundingClientRect().width;if(w>900){e.style.fontSize=(parseFloat(e.style.fontSize)*900/w)+'px'}});});
setT(0);
</script></body></html>
