<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:K;src:url(NotoKufiArabic-VF.ttf);font-weight:100 900}
@font-face{font-family:R;src:url(ArefRuqaa-Bold.ttf);font-weight:700}
@font-face{font-family:B;src:url(IBMPlexSansArabic-Bold.ttf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow:hidden;width:1080px;height:1920px}body{width:1080px;height:1920px;background:#05070D;overflow:hidden;position:relative;font-family:B;color:#F4EFE4}
.bg{position:absolute;inset:0;background:linear-gradient(180deg,#0B1220 0%,#05070D 55%,#020306 100%)}
.beam{position:absolute;top:-40px;width:380px;height:1900px;background:linear-gradient(180deg,rgba(233,210,160,.16),rgba(233,210,160,0));transform-origin:top;filter:blur(8px)}
.dust{position:absolute;border-radius:50%;background:#E9D2A0}
.hud{position:absolute;left:80px;right:80px;top:150px;display:flex;justify-content:space-between;font-size:30px;color:#7C8594;letter-spacing:2px}
.hud i{font-style:normal;color:#C9A25B;font-family:B;direction:ltr}
.hud:after{content:"";position:absolute;left:0;right:0;top:46px;height:2px;background:rgba(244,239,228,.22)}
h1{position:absolute;left:0;right:0;top:250px;text-align:center;font-family:K;font-weight:900;font-size:270px;line-height:1.3;white-space:nowrap}
.bar{position:absolute;left:230px;right:230px;top:648px;height:6px;background:#C42B35}
.dot{position:absolute;left:526px;top:644px;width:28px;height:28px;border-radius:50%;background:#C42B35}
.sub{position:absolute;left:0;right:0;top:690px;text-align:center;font-size:54px;color:#C42B35;font-family:K;font-weight:800}
.foot{position:absolute;left:200px;top:880px;width:640px}
svg{position:absolute;left:0;top:0}
.hadith{position:absolute;left:100px;right:100px;top:1330px;text-align:center;font-family:R;font-weight:700;font-size:74px;line-height:1.7;color:#F4EFE4}
.hadith b{color:#E8545E;font-weight:700}
.src{position:absolute;left:0;right:0;top:1640px;text-align:center;font-size:36px;color:#C9A25B}
.src:before,.src:after{content:"";display:inline-block;width:150px;height:2px;background:#C9A25B;vertical-align:middle;margin:0 24px;opacity:.7}
.corner{position:absolute;width:70px;height:70px;border:4px solid #C9A25B}
</style></head><body>
<div class="bg"></div>
<div class="beam" style="left:60px;transform:rotate(-14deg)"></div><div class="beam" style="left:380px;transform:rotate(-14deg);opacity:.6"></div>
<script>for(let i=0;i<70;i++){const d=document.createElement('div');d.className='dust';const s=1+Math.random()*2.4;d.style.cssText+=`left:${Math.random()*1080}px;top:${Math.random()*1900}px;width:${s}px;height:${s}px;opacity:${.15+Math.random()*.4}`;document.body.appendChild(d)}</script>
<div class="hud"><span>تنبيه</span><i>01 / 05</i></div>
<h1>الإسبال</h1><div class="bar"></div><div class="dot"></div>
<div class="sub">قد تكون في خطر وأنت لا تشعر</div>
<img class="foot" src="foot.png">
<svg id="sv" width="1080" height="1920" viewBox="0 0 1080 1920">
 <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f1e6" stop-opacity="0"/><stop offset=".25" stop-color="#f6f1e6"/><stop offset="1" stop-color="#d9d2c0"/></linearGradient>
 <linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C42B35" stop-opacity="0"/><stop offset="1" stop-color="#C42B35" stop-opacity=".85"/></linearGradient></defs>
 <path id="cloth" fill="url(#g)"/><path id="red" fill="url(#r)" opacity=".6"/><path id="hem" fill="none" stroke="#C42B35" stroke-width="9" stroke-linecap="round"/>
 <ellipse cx="350" cy="1062" rx="250" ry="40" fill="none" stroke="#C9A25B" stroke-width="5"/>
 <ellipse cx="350" cy="1062" rx="300" ry="54" fill="none" stroke="#C9A25B" stroke-width="2" opacity=".5"/>
 <circle cx="312" cy="1060" r="26" fill="none" stroke="#C9A25B" stroke-width="4"/>
 <path d="M334 1046 L430 990 L760 990" fill="none" stroke="#C9A25B" stroke-width="3"/><circle cx="334" cy="1046" r="6" fill="#C9A25B"/>
 <text x="760" y="978" text-anchor="end" font-family="B" font-size="40" fill="#C9A25B">الكعبان</text>
</svg>
<script>
const xl=190,xr=550,yt=760,yh=972;let w='';for(let x=xr+10;x>=xl-10;x-=18){w+=' Q'+(x-9)+' '+(yh+(((x/18)|0)%2?16:-4))+' '+(x-18)+' '+yh}
const wave='M'+(xr+10)+' '+yh+w.replace(/^ /,' ');
document.getElementById('cloth').setAttribute('d','M'+xl+' '+yt+' L'+xr+' '+yt+' L'+(xr+10)+' '+yh+' '+w+' Z');
document.getElementById('hem').setAttribute('d',wave);
document.getElementById('red').setAttribute('d','M'+(xl-10)+' 920 L'+(xr+10)+' 920 L'+(xr+10)+' '+yh+' '+w+' Z');
</script>
<div class="hadith">«ما أسفلَ من الكعبينِ من الإزارِ<br>فَفِي <b>النَّارِ</b>»</div>
<div class="src">رواه البخاري</div>
<div class="corner" style="left:70px;top:230px;border-right:0;border-bottom:0"></div><div class="corner" style="right:70px;top:230px;border-left:0;border-bottom:0"></div>
</body></html>
