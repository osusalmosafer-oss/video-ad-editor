<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>لعبة عبودي</title>
<style>
html,body{margin:0;height:100%;background:#2b1b4d;overflow:hidden;touch-action:none;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;background:rgba(40,15,90,.82);color:#fff;text-align:center;padding:20px;box-sizing:border-box}
.ov.hide{display:none}
.ov h1{margin:0;font-size:clamp(38px,9vw,64px);color:#ffe14d;text-shadow:0 4px 0 #e0436b,0 8px 18px rgba(0,0,0,.4)}
.ov p{margin:0;font-size:clamp(16px,4vw,22px);line-height:1.7;max-width:420px}
.face{width:min(46vw,200px);height:min(46vw,200px);border-radius:50%;border:6px solid #fff;object-fit:cover;
  box-shadow:0 0 0 6px #ff6fa5,0 12px 30px rgba(0,0,0,.45);animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
button.go{font:inherit;font-size:clamp(24px,6vw,34px);font-weight:700;color:#fff;background:linear-gradient(#ff7ab0,#e0436b);
  border:0;border-bottom:6px solid #a8234a;border-radius:40px;padding:12px 44px;cursor:pointer;margin-top:6px}
button.go:active{transform:translateY(4px);border-bottom-width:2px}
#mute{position:fixed;top:10px;left:10px;font-size:26px;background:rgba(0,0,0,.35);color:#fff;border:0;border-radius:50%;
  width:46px;height:46px;cursor:pointer;z-index:5}
.big{font-size:clamp(30px,8vw,46px);font-weight:700;color:#ffe14d}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="الصوت">🔊</button>

<div id="start" class="ov">
  <img class="face" id="startFace" alt="عبودي">
  <h1>لعبة عبودي</h1>
  <p>اركض مع عبودي وجمّع الآيس كريم 🍦 والحلويات 🍬 والبالونات 🎈<br>
     وابتعد عن الألعاب اللي بالطريق!</p>
  <p style="font-size:clamp(14px,3.6vw,18px);opacity:.9">
    اسحب يمين/يسار للتحرّك — اسحب لفوق أو اضغط بالنص للقفز<br>(أو الأسهم ومسطرة المسافة بالكيبورد)</p>
  <button class="go" id="playBtn">يلا نلعب! 🎮</button>
</div>

<div id="over" class="ov hide">
  <img class="face" id="overFace" alt="عبودي">
  <h1>انتهت اللعبة!</h1>
  <div class="big" id="finalScore">0</div>
  <p id="finalMsg"></p>
  <button class="go" id="againBtn">مرة ثانية! 🔄</button>
</div>

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, U = 20, HY = 0, PY = 0, TOPW = 0, BOTW = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = Math.min(W * 0.075, H * 0.05);
  HY = H * 0.30;            // الأفق
  PY = H * 0.84;            // خط اللاعب
  BOTW = Math.min(W * 0.98, H * 0.62);
  TOPW = BOTW * 0.22;
}
window.addEventListener("resize", resize); resize();

/* ---------- الصوت ---------- */
let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f, d = 0.12, type = "sine", vol = 0.12, slide = 0, delay = 0) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.03);
}
const sfx = {
  jump: () => tone(300, .18, "square", .06, 400),
  coin: c => { tone(660 + c * 40, .09, "triangle", .13); tone(990 + c * 40, .12, "triangle", .11, 0, .07); },
  balloon: () => { tone(520, .1, "sine", .15, 500); tone(1040, .14, "sine", .1, 0, .08); },
  hit: () => { tone(200, .35, "sawtooth", .15, -140); tone(120, .35, "square", .1, -60, .05); },
  power: () => [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .14, "square", .08, 0, i * .07)),
  over: () => [440, 392, 349, 262].forEach((f, i) => tone(f, .25, "triangle", .12, 0, i * .18)),
  heart: () => [784, 988, 1175].forEach((f, i) => tone(f, .14, "sine", .12, 0, i * .08)),
};
const MELODY = [523,587,659,784,659,587,523,0, 659,784,880,784,659,587,523,0, 392,523,587,659,587,523,392,0, 440,523,659,587,523,0,0,0];

setInterval(() => {

}, 210);

let state = "menu";

let score, lives, speed, scroll, combo, maxCombo, objs, spawnAcc, texts, parts, shake,
    laneF, laneT, jumpT, invT, starT, faceKind, faceT, runT, nextGap, flash, coinCount;
const JUMP_DUR = 0.72, JUMP_H = () => U * 3.4;

function reset() {
  score = 0; lives = 3; speed = 0.42; scroll = 0; combo = 0; maxCombo = 0; coinCount = 0;
  objs = []; texts = []; parts = []; shake = 0; flash = 0;
  laneF = 1; laneT = 1; jumpT = -1; invT = 0; starT = 0; faceKind = 1; faceT = 0; runT = 0;
  spawnAcc = 0; nextGap = 0.3;
}
reset();

const OBST = ["🚗", "🧱", "🧸", "🚂", "⚽", "🪀"];
const GOOD = [["🍦", 10], ["🍬", 5], ["🍭", 7], ["🍩", 8], ["🍪", 6]];
const PRAISE = ["برافو عبودي!", "حلو كثير!", "ياااي!", "يمّي!", "بطل!", "ممتاز!", "كمّل كمّل!"];

function spawnRow() {
  const r = Math.random();
  const lanes = [0, 1, 2].sort(() => Math.random() - .5);
  if (r < 0.34) {
    const n = (score > 150 && Math.random() < 0.45) ? 2 : 1;
    for (let i = 0; i < n; i++) objs.push({ k: "obs", e: OBST[Math.random() * OBST.length | 0], lane: lanes[i], z: 0, done: false });
    if (n === 1 && Math.random() < .6) objs.push({ k: "good", e: "🍦", v: 10, lane: lanes[1], z: 0, done: false });
  } else if (r < 0.74) {
    const g = GOOD[Math.random() * GOOD.length | 0], cnt = 3 + (Math.random() * 3 | 0);
    for (let i = 0; i < cnt; i++) objs.push({ k: "good", e: g[0], v: g[1], lane: lanes[0], z: -i * 0.07, done: false });
  } else if (r < 0.90) {
    objs.push({ k: "obs", e: OBST[Math.random() * OBST.length | 0], lane: lanes[0], z: 0, done: false });
    for (let i = 0; i < 3; i++) objs.push({ k: "air", e: "🎈", v: 15, lane: lanes[0], z: -0.05 + (i - 1) * 0.07, done: false });
  } else if (r < 0.95) {
    objs.push({ k: "star", e: "⭐", lane: lanes[0], z: 0, done: false });
  } else if (lives < 3) {
    objs.push({ k: "heart", e: "❤️", lane: lanes[0], z: 0, done: false });
  } else {
    objs.push({ k: "good", e: "🍦", v: 10, lane: lanes[0], z: 0, done: false });
  }
}

/* ---------- الإسقاط (منظور) ---------- */
const proj = z => z * z;                                 // p: 0 الأفق … 1 خط اللاعب
const gy = p => HY + (PY - HY) * p;
const trackW = p => TOPW + (BOTW - TOPW) * p;
const laneX = (lane, p) => W / 2 + (lane - 1) * trackW(p) / 3;

/* ---------- الإدخال ---------- */
function moveLane(d) { if (state !== "play") return; laneT = Math.max(0, Math.min(2, laneT + d)); }
function jump() {
  if (state !== "play" || jumpT >= 0) return;
  jumpT = 0; sfx.jump();
}
window.addEventListener("keydown", e => {
  if (e.repeat) return;
  const k = e.key;
  if (state !== "play") { if (k === "Enter" || k === " ") startGame(); return; }
  if (k === "ArrowLeft" || k === "a" || k === "A") moveLane(-1);
  else if (k === "ArrowRight" || k === "d" || k === "D") moveLane(1);
  else if (k === "ArrowUp" || k === " " || k === "w" || k === "W") { e.preventDefault(); jump(); }
});
let pStart = null;
cv.addEventListener("pointerdown", e => { pStart = { x: e.clientX, y: e.clientY, done: false }; ac(); });
cv.addEventListener("pointermove", e => {
  if (!pStart || pStart.done) return;
  const dx = e.clientX - pStart.x, dy = e.clientY - pStart.y;
  if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)) { moveLane(dx > 0 ? 1 : -1); pStart.done = true; }
  else if (dy < -34 && Math.abs(dy) > Math.abs(dx)) { jump(); pStart.done = true; }
});
cv.addEventListener("pointerup", e => {
  if (pStart && !pStart.done) {
    if (e.clientX < W * .28) moveLane(-1);
    else if (e.clientX > W * .72) moveLane(1);
    else jump();
  }
  pStart = null;
});

/* ---------- تأثيرات ---------- */
function say(text, x, y, color = "#fff") { texts.push({ text, x, y, t: 0, color }); }
function burst(x, y, colors, n = 12) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = U * (2 + Math.random() * 5);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - U * 3, t: 0, c: colors[i % colors.length], r: U * (.12 + Math.random() * .16) });
  }
}
function setFace(k, d) { faceKind = k; faceT = d; }

/* ---------- التحديث ---------- */
function playerX() { return laneX(laneF, 1); }
function jumpH() {
  if (jumpT < 0) return 0;
  const t = jumpT / JUMP_DUR; return 4 * JUMP_H() * t * (1 - t);
}
function update(dt) {
  runT += dt * (6 + speed * 6);
  const boost = starT > 0 ? 1.45 : 1;
  speed = 0.42 + Math.min(0.55, score / 2600);
  const sp = speed * boost;
  scroll += dt * sp * 9;
  score += dt * 6 * (1 + Math.floor(combo / 5) * 0.5) * (starT > 0 ? 2 : 1);

  laneF += (laneT - laneF) * Math.min(1, dt * 14);
  if (jumpT >= 0) { jumpT += dt; if (jumpT >= JUMP_DUR) jumpT = -1; }
  if (invT > 0) invT -= dt;
  if (starT > 0) starT -= dt;
  if (faceT > 0) { faceT -= dt; if (faceT <= 0) faceKind = 1; }
  if (shake > 0) shake -= dt;
  if (flash > 0) flash -= dt;

  spawnAcc += sp * dt;
  if (spawnAcc >= nextGap) { spawnAcc = 0; nextGap = 0.26 + Math.random() * 0.22; spawnRow(); }

  const jh = jumpH(), px = playerX();
  for (const o of objs) {
    o.z += sp * dt;
    if (o.done || o.z < 0.9 || o.z > 1.1) continue;
    const dl = Math.abs(laneF - o.lane);
    if (o.k === "obs") {
      if (dl < 0.62 && jh < U * 1.25) {
        o.done = true;
        if (starT > 0) {
          score += 20; burst(laneX(o.lane, 1), PY - U, ["#ffe14d", "#ff6fa5", "#6fe3ff"], 14); say("بوم!", laneX(o.lane, 1), PY - U * 3, "#ffe14d"); sfx.coin(2);
        } else if (invT <= 0) hit(o);
      }
    } else {
      const reach = (starT > 0 && o.k !== "air") ? 1.7 : 0.62;
      if (dl < reach && (o.k !== "air" || jh > U * 1.0)) { o.done = true; collect(o, px, PY - jh - U * 2); }
    }
  }
  objs = objs.filter(o => o.z < 1.25 && !(o.done && o.k !== "obs"));
  for (const t of texts) t.t += dt;
  texts = texts.filter(t => t.t < 1);
  for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += U * 14 * dt; }
  parts = parts.filter(p => p.t < 0.8);
}

function collect(o, x, y) {
  if (o.k === "star") {
    starT = 7; invT = Math.max(invT, 0.3); sfx.power(); setFace(0, 1.2);
    say("نجمة سحرية! ⭐", x, y, "#ffe14d"); burst(x, y, ["#ffe14d", "#fff", "#ff6fa5"], 24); flash = .25; return;
  }
  if (o.k === "heart") {
    if (lives < 3) lives++; sfx.heart(); say("قلب إضافي ❤️", x, y, "#ff6fa5"); burst(x, y, ["#ff6fa5", "#fff"], 14); return;
  }
  combo++; maxCombo = Math.max(maxCombo, combo); coinCount++;
  const mult = 1 + Math.floor(combo / 5);
  const gained = o.v * mult; score += gained;
  if (o.k === "air") sfx.balloon(); else sfx.coin(Math.min(combo, 10));
  setFace(0, 0.45);
  const praise = combo % 5 === 0 ? PRAISE[Math.random() * PRAISE.length | 0] + " ×" + mult : "+" + gained;
  say(praise, x, y, combo % 5 === 0 ? "#6fe3ff" : "#fff");
  burst(x, y, ["#ffe14d", "#ff6fa5", "#6fe3ff", "#9bff7a"], 8);
}
function hit(o) {
  lives--; combo = 0; invT = 1.6; shake = .35; sfx.hit(); setFace(2, 1.1);
  say("أووه!", playerX(), PY - U * 5, "#ff9a9a");
  if (lives <= 0) endGame();
}

/* ---------- الرسم ---------- */
function drawBackground() {
  // جدار
  const g = ctx.createLinearGradient(0, 0, 0, HY + 4);
  g.addColorStop(0, "#f7e6c4"); g.addColorStop(1, "#e9cf9a");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HY + 4);
  // الباب البني في آخر الممر
  const dw = TOPW * 1.15, dh = HY * 0.88, dx = W / 2 - dw / 2, dy = HY - dh;
  ctx.fillStyle = "#5a2f14"; rr(dx - 5, dy - 5, dw + 10, dh + 5, 8); ctx.fill();
  const dg = ctx.createLinearGradient(dx, dy, dx + dw, dy);
  dg.addColorStop(0, "#7a3f1a"); dg.addColorStop(.5, "#9a5424"); dg.addColorStop(1, "#7a3f1a");
  ctx.fillStyle = dg; rr(dx, dy, dw, dh, 6); ctx.fill();
  ctx.strokeStyle = "#e8b878"; ctx.lineWidth = Math.max(2, dw * .025);
  ctx.beginPath(); ctx.arc(W / 2, dy + dh * .36, dw * .27, 0, 6.283); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, dy + dh * .36, dw * .16, 0, 6.283); ctx.stroke();
  rr(dx + dw * .14, dy + dh * .66, dw * .72, dh * .26, 4); ctx.stroke();
  // جدران جانبية
  const sideL = ctx.createLinearGradient(0, 0, W / 2, 0);
  ctx.fillStyle = "#d9b985";
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W / 2 - TOPW / 2, HY); ctx.lineTo(0, PY + 30); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(W / 2 + TOPW / 2, HY); ctx.lineTo(W, PY + 30); ctx.fill();
  // أبواب جانبية تتحرك
  for (let side = -1; side <= 1; side += 2) {
    for (let k = 0; k < 6; k++) {
      const z = ((k + 1 - (scroll * 0.15 % 1)) / 6);
      if (z <= 0.04 || z > 1) continue;
      const p = proj(z), y = gy(p), tw = trackW(p) / 2;
      const x = W / 2 + side * (tw + (W / 2 - tw) * 0.04);
      const h = (PY - HY) * p * 0.55 + 6, w = h * .42;
      ctx.fillStyle = k % 2 ? "#6e3817" : "#7a3f1a";
      ctx.fillRect(side < 0 ? x - w - 4 : x + 4, y - h - (PY - HY) * p * .05, w, h);
    }
  }
  // الأرض خارج السجادة
  ctx.fillStyle = "#c9a56e";
  ctx.beginPath(); ctx.moveTo(0, PY + 30); ctx.lineTo(W / 2 - TOPW / 2, HY); ctx.lineTo(W / 2 + TOPW / 2, HY); ctx.lineTo(W, PY + 30); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  ctx.fillRect(0, H * .98, W, H);
}
function drawTrack() {
  const N = 16, fr = scroll % 1, base = Math.floor(scroll);
  for (let k = 0; k <= N; k++) {
    const z0 = Math.max(0, (k - fr) / N), z1 = Math.min(1.12, (k + 1 - fr) / N);
    if (z1 <= 0) continue;
    const p0 = proj(z0), p1 = proj(z1), y0 = gy(p0), y1 = gy(p1);
    ctx.fillStyle = ((k + base) % 2) ? "#b8a894" : "#cbbca6";
    ctx.beginPath();
    ctx.moveTo(W / 2 - trackW(p0) / 2, y0); ctx.lineTo(W / 2 + trackW(p0) / 2, y0);
    ctx.lineTo(W / 2 + trackW(p1) / 2, y1); ctx.lineTo(W / 2 - trackW(p1) / 2, y1); ctx.fill();
    // وحدات زخرفة السجادة
    if ((k + base) % 2) {
      ctx.fillStyle = "rgba(255,255,255,.55)";
      for (let l = 0; l < 3; l++) {
        const pm = (p0 + p1) / 2, ym = gy(pm), rw = trackW(pm) / 3 * .26, rh = Math.max(2, (y1 - y0) * .32);
        ctx.beginPath(); ctx.ellipse(laneX(l, pm), ym, rw, rh, 0, 0, 6.283); ctx.fill();
      }
    }
  }
  // حواف السجادة
  ctx.strokeStyle = "#8e6f4a"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(W / 2 - TOPW / 2, HY); ctx.lineTo(W / 2 - BOTW / 2 - (BOTW - TOPW) * .12, PY + 30 + (H - PY) * 0.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W / 2 + TOPW / 2, HY); ctx.lineTo(W / 2 + BOTW / 2 + (BOTW - TOPW) * .12, PY + 30 + (H - PY) * 0.2); ctx.stroke();
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function shadow(x, y, w, a = .28) {
  ctx.fillStyle = "rgba(0,0,0," + a + ")";
  ctx.beginPath(); ctx.ellipse(x, y, w, w * .28, 0, 0, 6.283); ctx.fill();
}
function drawObj(o) {
  if (o.z <= 0.02 || o.z > 1.22) return;
  const p = proj(o.z), sc = 0.12 + 0.88 * p, x = laneX(o.lane, p), y = gy(p);
  const size = U * 2.5 * sc;
  ctx.font = size + "px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  let lift = 0;
  if (o.k === "air") lift = U * 2.7 * sc + Math.sin(runT * .5 + o.lane) * U * .15 * sc;
  else if (o.k !== "obs") lift = U * .5 * sc + Math.sin(runT * .6 + o.z * 20) * U * .2 * sc;
  shadow(x, y, size * .42, .22 * Math.min(1, sc + .3));
  if (o.k === "air") { ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y - lift); ctx.lineTo(x, y); ctx.stroke(); }
  if (o.k === "star") { ctx.save(); ctx.translate(x, y - lift - size * .4); ctx.rotate(Math.sin(runT * .3) * .3); ctx.fillText(o.e, 0, size * .4); ctx.restore(); return; }
  ctx.fillText(o.e, x, y - lift);
}
function drawPlayer() {
  const jh = jumpH(), x = playerX(), gyp = PY;
  const blink = invT > 0 && starT <= 0 && Math.floor(invT * 12) % 2 === 0;
  shadow(x, gyp + U * .1, U * 1.3 * (1 - jh / (U * 8)), .3);
  if (blink) ctx.globalAlpha = .45;
  const sw = Math.sin(runT) , by = gyp - jh;           // قاع الجسم
  const lean = (laneT - laneF) * .25;
  ctx.save(); ctx.translate(x, by); ctx.rotate(lean);
  if (starT > 0) { // هالة قوس قزح
    const hue = (runT * 40) % 360;
    ctx.fillStyle = "hsla(" + hue + ",95%,65%,.28)"; ctx.beginPath(); ctx.arc(0, -U * 2.8, U * 3.1, 0, 6.283); ctx.fill();
  }
  const legSwing = jumpT >= 0 ? .2 : sw;
  // أرجل
  ctx.fillStyle = "#e8b48a";
  for (const s of [-1, 1]) {
    const ox = s * U * .45, ly = Math.max(0, legSwing * s) * U * .5;
    rr(ox - U * .26, -U * 1.15 - ly * .2, U * .52, U * 1.05 + ly * .4, U * .25); ctx.fill();
    ctx.fillStyle = "#fff"; rr(ox - U * .36, -U * .24 - ly * .6, U * .72, U * .3, U * .15); ctx.fill(); ctx.fillStyle = "#e8b48a";
  }
  // شورت
  ctx.fillStyle = "#3f5fb0"; rr(-U * .95, -U * 1.75, U * 1.9, U * 1.0, U * .35); ctx.fill();
  // قميص
  ctx.fillStyle = "#fff6e0"; rr(-U * 1.05, -U * 3.15, U * 2.1, U * 1.7, U * .5); ctx.fill();
  ctx.fillStyle = "#ffe14d"; ctx.beginPath(); ctx.arc(U * .25, -U * 2.3, U * .32, 0, 6.283); ctx.fill();
  // أذرع
  ctx.fillStyle = "#e8b48a";
  const arm = jumpT >= 0 ? -1.2 : sw * .9;
  for (const s of [-1, 1]) {
    ctx.save(); ctx.translate(s * U * 1.1, -U * 2.9); ctx.rotate(s * (.35 + (jumpT >= 0 ? .9 : 0)) + (jumpT >= 0 ? 0 : arm * s * .6));
    rr(-U * .24, 0, U * .48, U * 1.3, U * .24); ctx.fill(); ctx.restore();
  }
  // الرأس (صورة عبودي)
  const hr = U * 1.75, hy = -U * 4.55 + Math.abs(Math.sin(runT)) * U * .12;
  const img = faceImgs[faceKind];
  ctx.save(); ctx.translate(0, hy); ctx.rotate(Math.sin(runT * .5) * .06);
  ctx.beginPath(); ctx.arc(0, 0, hr, 0, 6.283); ctx.closePath(); ctx.save(); ctx.clip();
  if (img.complete && img.naturalWidth) ctx.drawImage(img, -hr, -hr, hr * 2, hr * 2);
  else { ctx.fillStyle = "#e8b48a"; ctx.fillRect(-hr, -hr, hr * 2, hr * 2); }
  ctx.restore();
  ctx.lineWidth = U * .22; ctx.strokeStyle = starT > 0 ? "hsl(" + ((runT * 60) % 360) + ",95%,65%)" : "#fff"; ctx.beginPath(); ctx.arc(0, 0, hr, 0, 6.283); ctx.stroke();
  ctx.restore();
  ctx.restore(); ctx.globalAlpha = 1;
}
function drawHUD() {
  ctx.textBaseline = "top"; ctx.direction = "ltr";
  ctx.fillStyle = "rgba(40,15,90,.55)"; rr(W / 2 - 100, 10, 130, 44, 22); ctx.fill();
  ctx.fillStyle = "#ffe14d"; ctx.font = "700 " + Math.max(22, U * 1.3) + "px 'Segoe UI',Tahoma,Arial,sans-serif"; ctx.textAlign = "center";
  ctx.fillText(Math.floor(score) + " ⭐", W / 2 - 35, 17);
  ctx.textAlign = "right"; ctx.font = (U * 1.15) + "px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
  let s = ""; for (let i = 0; i < 3; i++) s += i < lives ? "❤️" : "🖤";
  ctx.fillText(s, W - 10, 18);
  if (combo >= 3) {
    ctx.textAlign = "center"; ctx.fillStyle = "#6fe3ff"; ctx.font = "700 " + Math.max(16, U * 1.0) + "px 'Segoe UI',Tahoma,Arial,sans-serif";
    ctx.fillText("كومبو " + combo + " 🔥", W / 2, 64);
  }
  if (starT > 0) {
    ctx.fillStyle = "rgba(255,255,255,.3)"; rr(W / 2 - 70, 92, 140, 10, 5); ctx.fill();
    ctx.fillStyle = "#ffe14d"; rr(W / 2 - 70, 92, 140 * Math.min(1, starT / 7), 10, 5); ctx.fill();
  }
}
function drawFx() {
  for (const p of parts) { ctx.globalAlpha = 1 - p.t / .8; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  for (const t of texts) {
    ctx.globalAlpha = 1 - t.t * t.t;
    ctx.font = "700 " + Math.max(20, U * 1.25) + "px 'Segoe UI',Tahoma,Arial,sans-serif";
    ctx.lineWidth = 5; ctx.strokeStyle = "rgba(40,15,90,.8)"; ctx.strokeText(t.text, t.x, t.y - t.t * U * 3);
    ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y - t.t * U * 3);
  }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = "rgba(255,255,255," + flash * 1.2 + ")"; ctx.fillRect(0, 0, W, H); }
}
function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * U * .8, (Math.random() - .5) * U * .8);
  drawBackground(); drawTrack();
  const far = objs.filter(o => o.z < 1).sort((a, b) => a.z - b.z);
  far.forEach(drawObj);
  drawPlayer();
  objs.filter(o => o.z >= 1).forEach(drawObj);
  drawFx();
  ctx.restore();
  if (state === "play") drawHUD();
}

/* ---------- التحكم بالمراحل ---------- */
const startEl = document.getElementById("start"), overEl = document.getElementById("over");
function startGame() {
  ac(); reset(); state = "play";
  startEl.classList.add("hide"); overEl.classList.add("hide");
}
function endGame() {
  state = "over"; sfx.over();
  const sc = Math.floor(score);
  let rec = false;
  if (sc > best) { best = sc; rec = true; try { localStorage.setItem("aboudi_best", best); } catch (e) {} }
  document.getElementById("finalScore").textContent = sc + " نقطة";
  document.getElementById("finalMsg").innerHTML =
    (rec ? "🏆 رقم قياسي جديد! برافو عبودي!" : "أفضل نتيجة: " + best) +
    "<br>جمعت " + coinCount + " حلوى 🍬 — أعلى كومبو " + maxCombo + " 🔥";
  setTimeout(() => overEl.classList.remove("hide"), 500);
}
document.getElementById("playBtn").addEventListener("click", startGame);
document.getElementById("againBtn").addEventListener("click", startGame);

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === "play") update(dt);
  else { scroll += dt * 2; runT += dt * 6; for (const t of texts) t.t += dt; texts = texts.filter(t => t.t < 1); }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
