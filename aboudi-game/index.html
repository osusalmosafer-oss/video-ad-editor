<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>لعبة عبودي</title>
<style>
html,body{margin:0;height:100%;background:#2b1b4d;overflow:hidden;touch-action:none;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;background:rgba(40,15,90,.84);color:#fff;text-align:center;padding:16px;box-sizing:border-box;overflow:auto}
.ov.hide{display:none}
.ov h1{margin:0;font-size:clamp(34px,8vw,60px);color:#ffb534;text-shadow:0 4px 0 #b3361b,0 8px 18px rgba(0,0,0,.45);letter-spacing:1px}
.ov p{margin:0;font-size:clamp(14px,3.6vw,20px);line-height:1.7;max-width:520px}
.hero{height:min(34vh,260px);filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));animation:bob 1.1s ease-in-out infinite}
.face{width:min(30vh,170px);height:min(30vh,170px);border-radius:50%;border:6px solid #fff;object-fit:cover;
  box-shadow:0 0 0 6px #ff6b2c,0 12px 30px rgba(0,0,0,.45);animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}
button.go{font:inherit;font-size:clamp(22px,5.5vw,32px);font-weight:700;color:#fff;background:linear-gradient(#ff9a3c,#e2551b);
  border:0;border-bottom:6px solid #9c3410;border-radius:40px;padding:10px 42px;cursor:pointer;margin-top:4px}
button.go:active{transform:translateY(4px);border-bottom-width:2px}
.big{font-size:clamp(28px,7vw,44px);font-weight:700;color:#ffe14d}
#mute{position:fixed;bottom:10px;left:10px;font-size:22px;background:rgba(0,0,0,.4);color:#fff;border:0;border-radius:50%;
  width:42px;height:42px;cursor:pointer;z-index:5}
.btn{position:fixed;bottom:16px;border:0;border-radius:50%;color:#fff;font-weight:700;z-index:4;touch-action:none;
  box-shadow:0 6px 0 rgba(0,0,0,.35),0 10px 20px rgba(0,0,0,.35);font-family:inherit;opacity:.92}
.btn:active,.btn.on{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
#bJump{right:16px;width:clamp(78px,20vmin,120px);height:clamp(78px,20vmin,120px);font-size:clamp(14px,3.6vmin,20px);background:radial-gradient(#6fe36f,#26a526)}
#bSpin{right:calc(clamp(78px,20vmin,120px) + 32px);width:clamp(66px,17vmin,100px);height:clamp(66px,17vmin,100px);font-size:clamp(13px,3.2vmin,18px);background:radial-gradient(#ffb04a,#e2551b)}
.btn span{display:block;font-size:clamp(26px,7vmin,42px);line-height:1}
.btn.hide{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="الصوت">🔊</button>
<button id="bSpin" class="btn hide"><span>🌀</span>دوران</button>
<button id="bJump" class="btn hide"><span>⬆️</span>قفز</button>

<div id="start" class="ov">
  <img class="hero" id="heroImg" alt="عبودي">
  <h1>لعبة عبودي</h1>
  <p>اركض مع عبودي! كسّر الصناديق 📦 بالدوران، جمّع الفاكهة 🍑 واجمع ٣ أقنعة 🎭 لتصير لا يُقهر!<br>
     اقفز فوق الحفر وابتعد عن صناديق TNT والسلاطعين 🦀</p>
  <p style="font-size:clamp(13px,3.3vw,17px);opacity:.9">
    ⬆️ قفز (اضغط مرتين = قفزة مزدوجة) — 🌀 دوران<br>
    كيبورد: مسطرة المسافة / السهم فوق = قفز — X أو Z = دوران</p>
  <button class="go" id="playBtn">يلا نلعب! 🎮</button>
  <p style="font-size:13px;opacity:.7">يفضّل تلف الجوال بالعرض 📱↔️</p>
</div>

<div id="over" class="ov hide">
  <img class="face" id="overFace" alt="عبودي">
  <h1>انتهت اللعبة!</h1>
  <div class="big" id="finalScore">0</div>
  <p id="finalMsg"></p>
  <button class="go" id="againBtn">مرة ثانية! 🔄</button>
</div>

let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f, d = 0.12, type = "sine", vol = 0.12, slide = 0, delay = 0) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.03);
}
function noise(d = 0.2, vol = 0.2, lp = 2000) {
  const a = ac(); if (!a || muted) return;
  const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = lp; g.gain.value = vol;
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}

/* ---------- توليد المرحلة ---------- */
function crate(t, x, lvl = 0) { objs.push({ k: "crate", t, x, lvl, dead: false, arm: 0 }); }
function fruit(x, y) { objs.push({ k: "fruit", x, y, dead: false, ph: Math.random() * 6 }); }
function crab(x) { objs.push({ k: "crab", x, dead: false, ph: Math.random() * 6 }); }
function arc(x0, x1, hy, n) { for (let i = 0; i < n; i++) { const t = n === 1 ? .5 : i / (n - 1); fruit(x0 + (x1 - x0) * t, U * .8 + Math.sin(t * Math.PI) * hy); } }

function genChunk() {
  const d = camX / U / 10;                      // الصعوبة
  const x = genX, r = Math.random();
  let len;
  if (r < 0.14) {                               // خط فاكهة
    arc(x + U, x + U * 8, U * 1.2, 7); len = U * 11;
  } else if (r < 0.34) {                        // صناديق
    const n = 2 + (Math.random() * 3 | 0);
    for (let i = 0; i < n; i++) { crate("c", x + U * 3 + i * U * 4.2); if (Math.random() < .5) fruit(x + U * 3 + i * U * 4.2, U * 3.3); }
    len = U * (6 + n * 4.2);
  } else if (r < 0.46) {                        // برج صناديق
    const h = 2 + (Math.random() < .4 ? 1 : 0);
    for (let l = 0; l < h; l++) crate(l === h - 1 && Math.random() < .3 ? "q" : "c", x + U * 5, l);
    arc(x + U * 1.5, x + U * 3.5, U * .6, 3); len = U * 12;
  } else if (r < 0.62) {                        // حفرة
    const w = U * (4 + Math.random() * 2.6 + Math.min(1.5, d * .15));
    pits.push({ x0: x + U * 4, x1: x + U * 4 + w });
    arc(x + U * 3.2, x + U * 4 + w + U * .8, U * 3.2, 7);
    len = U * 4 + w + U * 6;
  } else if (r < 0.74 && d > 0.3) {             // TNT
    if (Math.random() < .6) crate("c", x + U * 2);
    crate("tnt", x + U * 7);
    arc(x + U * 5, x + U * 9, U * 3.4, 5); len = U * 13;
  } else if (r < 0.86 && d > 0.2) {             // سلاطعين
    const n = 1 + (d > 3 && Math.random() < .5 ? 1 : 0);
    for (let i = 0; i < n; i++) crab(x + U * (6 + i * 4));
    fruit(x + U * 8, U * 2.2); len = U * 12;
  } else if (r < 0.93) {                        // قناع
    crate("aku", x + U * 3); crate("q", x + U * 7.5); len = U * 11;
  } else {                                      // صندوق نطّاط
    crate("b", x + U * 4); arc(x + U * 4.5, x + U * 10, U * 2, 6);
    for (let i = 0; i < 4; i++) fruit(x + U * (5.5 + i * 1.4), U * 7.5);
    len = U * 13;
  }
  genX += len + U * (1.5 + Math.random() * 2);
}

/* ---------- تأثيرات ---------- */
function say(text, x, y, color = "#fff") { texts.push({ text, x, y, t: 0, color }); }
function burst(x, y, colors, n = 10, up = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = U * (2 + Math.random() * 6);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - U * up, t: 0, life: .7 + Math.random() * .4, c: colors[i % colors.length], r: U * (.1 + Math.random() * .16), rot: Math.random() * 6, plank: false });
  }
}
function planks(x, y) {
  for (let i = 0; i < 7; i++) parts.push({ x, y, vx: (Math.random() - .5) * U * 10, vy: -U * (3 + Math.random() * 7), t: 0, life: .9, c: i % 2 ? "#c98b3f" : "#8a5a21", r: U * .5, rot: Math.random() * 6, plank: true });
}
function setFace(k, d) { faceKind = k; faceT = d; }

const sy = h => GY - h;                          // ارتفاع → شاشة

function doJump() {
  if (state !== "play" || fell) return;
  if (yOff <= 0.01 || coyote > 0) { vy = U * 23; jumps = 1; coyote = 0; sfx.jump(); }
  else if (jumps < 2) { vy = U * 20; jumps = 2; sfx.jump2(); burst(sx(px()), sy(yOff), ["#fff", "#ffe14d"], 6, 0); }
}
function doSpin() {
  if (state !== "play" || fell || spinT > 0 || spinCD > 0) return;
  spinT = 0.55; spinCD = 0.15; sfx.spin(); setFace(4, 0.6);
}

  if (state !== "play") { if (k === "Enter" || k === " ") startGame(); return; }
  if (k === " " || k === "ArrowUp" || k === "w" || k === "W") { e.preventDefault(); doJump(); }

  ctx.font = "700 " + Math.max(20, U * 1.5) + "px 'Segoe UI',Tahoma,Arial,sans-serif";
  ctx.strokeText(t3, W - U, U * 1.6); ctx.fillStyle = "#ffe14d"; ctx.fillText(t3, W - U, U * 1.6);
  if (superT > 0) { ctx.fillStyle = "rgba(255,255,255,.3)"; rr(W / 2 - U * 4, U * 4.4, U * 8, U * .5, U * .25); ctx.fill(); ctx.fillStyle = "#ffe14d"; rr(W / 2 - U * 4, U * 4.4, U * 8 * Math.min(1, superT / 8), U * .5, U * .25); ctx.fill(); }
}
function drawFx() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c;
    if (p.plank) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r * .25, p.r * 2, p.r * .5); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
  }
  ctx.globalAlpha = 1; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  for (const t of texts) {
    ctx.globalAlpha = Math.max(0, 1 - t.t * t.t * .8);
    ctx.font = "700 " + Math.max(18, U * 1.2) + "px 'Segoe UI',Tahoma,Arial,sans-serif";
    ctx.lineWidth = 5; ctx.strokeStyle = "rgba(40,15,90,.85)"; const y = t.y - t.t * U * 2.5;
    ctx.strokeText(t.text, t.x, y); ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, y);
  }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = "rgba(255,255,255," + Math.min(.8, flash * 2) + ")"; ctx.fillRect(0, 0, W, H); }
}
function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * U * .6, (Math.random() - .5) * U * .6);
  drawBG(); drawPits();
  for (const o of objs) drawObj(o);
  drawPlayer(); drawFx();
  ctx.restore();
  if (state === "play") drawHUD();
}

/* ---------- المراحل ---------- */
const startEl = document.getElementById("start"), overEl = document.getElementById("over");
function startGame() {
  ac(); reset(); state = "play";
  startEl.classList.add("hide"); overEl.classList.add("hide");
  bJump.classList.remove("hide"); bSpin.classList.remove("hide");
}
function endGame() {
  state = "over"; sfx.over();
  bJump.classList.add("hide"); bSpin.classList.add("hide");
  const sc = Math.floor(score); let rec = false;
  if (sc > best) { best = sc; rec = true; try { localStorage.setItem("aboudi_crash_best", best); } catch (e) {} }
  document.getElementById("finalScore").textContent = sc + " نقطة";
  document.getElementById("finalMsg").innerHTML = (rec ? "🏆 رقم قياسي جديد! برافو عبودي!" : "أفضل نتيجة: " + best) +
    "<br>🍑 " + fruits + " فاكهة — 📦 " + crates + " صندوق — 🦀 " + kills;
  setTimeout(() => overEl.classList.remove("hide"), 600);
}
document.getElementById("playBtn").addEventListener("click", startGame);
document.getElementById("againBtn").addEventListener("click", startGame);

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === "play") update(dt);
  else { camX += dt * U * 4; runT += dt * 7; while (genX < camX + W + U * 12) genChunk(); objs = objs.filter(o => o.x === undefined || o.x > camX - U * 6); for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += U * 22 * dt; } parts = parts.filter(p => p.t < p.life); }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__dbg = () => ({ camX, yOff, lives, fruits, score, state, objs: objs.length });
</script>
