<style>
:root{
  color-scheme:dark;
  /* هوية أسس المسافر: أزرق #2884FF وكحلي #1F244E (من دليل الهوية). الخط الرسمي PNU إن كان مثبتاً على الجهاز، وإلا Tajawal */
  --page:#141834; --surface:#1F244E; --surface-2:#262C5E; --surface-3:#2F3670;
  --text:#ffffff; --text-2:#C9D0EE; --muted:#95A0D0;
  --grid:#2F3670; --axis:#3D4585; --border:rgba(255,255,255,.13);
  --brand:#2884FF; --navy:#1F244E;
  --s1:#2884FF; --s2:#A9CCFF; --s3:#7FB4FF;

  --accent:#2884FF;
  --radius:12px;
  --font:"PNU","Tajawal","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6}
body{overflow-x:hidden}
a{color:#9ec5f4}
button,select,input{font-family:inherit;font-size:14px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:20;background:#ffffff;border-bottom:4px solid var(--brand)}
.top-inner{max-width:1280px;margin:0 auto;padding:12px 16px 0}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title-row h1{font-size:20px;margin:0;font-weight:800;display:flex;align-items:center;gap:12px}
.mark{height:88px;width:auto;flex:none;display:block}
header.top h1{color:var(--navy)}
header.top .ttl small{color:#4A5080}
header.top .sub{color:#4A5080}
header.top nav.tabs button{color:#4A5080}
header.top nav.tabs button.on{color:var(--navy);border-bottom-color:var(--brand)}
header.top nav.tabs button:hover{color:var(--navy)}
.ttl{display:flex;flex-direction:column;line-height:1.25}
.ttl small{font-size:12px;font-weight:500;color:var(--text-2)}
.title-row .sub{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;margin-top:8px}
nav.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--text-2);padding:10px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
section.tab{display:none;padding-top:20px}
section.tab.on{display:block}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:16px;margin:0 0 8px}
.lead{color:var(--text-2);margin:0 0 16px;font-size:14px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-width:0}
.kpi .label{color:var(--text-2);font-size:13px}
.kpi .val{font-size:26px;font-weight:700;margin:4px 0 2px;letter-spacing:-.3px;direction:ltr;text-align:right}
.kpi .delta{font-size:12px;font-weight:600}
.delta.up{color:#6fd46f} .delta.down{color:#f09a9a} .delta.na{color:var(--muted);font-weight:400}
.src{display:block;color:var(--muted);font-size:11px;margin-top:6px;line-height:1.4;word-break:break-word}
.chart-box{position:relative;height:260px}
.chart-box.tall{height:340px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.crit{display:inline-flex;align-items:center;background:rgba(57,135,229,.14);color:#9ec5f4;border:1px solid rgba(57,135,229,.35);border-radius:6px;padding:0 6px;font-size:12px;font-weight:600;cursor:pointer;line-height:20px;margin:0 2px;font-family:inherit}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.tag.good{background:rgba(12,163,12,.15);color:#6fd46f}
.tag.bad{background:rgba(208,59,59,.15);color:#f09a9a}
.tag.warn{background:rgba(250,178,25,.13);color:#fad27a}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
td.cap{white-space:normal;min-width:220px;max-width:340px}
.table-wrap th{white-space:normal;line-height:1.3;vertical-align:bottom}
th{color:var(--text-2);font-weight:600;background:var(--surface-2);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th .arrow{color:var(--accent);margin-inline-start:4px}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
select,input[type=search]{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px;min-height:34px}
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.vcard .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.vcard .capt{font-weight:600}
.mets{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:12px 0}
.met{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.met b{display:block;font-size:16px;direction:ltr;text-align:right}
.met span{color:var(--muted);font-size:11px}
ul.reasons{margin:8px 0 0;padding-inline-start:18px}
ul.reasons li{margin:5px 0;color:var(--text-2)}
ul.reasons li strong{color:var(--text)}
.note{border-inline-start:3px solid var(--warning);background:rgba(250,178,25,.06);padding:10px 12px;border-radius:8px;color:var(--text-2);font-size:13px;margin:12px 0}
.note.info{border-color:var(--s1);background:rgba(57,135,229,.06)}
.note.bad{border-color:var(--critical);background:rgba(208,59,59,.06)}
.na-box{border:1px dashed var(--axis);border-radius:var(--radius);padding:14px;color:var(--muted);background:var(--surface)}
.rec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.rec .rh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.rec h3{margin:0}
.rec dl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:12px 0 0;font-size:14px}
.rec dt{color:var(--muted)}
.rec dd{margin:0;color:var(--text-2)}
.prio-h{background:rgba(208,59,59,.15);color:#f09a9a}
.prio-m{background:rgba(250,178,25,.13);color:#fad27a}
.prio-l{background:rgba(57,135,229,.14);color:#9ec5f4}
.cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cal .day{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.cal .day.off{opacity:.6}
.cal .day h4{margin:0 0 6px;font-size:15px}
.cal .time{font-size:18px;font-weight:700;direction:ltr;text-align:right}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.modal-bg.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:640px;width:100%;padding:20px;position:relative}
.modal .x{position:absolute;left:12px;top:12px;background:var(--surface-3);border:0;color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px}
.small{font-size:12px;color:var(--muted)}
h2,h3{font-weight:800}
.footlogo{display:block;height:96px;width:auto;margin:0 0 14px;background:#fff;padding:10px 14px;border-radius:12px}
.muted{color:var(--muted)}
.bar-inline{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;min-width:60px}
.bar-inline i{display:block;height:100%;background:var(--s1);border-radius:3px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:34px}
.btn:hover{border-color:var(--brand)} .btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn:disabled{opacity:.55;cursor:default}
header.top .btn{background:#fff;color:var(--navy);border-color:#c9d0ee}
header.top .btn:hover{border-color:var(--brand)}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:520px;margin-inline:auto;background:var(--brand);color:#fff;padding:10px 14px;border-radius:10px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:600}
.toast.on{opacity:1}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0 12px}
.formgrid label,label.inl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-2);min-width:0}
label.inl{flex-direction:row;align-items:center;gap:6px}
label.inl.wide{flex:1 1 200px} label.inl.wide input{flex:1;min-width:0}
.formgrid .wide{grid-column:1/-1}
input[type=text],input[type=date],input[type=number],textarea{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-family:inherit;font-size:14px;min-width:0;width:100%}
label.inl input[type=date]{width:auto}
textarea{resize:vertical}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow-y:auto;margin-bottom:10px;padding:2px}
.bubble{border-radius:12px;padding:10px 12px;border:1px solid var(--border);background:var(--surface);max-width:100%}
.bubble.user{background:var(--surface-3);align-self:flex-start}
.bubble .who{font-size:11px;color:var(--muted);margin-bottom:4px}
.bubble .txt{white-space:pre-wrap;line-height:1.75}
.askrow textarea{margin-bottom:6px}
.notes-txt{white-space:pre-wrap;color:var(--text-2);font-size:13px;margin:8px 0;max-height:12em;overflow:auto}
.prio-d{background:rgba(12,163,12,.15);color:#6fd46f}
footer{margin-top:32px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:12px}
@media (max-width:640px){
  .kpi .val{font-size:22px}
  .rec dl{grid-template-columns:1fr}
  .rec dt{margin-top:6px}
  h2{font-size:18px}
  .chart-box{height:230px}
  header.top{position:static}
  .mark{height:64px}
}
</style>

<header class="top"><div class="top-inner">
  <div class="title-row">
    <h1><img class="mark" src="/*LOGOC*/" alt="شعار أسس المسافر Osus Almosafer"><span class="ttl">داشبورد انستقرام<small>أسس المسافر · @osusalmosafer</small></span></h1>
    <div class="tools"><div class="sub" id="subline"></div><button class="btn" id="btn-refresh" hidden>حدّث من Windsor</button><button class="btn" id="btn-export" hidden>تصدير CSV</button></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main class="wrap" id="main"></main>
<div class="modal-bg" id="modalbg"><div class="modal"><button class="x" id="modalx" aria-label="إغلاق">×</button><div id="modalbody"></div></div></div>

<script>
const D = /*DATA*/null;
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf = n=>n==null?"—":Math.round(n).toLocaleString("en-US");
const nd = (n,d=1)=>n==null?"—":Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const pc = (x,d=1)=>x==null?"—":nd(x*100,d)+"%";
const rr = x=>`<bdi dir="ltr">r = ${nd(x,2)}</bdi>`;
const sum = a=>a.reduce((s,x)=>s+x,0);
const median = a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;if(!n)return null;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2};
const mean = a=>a.length?sum(a)/a.length:null;
const corr=(a,b)=>{const ma=mean(a),mb=mean(b);let sxy=0,sxx=0,syy=0;a.forEach((x,i)=>{sxy+=(x-ma)*(b[i]-mb);sxx+=(x-ma)**2;syy+=(b[i]-mb)**2});return sxy/Math.sqrt(sxx*syy)};
const WD=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const dstr = iso=>iso.slice(0,10);
const hhmm = iso=>iso.slice(11,16);

const CAT = D.cats;
const CATMETA = {A:["M9","Tutorial"],B:["M10","Listicle"],C:["M9","Demo"],D:null,E:null};
let P, S, lastT, A;
const DAY=864e5;
const topN=(o,n)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,n);
const wkStart = p=>{const d=new Date(p.ksa.slice(0,10)+"T00:00:00Z");d.setUTCDate(d.getUTCDate()-d.getUTCDay());return d.toISOString().slice(0,10)};

/* ---------- global stats (recomputed after a live refresh) ---------- */
function compute(){
P = D.posts;
P.forEach(p=>{
  p.er = p.reach? p.eng/p.reach : 0;
  p.shareRate = p.reach? p.shares/p.reach : 0;
  p.saveRate = p.reach? p.saves/p.reach : 0;
  p.watchS = p.avgWatch/1000;
  p.title = p.cap.length>90? p.cap.slice(0,88)+"…" : p.cap;
  p.hasCta = /الرابط|واتساب|احجز|للحجز|للاستفسار|شارك|احفظ/.test(p.cap);
});
S = {};
S.n = P.length;
S.views = sum(P.map(p=>p.views)); S.reach = sum(P.map(p=>p.reach)); S.eng = sum(P.map(p=>p.eng));
S.er = S.eng/S.reach;
S.medReach = median(P.map(p=>p.reach)); S.medViews = median(P.map(p=>p.views));
S.meanReach = mean(P.map(p=>p.reach));
S.medSkip = median(P.map(p=>p.skip)); S.medWatch = median(P.map(p=>p.watchS));
S.medEr = median(P.map(p=>p.er)); S.medShare = median(P.map(p=>p.shareRate)); S.medSave = median(P.map(p=>p.saveRate));
S.rSkip = corr(P.map(p=>p.skip),P.map(p=>p.reach));
S.rWatch = corr(P.map(p=>p.watchS),P.map(p=>p.reach));
S.rSkipLog = corr(P.map(p=>p.skip),P.map(p=>Math.log(p.reach)));
S.rWatchLog = corr(P.map(p=>p.watchS),P.map(p=>Math.log(p.reach)));
S.best = P.reduce((a,b)=>b.reach>a.reach?b:a);
S.followers = D.profile.followers_count;
S.newF30 = sum(D.daily.map(d=>d.newFollowers));
S.taps30 = sum(D.daily.map(d=>d.taps));
S.reach30 = sum(D.daily.map(d=>d.reach));
S.first = dstr(P[0].utc); S.last = dstr(P[P.length-1].utc);
lastT = new Date(P[P.length-1].utc).getTime();
S.recent = P.filter(p=>new Date(p.utc).getTime()>lastT-30*DAY);
S.prev = P.filter(p=>{const t=new Date(p.utc).getTime();return t<=lastT-30*DAY && t>lastT-60*DAY});
S.cats = Object.keys(CAT).map(k=>{
  const a=P.filter(p=>p.cat===k);
  return {k,name:CAT[k],n:a.length,posts:a,medReach:median(a.map(p=>p.reach)),sumViews:sum(a.map(p=>p.views)),
    sumReach:sum(a.map(p=>p.reach)),medEr:median(a.map(p=>p.er)),medShare:median(a.map(p=>p.shareRate)),
    medSave:median(a.map(p=>p.saveRate)),medWatch:median(a.map(p=>p.watchS)),medSkip:median(a.map(p=>p.skip)),
    max:a.length?Math.max(...a.map(p=>p.reach)):0,over5k:a.filter(p=>p.reach>=5000).length};
});
S.catBy = Object.fromEntries(S.cats.map(c=>[c.k,c]));
S.wd = WD.map((name,i)=>{const a=P.filter(p=>p.wd===i);return {i,name,n:a.length,med:median(a.map(p=>p.reach)),sumReach:sum(a.map(p=>p.reach))}});
S.hr = Array.from({length:24},(_,h)=>{const a=P.filter(p=>p.hr===h);return {h,n:a.length,med:median(a.map(p=>p.reach))}});
const wkMap={}; P.forEach(p=>{(wkMap[wkStart(p)]=wkMap[wkStart(p)]||[]).push(p)});
S.weeks = Object.keys(wkMap).sort().map(k=>({k,n:wkMap[k].length,med:median(wkMap[k].map(p=>p.reach)),sumReach:sum(wkMap[k].map(p=>p.reach))}));
A = D.audience;
S.countrySum = sum(Object.values(A.country));
}
compute();
const CN={SA:"السعودية",MA:"المغرب",OM:"عُمان",EG:"مصر",IQ:"العراق",KW:"الكويت",DZ:"الجزائر",AE:"الإمارات",JO:"الأردن",SY:"سوريا",BH:"البحرين",FR:"فرنسا",YE:"اليمن",IL:"إسرائيل",LY:"ليبيا",LB:"لبنان",TN:"تونس",QA:"قطر",BE:"بلجيكا",PS:"فلسطين",DE:"ألمانيا",TR:"تركيا"};
const CITYN={Riyadh:"الرياض",Jeddah:"جدة",Mecca:"مكة",Amman:"عمّان",Casablanca:"الدار البيضاء",Baghdad:"بغداد",Cairo:"القاهرة","Abu Dhabi":"أبوظبي","Algiers":"الجزائر العاصمة","Al-Sib (Muscat)":"السيب (مسقط)",Medina:"المدينة",Dubai:"دبي",Sharjah:"الشارقة",Dammam:"الدمام",Damascus:"دمشق",Tangier:"طنجة",Muscat:"مسقط"};

/* ---------- Meta criteria (from meta-criteria.md; source PDF page in brackets) ---------- */
const META = {
 M1:{p:"12، 14",t:"بنية الريل: تلتقط الانتباه (الخطّاف في أول ثوانٍ)، تحافظ عليه (شيء مفيد/ذو صلة)، تكافئه (payoff أو دعوة لإجراء)."},
 M2:{p:"14",t:"خمس طرق لالتقاط الانتباه: صوت لافت، إشراك الجمهور، معرفة مفيدة، إثارة الفضول، موقف مألوف."},
 M3:{p:"15",t:"للحفاظ على الانتباه: «ابدأ بما يريد جمهورك أن يعرفه، لا بما تريد أنت أن تقوله». أرِ كيف يعمل الشيء وسهّل فهمه."},
 M4:{p:"17",t:"للمكافأة: ختام بالمنتج/العلامة، دعوة لرأي الجمهور، رسم متحرك يوجّه لزر الإجراء، أو لمسة فكاهة."},
 M5:{p:"9",t:"65% من الريلز العضوية تستخدم نصاً فوق الفيديو؛ النص/الستيكر سجّل +11 نقطة استجابة إيجابية."},
 M6:{p:"8",t:"الإشارات الصوتية للعلامة رفعت الاستجابة الإيجابية +22 نقطة."},
 M7:{p:"10",t:"ريلز الإعلانات بحضور بشري حققت CTR أعلى بنسبة 27%."},
 M8:{p:"42",t:"فيديو 9:16 (+7 نقاط)، صوت موسيقى + تعليق (+15 نقطة)، احترام المنطقة الآمنة (CTR أعلى 39%)."},
 M9:{p:"29",t:"نوع القصة Tutorial: شارك معرفة أو بسّط شيئاً معقداً. الريلز التي تعرض Demo للمنتج سجلت +7 نقاط."},
 M10:{p:"27",t:"نوع القصة Listicle: نص فوق الفيديو يقسّم المحتوى إلى نقاط قصيرة."},
 M11:{p:"24–32",t:"ثمانية أنواع قصص: Photodump, Types-of, Listicle, Transition, Before & After, POV, Tutorial, Behind the Scenes."},

/* ---------- table helper ---------- */
function sortable(tblId, cols, rows, defKey, defDir=-1){
  let key=defKey, dir=defDir;
  const wrap=$("#"+tblId);
  function draw(){
    const r=[...rows].sort((a,b)=>{const x=cols.find(c=>c.k===key).v(a),y=cols.find(c=>c.k===key).v(b);return (typeof x==="string"?x.localeCompare(y):x-y)*dir});
    wrap.innerHTML=`<table><thead><tr>${cols.map(c=>`<th class="sortable ${c.num?"num":""}" data-k="${c.k}">${c.h}${c.k===key?`<span class="arrow">${dir<0?"▼":"▲"}</span>`:""}</th>`).join("")}</tr></thead><tbody>${r.map(x=>`<tr>${cols.map(c=>`<td class="${c.num?"num":""} ${c.cls||""}">${c.f?c.f(x):c.v(x)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    wrap.querySelectorAll("th.sortable").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k===key)dir=-dir;else{key=k;dir=-1}draw()});
  }
  draw();
}

/* ===================== 3) RESULTS ===================== */
function reasons(p){
  const L=[]; const dSkip=(p.skip-S.medSkip)*100, dW=p.watchS-S.medWatch;
  L.push(`<li><strong>الخطّاف (أول 3 ثواني):</strong> ${pc(p.skip)} تخطّوا الريل، ووسيط حسابك ${pc(S.medSkip)} (${dSkip>=0?"+":""}${nd(dSkip)} نقطة) — ${Math.abs(dSkip)<3?"قريب من الوسيط":dSkip<0?"أحسن من الوسيط":"أضعف من الوسيط"} ${crit("M1")}.</li>`);
  L.push(`<li><strong>إيش يخلي الناس يكملون:</strong> متوسط المشاهدة ${nd(p.watchS)} ثانية، والوسيط ${nd(S.medWatch)} (${dW>=0?"+":""}${nd(dW)} ث) — ${Math.abs(dW)<1?"قريب من الوسيط":dW>0?"فوق الوسيط":"تحت الوسيط"} ${crit("M1","M3")}.</li>`);
  const m=CATMETA[p.cat];
  L.push(`<li><strong>نوع الريل:</strong> ${CAT[p.cat]} — ${m?`يقابل ${m[1]} في ميتا ${crit(m[0])}`:`ما له نوع قصة يطابقه في ملف ميتا، وأقرب قاعدة ${crit("M3")} (ابدأ بالي يبي الجمهور يعرفه)`}.</li>`);
  L.push(`<li><strong>الدعوة في الآخر:</strong> ${p.hasCta?"الكابشن فيه دعوة (رابط/حجز/مشاركة/حفظ)":"ما فيه دعوة صريحة في الكابشن"} ${crit("M4")} — التفاعل الفعلي: مشاركة ${pc(p.shareRate,2)} (وسيط ${pc(S.medShare,2)})، حفظ ${pc(p.saveRate,2)} (وسيط ${pc(S.medSave,2)}).</li>`);
  return L.join("");
}

function toast(msg){
  let t=$("#toast"); if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}
  t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),4200);
}
const errMsg=e=>{
  const c=e&&e.code;
  const m={not_granted:"ما وافقت على الصلاحية.",needs_reauth:"لازم تعيد ربط الموصّل من claude.ai.",server_not_connected:"الموصّل غير مربوط عندك.",not_in_manifest:"الموصّل غير مسموح لهذي الصفحة.",
    rate_limited:"طلبات كثيرة، جرّب بعد شوي.",server_unavailable:"الخدمة ما ردّت، جرّب مرة ثانية.",cancelled:"تم الإلغاء.",tool_error:"الموصّل رجّع خطأ: "+(e&&e.message||""),
    invalid_json:"الرد ما جا بصيغة مفهومة.",prompt_too_large:"الطلب كبير."};
  return m[c]||("تعذّر التنفيذ"+(c?" ("+c+")":""));
};
/* shared db collections: subscribe once per collection, views re-render from o.rows */
const stores={};
async function store(name){
  if(stores[name]) return stores[name];
  const db=await capP.db; if(!db) return null;
  const col=db.collection(name);
  const o=stores[name]={col,rows:[],ready:false,err:null,subs:new Set()};
  o.unsub=col.onSnapshot(snap=>{o.rows=snap.docs.map(d=>({id:d.id,...d.data()}));o.ready=true;o.err=null;o.subs.forEach(f=>f())},e=>{o.err=e;o.ready=true;o.subs.forEach(f=>f())});
  return o;
}
function watch(o,root,fn,key="main"){o.wf=o.wf||{};const id=root.id+"|"+key;if(o.wf[id])o.subs.delete(o.wf[id]);const f=()=>{if(!document.body.contains(root)){o.subs.delete(f);return}fn()};o.wf[id]=f;o.subs.add(f);f()}
async function put(o,data,id){try{if(id)await o.col.doc(id).set(data);else await o.col.add(data);return true}catch(e){toast(errMsg(e));return false}}
async function patch(o,id,data){try{await o.col.doc(id).update(data);return true}catch(e){toast(errMsg(e));return false}}
async function del(o,id){try{await o.col.doc(id).delete();return true}catch(e){toast(errMsg(e));return false}}
const opts=(list,sel)=>list.map(([v,l])=>`<option value="${esc(v)}"${v===sel?" selected":""}>${esc(l)}</option>`).join("");

const postBySc=sc=>P.find(p=>p.sc===sc);
function csvOf(head,rows){const q=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return "﻿"+[head,...rows].map(r=>r.map(q).join(",")).join("\r\n")}
async function saveFile(filename,text){
  const d=await capP.downloads; if(!d){toast("التصدير يشتغل من رابط الداشبورد داخل claude.ai.");return}
  try{const r=await d.save({filename,data:text});if(r==="saved"||(r&&r.status==="saved"))toast("انحفظ الملف.")}catch(e){toast(e&&e.code==="cancelled"?"تم الإلغاء.":errMsg(e))}
}

function autoCat(c){
  if(/عرض|ريال|خصم|احجز الآن|بسعر|باقة/.test(c)) return "E";
  if(/كم (يبعد|تحتاج|يستغرق)|المسافة|مشي|دقائق|دقيقة/.test(c)) return "C";
  if(/(أقرب|أفخم|أفضل|أجمل)\s*\d|\d\s*(كافيهات|مواقع|فنادق|أماكن)|ترتيب|الأبواب الثلاثة/.test(c)) return "B";
  if(/كيف|طريقة|وين|أين|دليل|مواقف|احذر|نصائح|نصيحة/.test(c)) return "A";

}
function rowsOf(res){

  if(!Array.isArray(p)) throw {code:"shape",message:"شكل الرد غير متوقع"};

}

let refreshing=false;
async function liveRefresh(){

  try{
    const mcp=await capP.mcp; if(!mcp) throw {code:"server_not_connected"};
    const sig=()=>({signal:AbortSignal.timeout(120000),cache:{refresh:true}});
    const media=rowsOf(await mcp.callTool(WS,"get_data",{connector:"instagram",fields:MEDIA_F,date_preset:"last_90d"},sig()));
    btn.textContent="جارِ سحب الحساب…";

    let followers=null;
    try{const u=rowsOf(await mcp.callTool(WS,"get_data",{connector:"instagram",fields:["followers_count"],date_preset:"last_7d"},sig()));followers=Math.max(0,...u.map(x=>num(x.followers_count)))||null}catch(e){}
    const all=media.map(mapMedia).filter(p=>p.utc&&!p.utc.startsWith("Invalid"));
    const reels=all.filter(p=>p.cat).sort((a,b)=>a.utc.localeCompare(b.utc));
    if(!reels.length) throw {code:"shape",message:"ما رجعت ريلز"};
    D.posts=reels; D.others=all.filter(p=>!p.cat);
    const dd=daily.filter(r=>r.date&&r.reach_1d!=null).map(r=>({date:String(r.date).slice(0,10),reach:num(r.reach_1d),newFollowers:num(r.follower_count_1d),views:num(r.views),engaged:num(r.accounts_engaged),interactions:num(r.total_interactions),likes:num(r.likes),comments:num(r.comments),saves:num(r.saves),shares:num(r.shares),reposts:num(r.reposts),taps:num(r.profile_links_taps)})).sort((a,b)=>a.date.localeCompare(b.date));
    if(dd.length) D.daily=dd;
    if(followers) D.profile.followers_count=followers;
    D.pulledAt=todayStr(); D.liveAt=new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"});
    compute(); rerenderAll();
    toast(`تم التحديث: ${reels.length} ريل${D.others.length?` و${D.others.length} منشور غير ريل`:""}.`);
  }catch(e){ toast(e&&e.code==="shape"?("تعذّر قراءة رد Windsor: "+(e.message||"")):errMsg(e)); }
  finally{refreshing=false;btn.disabled=false;btn.textContent=old}
}

  $("#b-export").onclick=()=>saveFile(`osus-bookings-${todayStr()}.csv`,csvOf(["التاريخ","الريل","المصدر","النوع","العدد","القيمة","ملاحظة"],o.rows.map(r=>[r.date,r.sc,r.src,r.kind,r.n,r.value,r.note])));
  const draw=()=>{
    if(o.err){$("#bk-list").innerHTML=`<div class="note bad">تعذّر قراءة السجل (${esc(o.err.code||"")}).</div>`;return}
    const rows=[...o.rows].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const tot=k=>sum(rows.filter(r=>r.kind===k).map(r=>r.n||0));
    const by={}; rows.forEach(r=>{const k=r.sc||"—";(by[k]=by[k]||{b:0,i:0,v:0});if(r.kind==="booking"){by[k].b+=r.n||0;by[k].v+=r.value||0}else by[k].i+=r.n||0});
    const lines=Object.entries(by).filter(([k])=>k!=="—").map(([k,v])=>({p:postBySc(k),...v})).filter(x=>x.p).sort((a,b)=>(b.b+b.i)-(a.b+a.i));
    $("#bk-sum").innerHTML=`<div class="grid kpis">${kpi("حجوزات مؤكدة",nf(tot("booking")),null,"سجلّك")}${kpi("استفسارات",nf(tot("inquiry")),null,"سجلّك")}${kpi("قيمة الحجوزات (ريال)",nf(sum(rows.filter(r=>r.kind==="booking").map(r=>r.value||0))),null,"سجلّك")}${kpi("حجوزات لكل 10,000 وصول",lines.length?nd(sum(lines.map(l=>l.b))/sum(lines.map(l=>l.p.reach))*1e4,1):"—",null,"محسوب: الحجوزات المربوطة بريلز ÷ وصولها")}</div>
     ${lines.length?`<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>الريل</th><th class="num">وصول</th><th class="num">حجوزات</th><th class="num">استفسارات</th><th class="num">لكل 10,000 وصول</th></tr></thead><tbody>${lines.map(l=>`<tr><td class="cap">${linkP(l.p)}</td><td class="num">${nf(l.p.reach)}</td><td class="num">${nf(l.b)}</td><td class="num">${nf(l.i)}</td><td class="num">${nd((l.b+l.i)/l.p.reach*1e4,1)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="na-box" style="margin-top:12px">بعد ما تسجل حجوزات مربوطة بريلز يظهر هنا أي ريل يجيب حجز فعلي.</div>`}`;
    $("#bk-list").innerHTML=rows.length?`<table><thead><tr><th>التاريخ</th><th>الريل</th><th>المصدر</th><th>النوع</th><th class="num">العدد</th><th class="num">القيمة</th><th>ملاحظة</th><th></th></tr></thead><tbody>${rows.map(r=>{const p=postBySc(r.sc);return `<tr data-id="${esc(r.id)}"><td>${esc(r.date)}</td><td class="cap">${p?linkP(p):"—"}</td><td>${esc(r.src)}</td><td>${r.kind==="booking"?"حجز":"استفسار"}</td><td class="num">${nf(r.n)}</td><td class="num">${nf(r.value)}</td><td class="cap">${esc(r.note)}</td><td><button class="btn" data-del>حذف</button></td></tr>`}).join("")}</tbody></table>`:`<div class="na-box">السجل فاضي.</div>`;
  };
  $("#bk-list").onclick=async e=>{const b=e.target.closest("[data-del]");const tr=e.target.closest("[data-id]");if(!b||!tr)return;if(!b.dataset.sure){b.dataset.sure=1;b.textContent="تأكيد";return}await del(o,tr.dataset.id)};
  watch(o,root,draw);
};

/* ===================== VIDEO REVIEW + EXPERIMENTS ===================== */
const AUD=[["text","نص فوق الفيديو","M5"],["audio","صوت (موسيقى/تعليق)","M6"],["person","شخص في الفيديو","M7"],["r916","9:16","M8"],["safe","داخل المنطقة الآمنة","M8"]];
R.review=async function(){
  const root=$("#t-review");
  root.innerHTML=`<h2>مراجعة الفيديو والتجارب</h2><p class="lead">Windsor ما يقيس النص والصوت والوجه. تعبّي هنا بعينك لكل ريل، ونشوف هل لها أثر على وصولك أنت (مو على أرقام ميتا الإعلانية).</p><div id="rvbody"><div class="na-box">جارِ التحميل…</div></div>`;
  const oa=await store("audits"), oe=await store("experiments"); const body=$("#rvbody");
  if(!oa||!oe){body.innerHTML=NOCAP;return}
  body.innerHTML=`<h3>تحليل المراجعات</h3><div id="rv-an"></div>
   <h3 style="margin-top:18px">المراجعة لكل ريل</h3><div class="small">علّم ✓ لكل عنصر موجود. أول تعليم يحفظ الريل كمراجَع.</div><div class="table-wrap" id="rv-tbl"></div>
   <h3 style="margin-top:26px">سجل التجارب (A/B) <span class="small">${""}</span></h3>
   <div class="note info">ميتا توصي بتجربة أسبوعين، تثبيت باقي المتغيرات، وفرضية واضحة قبل التنفيذ ${crit("M13")}.</div>
   <div class="card"><div class="formgrid">
    <label>اسم التجربة<input type="text" id="e-name"></label>
    <label>المتغير الوحيد<input type="text" id="e-var" placeholder="مثال: ساعة النشر"></label>
    <label>النسخة A<input type="text" id="e-a"></label><label>النسخة B<input type="text" id="e-b"></label>
    <label>البداية<input type="date" id="e-start"></label><label>النهاية<input type="date" id="e-end"></label>
    <label class="wide">الفرضية<input type="text" id="e-hyp" placeholder="مثال: الريل الذي يبدأ بالمسافة أعلى وصولاً من الذي يبدأ بالسعر"></label></div>
    <div class="toolrow"><button class="btn primary" id="e-add">أضف التجربة</button></div></div>
   <div id="e-list" style="margin-top:12px"></div>`;
  const drawAn=()=>{
    const aud=Object.fromEntries(oa.rows.map(r=>[r.id,r]));
    const rev=P.filter(p=>aud[p.sc]);
    if(!rev.length){$("#rv-an").innerHTML=`<div class="na-box">ما فيه ريلز مراجَعة بعد. علّم ٣ ريلز على الأقل لكل حالة (فيه/ما فيه) عشان تظهر مقارنة.</div>`;return}
    $("#rv-an").innerHTML=`<div class="table-wrap"><table><thead><tr><th>العنصر</th><th>معيار ميتا</th><th class="num">فيه (عدد)</th><th class="num">وسيط وصول «فيه»</th><th class="num">ما فيه (عدد)</th><th class="num">وسيط وصول «ما فيه»</th><th>القراءة</th></tr></thead><tbody>${AUD.map(([k,l,m])=>{
      const y=rev.filter(p=>aud[p.sc][k]), n=rev.filter(p=>!aud[p.sc][k]); const ok=y.length>=3&&n.length>=3;
      const my=median(y.map(p=>p.reach)), mn=median(n.map(p=>p.reach));
      return `<tr><td>${l}</td><td>${crit(m)}</td><td class="num">${y.length}</td><td class="num">${ok?nf(my):"—"}</td><td class="num">${n.length}</td><td class="num">${ok?nf(mn):"—"}</td><td class="cap">${ok?(my>mn?"الريلز اللي فيها أعلى وسيطاً":"الريلز اللي فيها أقل وسيطاً")+" — عينة صغيرة، لا تثبت سببية":"العينة ما تكفي (٣ على الأقل لكل جهة)"}</td></tr>`}).join("")}</tbody></table></div><span class="src">المراجعات: ${rev.length} من ${P.length} ريل · Windsor media_reach + مراجعتك</span>`;
  };
  const drawTbl=()=>{
    const aud=Object.fromEntries(oa.rows.map(r=>[r.id,r]));
    $("#rv-tbl").innerHTML=`<table><thead><tr><th>الريل</th><th class="num">وصول</th>${AUD.map(a=>`<th>${a[1]}</th>`).join("")}</tr></thead><tbody>${[...P].sort((a,b)=>b.utc.localeCompare(a.utc)).map(p=>{const a=aud[p.sc];return `<tr data-sc="${esc(p.sc)}"><td class="cap">${linkP(p)}</td><td class="num">${nf(p.reach)}</td>${AUD.map(([k,l])=>`<td style="text-align:center"><input type="checkbox" data-k="${k}" aria-label="${esc(l)}"${a&&a[k]?" checked":""}></td>`).join("")}</tr>`}).join("")}</tbody></table>`;
  };
  $("#rv-tbl").onchange=async e=>{const c=e.target.closest("input[data-k]");const tr=e.target.closest("[data-sc]");if(!c||!tr)return;
    const cur=oa.rows.find(r=>r.id===tr.dataset.sc)||{}; const next={text:!!cur.text,audio:!!cur.audio,person:!!cur.person,r916:!!cur.r916,safe:!!cur.safe,at:Date.now()};next[c.dataset.k]=c.checked;
    if(!await put(oa,next,tr.dataset.sc)) c.checked=!c.checked};
  let tblDrawn=false;
  watch(oa,root,()=>{if(!tblDrawn){drawTbl();tblDrawn=true}drawAn()},"a");
  $("#e-add").onclick=async()=>{const name=$("#e-name").value.trim(),hyp=$("#e-hyp").value.trim();if(!name||!hyp){toast("اكتب اسم التجربة والفرضية.");return}
    if(await put(oe,{name,hyp,variable:$("#e-var").value.trim(),a:$("#e-a").value.trim(),b:$("#e-b").value.trim(),start:$("#e-start").value,end:$("#e-end").value,status:"planned",result:"",decision:"",at:Date.now()})){["e-name","e-var","e-a","e-b","e-hyp"].forEach(i=>$("#"+i).value="")}};
  const ES=[["planned","مخطط"],["running","شغّال"],["done","انتهى"]];
  const drawE=()=>{
    if(oe.err){$("#e-list").innerHTML=`<div class="note bad">تعذّر قراءة التجارب (${esc(oe.err.code||"")}).</div>`;return}
    const rows=[...oe.rows].sort((a,b)=>(b.at||0)-(a.at||0));
    $("#e-list").innerHTML=rows.length?rows.map(r=>`<div class="rec" data-id="${esc(r.id)}"><div class="rh"><h3>${esc(r.name)}</h3><span class="tag ${r.status==="done"?"good":""}">${esc((ES.find(s=>s[0]===r.status)||[])[1]||"")}</span></div>
      <dl><dt>الفرضية</dt><dd>${esc(r.hyp)}</dd><dt>المتغير</dt><dd>${esc(r.variable)} — A: ${esc(r.a)} / B: ${esc(r.b)}</dd><dt>المدة</dt><dd>${esc(r.start||"—")} → ${esc(r.end||"—")}</dd></dl>
      <div class="toolrow"><label class="inl">الحالة <select data-f="status">${opts(ES,r.status)}</select></label><label class="inl wide">النتيجة <input type="text" data-f="result" value="${esc(r.result)}"></label><label class="inl wide">القرار <input type="text" data-f="decision" value="${esc(r.decision)}"></label><button class="btn" data-del>حذف</button></div></div>`).join(""):`<div class="na-box">ما فيه تجارب بعد. أول تجربة مقترحة: نفس نوع الريل بموعدين مختلفين لأسبوعين.</div>`;
  };
  $("#e-list").onchange=async e=>{const el=e.target.closest("[data-f]");const card=e.target.closest("[data-id]");if(!el||!card)return;await patch(oe,card.dataset.id,{[el.dataset.f]:el.value})};
  $("#e-list").onclick=async e=>{const b=e.target.closest("[data-del]");const card=e.target.closest("[data-id]");if(!b||!card)return;if(!b.dataset.sure){b.dataset.sure=1;b.textContent="تأكيد";return}await del(oe,card.dataset.id)};
  watch(oe,root,drawE,"e");
};

/* ===================== WEEKLY HISTORY ===================== */
function weekSnapshot(){
  const dd=D.daily, w=dd.slice(-7); if(w.length<7) return null;
  const t=k=>sum(w.map(d=>d[k]));
  const end=w[w.length-1].date, start=w[0].date;
  const wp=P.filter(p=>dstr(p.ksa)>=start&&dstr(p.ksa)<=end);
  return {weekStart:start,weekEnd:end,reach7:t("reach"),views7:t("views"),inter7:t("interactions"),newF7:t("newFollowers"),taps7:t("taps"),posts7:wp.length,
    bestReach:wp.length?Math.max(...wp.map(p=>p.reach)):null,medReach90:S.medReach,followers:S.followers,savedAt:Date.now()};
}
R.history=async function(){
  const root=$("#t-history");
  root.innerHTML=`<h2>السجل الأسبوعي</h2><p class="lead">Windsor يعطي أرقام الحساب اليومية لآخر 30 يوماً فقط. نحفظ هنا لقطة كل أسبوع عشان يتكوّن تاريخ تقدر تقارن منه شهر بشهر.</p><div id="hsbody"><div class="na-box">جارِ التحميل…</div></div>`;
  const o=await store("snapshots"); const body=$("#hsbody");
  if(!o){body.innerHTML=NOCAP;return}
  const cur=weekSnapshot();
  body.innerHTML=`<div class="toolrow"><button class="btn primary" id="h-save"${cur?"":" disabled"}>احفظ لقطة آخر 7 أيام${cur?` (${cur.weekStart} → ${cur.weekEnd})`:""}</button></div>
   <div class="card" style="margin-top:12px"><h3>وصول الحساب (مجموع 7 أيام) لكل أسبوع محفوظ</h3><div class="chart-box"><canvas id="c-hist"></canvas></div><span class="src">لقطات محفوظة من Windsor · reach_1d مجموع أسبوعي، يتكرر فيه الأشخاص</span></div>
   <div class="table-wrap" style="margin-top:12px" id="h-tbl"></div>`;
  $("#h-save").onclick=async()=>{const s=weekSnapshot();if(!s)return;if(await put(o,s,s.weekEnd)) toast("انحفظت اللقطة.")};
  let ch=null;
  const draw=()=>{
    if(o.err){$("#h-tbl").innerHTML=`<div class="note bad">تعذّر قراءة السجل (${esc(o.err.code||"")}).</div>`;return}
    const rows=[...o.rows].sort((a,b)=>a.weekEnd.localeCompare(b.weekEnd));
    if(ch){ch.destroy();const i=charts.indexOf(ch);if(i>=0)charts.splice(i,1)}
    $("#h-tbl").innerHTML=rows.length?`<table><thead><tr><th>الأسبوع</th><th class="num">وصول</th><th class="num">مشاهدات</th><th class="num">تفاعل</th><th class="num">متابعون جدد</th><th class="num">نقرات البروفايل</th><th class="num">ريلز</th><th class="num">أعلى وصول ريل</th></tr></thead><tbody>${[...rows].reverse().map(r=>`<tr><td>${esc(r.weekStart)} → ${esc(r.weekEnd)}</td><td class="num">${nf(r.reach7)}</td><td class="num">${nf(r.views7)}</td><td class="num">${nf(r.inter7)}</td><td class="num">${nf(r.newF7)}</td><td class="num">${nf(r.taps7)}</td><td class="num">${nf(r.posts7)}</td><td class="num">${nf(r.bestReach)}</td></tr>`).join("")}</tbody></table>`:`<div class="na-box">ما فيه لقطات محفوظة. اضغط «احفظ لقطة» أو انتظر تقرير الأحد.</div>`;
    if(rows.length){mk("c-hist",{type:"bar",data:{labels:rows.map(r=>r.weekEnd.slice(5)),datasets:[{data:rows.map(r=>r.reach7),backgroundColor:"#2884FF",borderRadius:3,maxBarThickness:36}]},options:barOpts({plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>rows[i[0].dataIndex].weekStart+" → "+rows[i[0].dataIndex].weekEnd,label:c=>"وصول: "+nf(c.raw)}}}})});ch=charts[charts.length-1]}
  };
  watch(o,root,draw);
};

show((location.hash||"#overview").slice(1)in R?(location.hash||"#overview").slice(1):"overview");
})();
</script>
